.ghd{display:flex;align-items:stretch;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s1)}
.ghd > .vr{align-self:center;margin-bottom:7px}
/* the CTAs and the search bar are two faces of the same block */
.ghd .stage{position:relative;flex:1;min-width:0;min-height:35px;padding-bottom:6px;
  perspective:800px;transform-style:preserve-3d}
.ghd .face{position:absolute;left:0;right:0;top:0;bottom:6px;
  display:flex;align-items:center;gap:var(--s2);
  backface-visibility:hidden;transform-origin:center center}
.ghd .right{display:flex;align-items:center;gap:var(--s2);min-height:35px;padding-bottom:6px}
/* the connection name sits on its own line above the group's controls */
.tname{display:flex;align-items:center;gap:var(--rd-sys-spacing-c);min-height:20px;
  padding:9px 0 12px;cursor:pointer}
/* a dotted leader carries the eye from the connection name across to its count */
.leader{flex:1;min-width:var(--s3);height:0;border-top:1px dotted var(--hairline)}
/* the group's controls belong to the list below them, so they sit tight to it */
.group > .ghd{margin-bottom:0}
.group > .ghd > .left,.group > .ghd > .gright{min-height:24px;padding-bottom:0}
/* group headers reuse the same rhythm as the top-level CTAs */
.ghd > .left{display:flex;align-items:center;gap:var(--s2);min-width:0;min-height:35px;padding-bottom:6px}
.ghd > .gright{display:flex;align-items:center;gap:var(--s2);min-height:35px;padding-bottom:6px;flex:0 0 auto}
/* A rule between two things on one line. Radiant's Divider is horizontal only, so
   this stays the prototype's -- it takes the same border-subtle the Divider does. */
.vr{width:1px;height:14px;background:var(--hairline);flex:0 0 auto;display:inline-block}
/* inside a run of text it needs the space a separator would have had */
.gcount .vr{vertical-align:-2px;margin:0 var(--s1)}
/* a permanent search field: its active state is a rule that grows out of the
   centre, so nothing about the field's box changes when it takes focus */
/* the rule belongs to the whole row, not just the input, so it spans the full
   content width with the clear CTA sitting above its right-hand end */
.srow{position:relative;display:flex;align-items:center;margin-bottom:var(--s3)}
/* the bulk-select control sits ahead of the field and folds away once a query
   narrows the list, letting the field take the width it frees */
/* The contents are pinned to the right of the box, so as it folds they stay flush
   against the field: the divider never lags behind the field's moving edge.
   The trailing gap is inside them, so a zero-width box closes the space too. */
.sall{position:relative;flex:0 0 auto;height:28px;overflow:hidden}
.sallin{position:absolute;top:0;right:0;height:100%;display:flex;align-items:center;
  gap:var(--s2);padding-right:var(--s2);white-space:nowrap}
/* Radiant's SearchBar, boxed. The component brings its own magnifier, its own clear,
   its own focus border and its own width -- the page sets none of them, so the field
   sits at the size the component ships at rather than filling the column. The two
   inside menus keep the flush underline, which is the divider Menu.css expects
   between a menu's search and its list. */
/* the bulk-select control beside it stands to the same height as the field */
.srow .sall{height:34px}
/* The history's two filters are Radiant Selects: the field box is the trigger, the
   value sits in it and the chevron closes it. Only the width is the page's -- each
   one hugs its own label rather than filling a column. */
.ddbtn{width:auto;background:transparent}
.dd.open .ddbtn{border-color:var(--rd-sys-color-border-brand)}
#winLabel{color:var(--text)}

/* dropdown */
.dd{position:relative}
.dd .cur{display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:var(--text);font-family:'Geist Mono',Menlo,monospace;font-size:12px;letter-spacing:.02em;padding:4px 8px;margin:-4px -8px;border-radius:var(--rd-sys-radius-6)}
.dd .cur:hover{background:var(--ghost-hover)}
.dd .cur .car{color:var(--icon-dim)}
/* A menu is Radiant's .rad-menu: the surface, its items, its divider. Where it
   opens from is the page's. */
.dd .menu{
  position:absolute;right:0;top:calc(100% + 4px);min-width:172px;
  display:none;z-index:30;
}
.dd.open .menu{display:flex}
/* the rows inside are .rad-menu-item, so all the page sets is that they fill */
.dd .menu button.rad-menu-item{width:100%}
/* the filter row: the same box the search fields occupy on the scope pages, so the
   list below starts at the height the eye already expects */
.frow{gap:var(--s2);flex-wrap:wrap}
.frow .dd .menu{left:0;right:auto}
.frow .fgap{flex:1;min-width:0}
.frow .fby{flex:0 0 auto}
/* A menu that stays open while several things are picked out of it. The list inside
   is the models page's list, scaled to the surface: the same bulk-select-and-search
   row, the same tri-state box, plug, dotted leader and `n/m selected` count on a
   connection, and the same row with its name and right-aligned meta. Only the
   measurements shrink -- 8pt gaps become 8px, 14px names become 13px. */
/* wide enough that the search field reads as a field rather than a slot */
.dd .menu.wide{width:352px}
.dd .menu .mbody{max-height:302px;overflow-y:auto;scrollbar-gutter:stable}
/* the bulk row, in the shape of a page's .srow */
.msrow{display:flex;align-items:center;padding:6px 10px 10px}
.msrow .vr{margin:0 10px}
.msf{flex:1;min-width:0}
.msrow .rad-field__box--underline{padding:4px 0}
.msrow .rad-link{flex:0 0 auto}
/* the group header and its rows, at menu scale */
.mtree .tname{gap:8px;min-height:0;padding:10px 10px 6px}
.mtree .tname .lbl{font-size:var(--rd-sys-type-caption-size);letter-spacing:.04em;
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* the models are the connection's, so they start inside it */
.mtree .row{gap:8px;padding:7px 10px 7px var(--s4);margin:0;
  border-radius:var(--rd-sys-radius-6)}
.mtree .row .nm{font-size:var(--rd-sys-type-body-size);color:var(--text-dim)}
.mtree .row.on .nm{color:var(--text)}
/* a group is its own block, so the headings read as headings */
.mtree .group + .group{margin-top:10px}
/* the card closes on the same pair the range does: what it would do on the left,
   the act of doing it on the right */
/* Radiant's menu footer, holding three things rather than one clear-all */
/* Radiant's menu footer is a 40px strip, sized for a tertiary text button. This one
   holds a full-size primary, so it gives up the fixed height and pads to it. */
.mfoot{height:auto;padding:var(--rd-sys-spacing-c) var(--rd-sys-spacing-d);
  gap:var(--rd-sys-spacing-b);flex:0 0 auto}
.mfoot .mono{flex:1;min-width:0;white-space:nowrap}
/* the menu's rows are full-width buttons; the footer's two controls are not */
.dd .menu .mfoot .rad-toggle{flex:0 0 auto}
.dd .menu .mfoot .rad-btn{display:inline-flex;width:auto;text-align:center}
/* the same reveal the run results list uses: each row in a grid row that folds to
   nothing, so it can be animated on the live node without a re-render */
.mtree .slot{display:grid;grid-template-rows:1fr;overflow:hidden;
  transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1)}
.mtree .group.collapsed .slot{grid-template-rows:0fr}
.mtree .sinner{min-height:0}
/* the header's gap is cancelled so the chevron sits on the name */
/* The glyph sits in a square box of its own: centred there, it rotates about its own
   middle and lines up with the caps beside it rather than on its own baseline, which
   leaves it sitting a pixel low -- hence the nudge, carried into both states. */
.mtree .chev{flex:0 0 auto;display:flex;color:var(--icon-dim);
  transform:translateY(-1px);
  transition:transform .3s cubic-bezier(.32,.72,0,1),color .12s}
.mtree .group:not(.collapsed) .chev{transform:translateY(-1px) rotate(90deg)}
/* the name opens the group; only the box picks it */
.mtree .tname.can-toggle{cursor:pointer}
.mtree .tname.can-toggle:hover .chev{color:var(--text)}
.mtree .tname .rad-check{cursor:pointer}
/* the custom range is two plain fields: the runs are stamped by day, so a day at
   each end is the whole of the question */
/* wide enough for the range from the outset: opening it should reveal the fields,
   not resize the menu under the pointer */
.tmenu{width:252px}

/* the menu's own rows are full-width; the range's two CTAs are not */
.dd .menu .rcta .rad-btn{display:inline-flex;width:auto;text-align:center}
.tmenu .trule{margin:var(--rd-sys-spacing-a) 0}
/* the custom range is a menu item that opens into the menu rather than out of it,
   so its chevron turns down the way a disclosure does */
.tcustom .chev{transition:transform .3s cubic-bezier(.32,.72,0,1)}
.tcustom.open .chev{transform:rotate(90deg)}
.rwrap{padding:var(--rd-sys-spacing-b) var(--rd-sys-spacing-d) var(--rd-sys-spacing-b)}
#grpNote{font-size:var(--rd-sys-type-caption-size);flex:0 0 auto;margin-right:var(--s2)}

.dd .menu .mgrp{display:flex;align-items:center;gap:8px}
.dd .menu .mgrp .gtog{margin-left:auto;text-transform:none;letter-spacing:.02em;
  font-size:var(--rd-sys-type-caption-size);cursor:pointer;color:var(--text-dim);
  border-bottom:1px solid transparent}
.dd .menu .mgrp .gtog:hover{color:var(--text);border-bottom-color:var(--hairline-hover)}
.rfield{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);margin-bottom:8px}
.rfield:last-of-type{margin-bottom:0}
/* each end of the range is a Radiant Field; only the mono figures are the page's */
.rfield .rad-field__box{padding:2px var(--rd-sys-spacing-b);min-height:28px}
.rfield input{font-family:var(--rd-sys-font-family-mono);
  font-size:var(--rd-sys-type-caption-size)}
/* an empty field is a placeholder, so it reads as one until a date is in it */
.rfield input.empty{color:var(--rd-sys-color-content-secondary)}
.rfield input::-webkit-calendar-picker-indicator{cursor:pointer}
/* the browser draws this glyph dark, so it only needs turning over on a dark ground */
[data-theme='dark'] .rfield input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.rcta{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2);margin-top:10px}
#ddTime.set .ddbtn,.dd.ms.set .ddbtn{border-color:var(--text)}

/* run / results split */
/* the run reuses the model page's shape: the list stays where it was and the
   detail panel takes width from its right, sliding the content left */
#viewRun{flex:1;min-height:0}
.runmain{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
/* the fold wrapper carries the search row's trailing padding, which would hold the
   button 16px shy of the content's right edge */
#newRunWrap .sallin{padding-right:0}
/* the fold clips whatever is inside it, so it has to be as tall as the button --
   28px shaved the button's rounded top and bottom off */
#newRunWrap{height:34px}
.xwrap{flex:0 0 auto;overflow:hidden;display:flex}
.xin{display:flex;align-items:center;padding-left:var(--s2)}

.runmain > .wrap{flex:1;min-height:0;display:flex;flex-direction:column;width:100%;
  box-sizing:border-box;padding-bottom:0}
#runList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:0 var(--rd-sys-spacing-d) var(--s5)}
.detail{flex:0 0 auto;width:0;overflow:hidden;border-left:1px solid transparent;
  transition:width .42s cubic-bezier(.32,.72,0,1),border-color .2s}
#viewRun.open .detail{width:50vw;border-left-color:var(--hairline)}
/* the panel keeps its heading and its select-all in place; the cards are the only
   thing that moves, so the model you are reading never loses its own title */
.detail .pane{width:50vw;height:100%;display:flex;flex-direction:column;
  overflow:hidden;padding:var(--s4) var(--s4) 0}
.phd{flex:0 0 auto}
/* stepping through the models that have instructions, without going back to the list:
   two ghost IconButtons, each nudging its own way on hover */
.pnav{display:flex;align-items:center;gap:2px;margin:0 0 var(--s2) -6px}
/* Moving between models, closing the panel, dismissing the run bar: these are the
   page's own controls rather than something offered in passing, so they read at
   Content/Primary instead of the ghost IconButton's Secondary. */
.navb,.panelclose{color:var(--rd-sys-color-content-primary)}
.navb .rad-icon{transition:transform .18s}
.navb:not(:disabled):hover .rad-icon{transform:translateX(-2px)}
.navb.next:not(:disabled):hover .rad-icon{transform:translateX(2px)}
.pbody{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-gutter:stable;
  margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:0 var(--rd-sys-spacing-d) 104px}
/* the states that are a single message rather than a list scroll as one block */
.pane > .inner{flex:1;min-height:0;overflow-y:auto;scrollbar-gutter:stable;
  padding-bottom:104px}
.panelclose{position:absolute;top:var(--s4);right:var(--s4);z-index:5}
/* The panel's progress, on its own top edge: the page rail's band, scoped to the
   one model being written into rather than to the run. */
.pprog{position:absolute;left:0;right:0;top:0;height:4px;z-index:6;
  overflow:hidden;pointer-events:none;display:none}
.pprog.on{display:block}
.psnake{position:absolute;left:0;right:0;top:0;height:4px;border-radius:2px;
  transform-origin:left center;background:var(--rd-sys-color-bg-brand)}
/* What the model got: under the model's name, ahead of the instructions it is
   reporting on. It holds until it is closed. */
.panenote{display:none;flex:0 0 auto;margin:var(--s3) 0 0}
/* standing down while the write is in flight, at the system's disabled strength.
   It switches rather than fades: a control going unavailable is a state, and the
   band on the top edge is what carries the motion. */
.pane.writing .mlist,
.pane.writing #mAllWrap{opacity:.4}
.panenote.on{display:flex}
.panenote .rad-banner__body{flex:1 1 auto}
.detail{position:relative}
/* A row that is still working: dim text with a highlight travelling through it.
   Both ends come from the --shim-* pair above, which each theme names for itself. */
.shimmer.acc{
  background-image:linear-gradient(90deg,var(--shim-acc-rest) 28%,
    var(--shim-acc-flare) 50%,var(--shim-acc-rest) 72%);
}
.shimmer{
  background:linear-gradient(90deg,var(--shim-rest) 28%,
    var(--shim-flare) 50%,var(--shim-rest) 72%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 1.9s linear infinite;
}
@keyframes shim{from{background-position:150% 0}to{background-position:-150% 0}}
/* the text must be transparent for the clipped gradient to show through, and this
   has to outrank the per-row colour rules below or the gradient is painted over */
.mono.shimmer,#runList .gcount .mono.shimmer{color:transparent}
/* One pass of light travelling across accent text, then done -- the confirmation
   is a single event, not something still working. */
.sweepacc{
  background:linear-gradient(90deg,var(--accent) 30%,var(--sweep-flare) 50%,var(--accent) 70%);
  background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shim 1.05s linear 1 both;
}
/* until a row's work is done it stays secondary; finished rows read at full strength */
#runList .row .nm,#runList .tname .lbl{color:var(--text-dim)}
#runList .row.ready .nm,#runList .tname.ready .lbl{color:var(--text)}
/* nothing has been generated for these yet, so they sit a step further back */
#runList .row.skip .nm{color:var(--icon-dim)}
/* an instruction that has been written into the model reads as settled */
/* only a row that leads somewhere offers the hand; the rest are plain content
   with a link inside them */
#runList .row{cursor:default}
#runList .row.ready{cursor:pointer}
#runList .tname{cursor:default}
/* Instructions generated and not read yet: a dot at the head of the row. It takes its
   own place in the row, so the name slides aside for it under FLIP -- transforms
   only, the same as every other slide -- while the dot itself just fades. */
/* Every row opens on the same slot, so the names line up whatever state the row is
   in: the spinner while it generates, otherwise the dot -- lit while its instructions
   are unread, muted once they have been. A model still waiting on its connection
   carries the muted dot too, so the column is whole from the moment the run starts. */
#runList .row .rowlead{flex:0 0 14px;display:flex;align-items:center;justify-content:center}
#runList .row .newdot{flex:0 0 auto;width:5px;height:5px;border-radius:50%;
  background:var(--accent);
  animation:dotPulse 1.9s ease-in-out infinite}
/* A model already read keeps the dot in its place -- same size, same axis -- so the
   name never moves and the list reads as one column. Only its colour changes: the
   subtle border grey rather than the brand, and no breath. */
#runList .row .newdot.rest{background:var(--rd-sys-color-border-subtle);
  animation:none;box-shadow:none}
/* arriving, it fades up first and then falls into the pulse */
#runList .row .newdot.in{animation:dotIn .26s ease both,
  dotPulse 1.9s ease-in-out .26s infinite}
/* brightest at the top of the breath, where it also carries a soft halo */
@keyframes dotPulse{
  0%,100%{opacity:1;
    box-shadow:0 0 6px 1px color-mix(in srgb,var(--rd-sys-color-content-brand) 50%,transparent)}
  50%{opacity:.32;box-shadow:0 0 0 0 transparent}
}
@keyframes dotIn{from{opacity:0}to{opacity:1}}
#runList .row .nm{flex:0 1 auto}
#runList .row .grow{flex:1 1 auto;min-width:var(--s2)}
/* Folding a row away: its grid track animates from 1fr to 0fr, so no height has to
   be measured and the row stays in the DOM and in its place. One wrapper per row,
   rather than one per group, is what keeps the list in its original order.
   The negative margin matches the row's own bleed so the clip never cuts the
   hover state's rounded corners. */
#runList .slot{display:grid;grid-template-rows:1fr;overflow:hidden;
  margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:0 var(--rd-sys-spacing-d);
  transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1)}
#runList .group.collapsed .slot{grid-template-rows:0fr}
#runList .sinner{min-height:0}
#runList .tname.can-toggle{cursor:pointer}
/* the header's own 16px gap is cancelled so the chevron sits on the name */
#runList .chev{flex:0 0 auto;display:flex;margin-left:-8px;color:var(--icon-dim);
  transition:transform .3s cubic-bezier(.32,.72,0,1),color .12s}
#runList .group:not(.collapsed) .chev{transform:rotate(90deg)}
#runList .tname.can-toggle:hover .chev{color:var(--text)}
#modelHead .tname{cursor:default}
/* the name is what a run's hover summary hangs off, now the glyph has gone */
#runList .tname.ready .lbl.hastip{cursor:help}
/* The hover summary is Radiant's Tooltip. It holds rows rather than a sentence, so
   it stacks and drops the component's 280px cap; the bubble itself -- inverse fill,
   menu elevation, caption text -- is the component's. */
.tip{flex-direction:column;align-items:stretch;gap:5px;max-width:none;
  opacity:0;transform:translateY(-3px);
  transition:opacity .14s,transform .18s cubic-bezier(.32,.72,0,1)}
.tip.in{opacity:1;transform:none}
.tip .trow{display:flex;align-items:baseline;gap:var(--s3);white-space:nowrap}
.tip .tk{color:var(--rd-sys-color-content-inverse);opacity:.7}
/* a column of figures, set the way every other figure in the portal is */
.tip .tv{margin-left:auto;color:var(--rd-sys-color-content-inverse);
  font-family:var(--rd-sys-font-family-mono);font-variant-numeric:tabular-nums}

#runList .row .meta{display:flex;align-items:center;gap:var(--s2)}
/* Hovering the CTA draws a dotted line across to the name it belongs to, so the two
   ends of a wide row are visibly connected. The line grows from the name outward;
   its dots are a fixed-size repeating background, so they are revealed one by one
   rather than stretched. */
#runList .row{position:relative}
#runList .row .grow{position:relative}
#runList .row.skip .nm{transition:color .18s}
#runList .row.skip .grow::after,
#runList .row.queued .grow::after{
  /* pulled into the row's own 16px gap so the line stops just short of the text
     either side rather than a full gap away from both */
  content:'';position:absolute;left:-4px;top:50%;height:1px;width:0;
  background-image:repeating-linear-gradient(to right,var(--icon-dim) 0 1px,transparent 1px 4px);
  transition:width .3s cubic-bezier(.2,.7,.2,1),opacity .2s;opacity:0;
}
#runList .row.skip:not(.await):hover .nm{color:var(--text)}
#runList .row.skip:not(.await):hover .grow::after,
#runList .row.queued:hover .grow::after{width:calc(100% + 8px);opacity:1}
/* A model waiting on its connection has nothing to report yet, so it says what it
   is waiting for only when pointed at -- and comes forward while it does, with the
   same dotted line across to the label as the generate rows use. */
#runList .row.queued .nm{transition:color .18s}
#runList .row.queued:hover .nm{color:var(--text)}
#runList .row .qhint{opacity:0;transition:opacity .18s}
#runList .row.queued:hover .qhint{opacity:1}
#runList .row .open{display:inline-flex;align-items:center;gap:4px;color:var(--accent)}
#runList .row .open .car{display:inline-flex;transition:transform .18s}
#runList .row.ready:hover .open .car{transform:translateX(2px)}
#runList .row:hover{background:none}
#runList .row.ready:hover{background:var(--ghost-hover)}
/* The model you are reading, marked the way Radiant marks an activated row: the
   ghost-highlight wash, and the label -- here the dot with it -- turning brand. */
#runList .row.sel{background:var(--ghost-sel)}
#runList .row.sel .nm{color:var(--rd-sys-color-content-brand)}
#runList .row.sel .newdot,#runList .row.sel .newdot.rest{
  background:var(--rd-sys-color-content-brand)}
.split{display:flex;height:calc(100vh - 57px - 54px)}
.rail{width:340px;flex:0 0 340px;border-right:1px solid var(--hairline);overflow-y:auto;padding:var(--s3) var(--s3) var(--s6)}
.rail .lbl{display:block;margin:0 0 var(--s1)}
.rail .sect + .sect{margin-top:var(--s5)}
.rrow{display:flex;align-items:center;gap:var(--s2);padding:8px 10px;margin:0 -10px;border-radius:var(--rd-sys-radius-6)}
.rrow.click{cursor:pointer}
.rrow.click:hover{background:var(--ghost-hover)}
.rrow.sel{background:var(--ghost-sel)}
.rrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;color:var(--text-dim)}
.rrow.sel .nm,.rrow.done .nm{color:var(--text)}
.rrow .st{flex:0 0 auto}

.pane{flex:1;overflow-y:auto;padding:var(--s5) var(--s5) 120px}
.pane .inner{max-width:700px}
.pane h2{font-size:var(--rd-sys-type-h3-size);line-height:var(--rd-sys-type-h3-line);
  letter-spacing:var(--rd-sys-type-h3-tracking);font-weight:var(--rd-sys-font-weight-medium);
  margin:6px 0 var(--s1)}
/* The model name is itself the way into ThoughtSpot: a Radiant Link, always
   underlined, with the arrow saying it leaves the portal. Only the arrow's lift on
   hover is the page's. */
.mlink{display:inline-flex;align-items:center;gap:6px;font-size:inherit;line-height:inherit}
.mlink .ext{color:var(--rd-sys-color-content-tertiary);
  transition:color .12s,transform .18s}
.mlink:hover .ext{color:var(--rd-sys-color-content-primary);transform:translate(1px,-1px)}
.paneEmpty{height:100%;display:flex;align-items:center;justify-content:flex-start;
  padding-left:var(--s5)}
.detail .pane.paneEmpty{flex-direction:row;overflow:hidden}
.acts{display:flex;align-items:center;justify-content:flex-end;gap:var(--s2);
  margin:var(--s4) 0 var(--s3)}
.acts .sp{display:none}
.blockwrap{position:relative}
textarea.block{
  width:100%;display:block;background:var(--panel);border:1px solid transparent;
  border-radius:var(--rd-sys-radius-8);padding:20px var(--s3);font-size:15px;line-height:1.6;
  resize:none;overflow:hidden;transition:border-color .12s;
}
textarea.block:focus{border-color:var(--accent)}
.count{margin-top:var(--s1);display:flex;justify-content:space-between}
.srcs{margin-top:var(--s5);border-top:1px solid var(--hairline);padding-top:var(--s3)}
.src{padding:var(--s2) 0;border-bottom:1px solid var(--hairline)}
.src:last-child{border-bottom:none}
.src .t{color:var(--text-dim);font-size:14px;margin-bottom:6px}
.src .ev{margin-bottom:var(--s1)}
.src pre{
  margin:0;background:var(--panel);border-radius:var(--rd-sys-radius-6);padding:12px 14px;
  font-family:'Geist Mono',Menlo,monospace;font-size:12px;line-height:1.55;
  color:var(--text-dim);overflow-x:auto;white-space:pre;
}
/* Radiant's Banner carries these; the page only says how they sit in the column.
   A banner's own status fill is subtle in dark, so the body's second line keeps
   the mono treatment the rest of the panel reads in. */
/* What the step is still missing, said out loud when the CTA is pressed too early.
   It sits above both steps, so whichever one is showing carries it. */
.stepwarn{flex:0 0 auto;margin-bottom:var(--s3)}
.notice{align-items:flex-start;margin:var(--s3) 0}
.notice .rad-banner__body br{content:'';display:block;margin-bottom:6px}
.notice .rad-banner__icon{margin-top:2px}

/* The run's own notice, between the way back and the title. It appears when the
   run does and holds through the result, exactly as the floating bar did; what
   changed is that only its cross takes it away. Leaving is still a departure
   rather than a disappearance -- away from the page, which is upward here. */
.runnote{display:none;margin:0 0 var(--s3)}
.runnote.on{display:flex}
@keyframes noteOut{from{transform:none;opacity:1}to{transform:translateY(-8px);opacity:0}}
.runnote.out{animation:noteOut .22s cubic-bezier(.4,0,.8,.4) both;pointer-events:none}
/* the message takes the width, so the dismiss sits against the right edge */
.runnote .rad-banner__body{flex:1 1 auto}

/* ---- instructions panel: one card per instruction, each independently selectable ---- */
/* The tally reads as ordinary copy beside the link, not as a bar's readout, so it
   is set in Geist rather than the mono face the floating bar used. Tabular figures
   keep it from twitching as the count climbs. */
#mCount{white-space:nowrap;color:var(--text-dim);
  font-size:var(--rd-sys-type-body-size);line-height:var(--rd-sys-type-body-line);
  font-variant-numeric:tabular-nums}
#mCount.strong{color:var(--text)}
/* Confirmation lives in the counter itself: the line grows to admit the longer
   word, holds, then settles back. Only the max-width animates, so the counter stays
   centred on the bar the whole way through -- the same motion the copy note uses
   beside it. */
/* the fold clips; the word inside keeps its own width so it never reflows as the
   wrapper travels */
.cnt{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom}
.cntin{display:inline-block;white-space:nowrap}
.cpd{display:inline-block;overflow:hidden;white-space:nowrap;vertical-align:bottom;
  transition:max-width .46s cubic-bezier(.32,.72,0,1),opacity .3s ease}
.cpd{max-width:0;opacity:0}
.cpd.on{opacity:1}

/* The panel's controls row: the bulk-select link, the divider the lists use
   between that link and what follows it, the tally, and the action that writes the
   instructions in -- 8px either side of the rule, as in the scope steps. */
/* No gap on the row: the spacing is the fold's own, exactly as in the scope
   steps -- 8px between the link and the rule, 8px after it -- so the pairing is
   the same one the lists use rather than a lookalike. */
.mhd{display:flex;align-items:center;padding-bottom:6px;margin:var(--s4) 0 var(--s2)}
.mhd .sall{height:34px}
.mhd #mPush{margin-left:auto}
/* Adding keeps the button where it stood and in its own colour: it is still the
   primary action, only working -- so it takes the spinner rather than the grey a
   disabled button would get. Nothing to press while it runs. */
#mPush.is-busy{pointer-events:none}
#mPush .rad-btn__icon:empty{display:none}
.mlist{display:flex;flex-direction:column;gap:var(--s2);padding-top:2px}
.met{background:var(--panel);border:1px solid transparent;border-radius:var(--rd-sys-radius-8);
  padding:12px var(--s3) 10px;transition:border-color .12s,opacity .18s}
.met:hover{border-color:var(--hairline)}

.met .mtop{display:flex;align-items:flex-start;gap:var(--s2)}
.met .rad-check{margin-top:4px;cursor:pointer}
/* the instruction reads as a named rule: its name, an em dash, then what it says */
.met .mtxt{flex:1;min-width:0;font-size:var(--rd-sys-type-body-large-size);
  line-height:var(--rd-sys-type-body-large-line);color:var(--text)}
.met .mttl{font-weight:600;color:var(--text)}
.met .mdash{color:var(--text-dim)}
.met .mbody{outline:none}
.met.off .mtxt{color:var(--icon-dim)}
.met.off .mttl{color:var(--icon-dim)}
.met .work{flex:1;display:flex;align-items:center;gap:var(--s2);padding:3px 0}
/* the row of per-instruction actions sits under the text, aligned past the checkbox */
.mact{display:flex;align-items:center;gap:var(--s2);margin-top:8px;
  padding-left:calc(14px + var(--s2))}
.mact .sp{flex:1}
.mact .vote{display:flex;align-items:center;gap:10px}
/* a rating that has been given stays lit */
.ic.on,.ic.on:hover{color:var(--rd-sys-color-content-brand)}
/* Sources and the dislike reason both open as a Radiant Explainer card over the
   panel rather than growing the instruction they belong to, so the list keeps its
   shape and nothing below shifts. .pop only places the card and fades it in --
   the card itself brings the surface, the padding and the shadow. */
.pop{
  position:fixed;z-index:60;
  opacity:0;transform:translateY(-4px);
  transition:opacity .14s,transform .18s cubic-bezier(.32,.72,0,1);
}
.pop.in{opacity:1;transform:none}
/* the card is 340 wide by spec; only a viewport narrower than that overrides it */
@media (max-width:376px){
  .pop .rad-explainer{width:auto;min-width:0;max-width:calc(100vw - 24px)}
}
/* the body slot stacks when it holds controls rather than a paragraph */
.pop .rad-explainer__body > * + *{margin-top:var(--s3)}
/* the evidence line runs a shade over the card's 300px of content, so it is set
   to break evenly rather than leave a word stranded on a second line */
.pop .evline{display:block;text-wrap:balance}
.pop .rad-field{width:100%}
/* the SQL sits in the card's media slot, which already draws the tint and the radius.
   The card is 340 wide by spec, so the query wraps to it rather than scrolling
   sideways -- a line you have to drag into view is a line you do not read. It
   breaks at spaces, and only mid-token when a single token is wider than the slot. */
.pop .rad-explainer__media > pre{
  margin:0;padding:10px 12px;background:none;
  font-family:var(--rd-sys-font-family-mono);font-size:var(--rd-sys-type-caption-size);line-height:1.55;
  color:var(--text-dim);white-space:pre-wrap;overflow-wrap:anywhere}
/* each line of the query is its own block with a hanging indent, so a line that
   wraps is set in from the ones that did not -- a continuation reads as a
   continuation rather than as the next statement */
.pop .rad-explainer__media > pre > span{display:block;padding-left:14px;text-indent:-14px}
/* Radiant's token carries 4px of its own side padding -- it is built to hold an
   icon beside its label -- so the reasons need a real step between them to read
   as separate tokens rather than one band. */
.chips{display:flex;flex-wrap:wrap;gap:var(--rd-sys-spacing-b)}


/* history */
/* a card that has just come into range arrives; one that has left fades out from
   where it was, rather than blinking out of the layout */
.cardin{animation:listIn .46s cubic-bezier(.22,.68,0,1) both}
/* the clone is out of the grid, so it carries neither its cell nor its rules */
.rcard.ghost{z-index:1;border:0;margin:0;border-radius:0;background:none}
#historyList{position:relative}

/* Run logs: one ruled grid rather than a set of separate boxes. Every cell carries
   its own four borders and is pulled 1px onto its neighbour, so a shared edge is
   two lines lying exactly on top of each other and still reads as one hairline.
   Owning its own borders is what lets a cell round a corner: the radii below are
   put on whichever cells hold the corners the block actually has, so an odd number
   of runs leaves an L whose every outward corner is rounded. The one corner that
   turns inward stays square -- a border radius cannot round a corner the outline
   turns into rather than around. */
.rgrid{display:grid;grid-template-columns:1fr 1fr}
/* a section reads like a connection group in the models list: a quiet header with
   the period, a leader, and how many runs it holds -- set well clear of its own
   cards, and further still from the period before it */
.rsec + .rsec{margin-top:calc(var(--s6) + var(--s4))}
#historyList .tname{cursor:default;padding:0 0 var(--s3)}
.rempty{padding:var(--s4) 0;display:flex;align-items:center;gap:var(--s2)}
.rcard{display:flex;flex-direction:column;gap:var(--s3);padding:var(--s3);
  background:var(--page);border:1px solid var(--hairline)}
/* every cell after the first column or the first row overlaps the line beside it */
.rgrid > .rcard:nth-child(2n){margin-left:-1px}
.rgrid > .rcard:nth-child(n+3){margin-top:-1px}
/* the corners the block has, wherever they fall:
   the two at the top, the two at the foot of the last row, and -- when the last row
   holds one run -- the foot of the column beside it */
.rgrid > .rcard:first-child{border-top-left-radius:var(--rd-sys-radius-8)}
.rgrid > .rcard:nth-child(2),
.rgrid > .rcard:first-child:last-child{border-top-right-radius:var(--rd-sys-radius-8)}
.rgrid > .rcard:last-child{border-bottom-right-radius:var(--rd-sys-radius-8)}
.rgrid > .rcard:last-child:nth-child(2n+1),
.rgrid > .rcard:nth-last-child(2):nth-child(2n+1){border-bottom-left-radius:var(--rd-sys-radius-8)}
.rgrid > .rcard:nth-last-child(2):nth-child(2n){border-bottom-right-radius:var(--rd-sys-radius-8)}
/* the status sits centred on the date, and both states are laid out the same way:
   a flex line, so the 15px loader centres on its word instead of hanging off a
   baseline the grid does not really have */
.rtop{display:flex;align-items:center;gap:var(--s2)}
.rwhen{font-size:17px;color:var(--text);font-variant-numeric:tabular-nums}
.rtop .st{margin-left:auto;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
/* What has landed since you last looked is a Radiant Tag -- the outlined stamp the
   system already has for a small standing label. Nothing added: the Tag is drawn on
   bg-base, which is now what the page is. */
/* one line per figure: what it is on the left, the figure itself right-aligned so
   the numbers line up down the card. The label never breaks; a value too long to
   sit beside it drops to its own line rather than wrapping the pair. */
.rrows{display:flex;flex-direction:column;gap:10px}
.rrow{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;position:relative}
.rrow .rk{color:var(--text-dim);white-space:nowrap;transition:color .18s}
.rrow .rv{margin-left:auto;color:var(--text);text-align:right;white-space:nowrap}
/* A figure worth reading is a figure worth seeing behind: pointing at one draws the
   same dotted line across to it that the generate rows use, and hands over the list
   the number stands for. */
.rrow.hov{cursor:default}
.rrow.hov .rlead{flex:1 1 auto;position:relative;min-width:var(--s2);align-self:center;height:1px}
.rrow.hov .rlead::after{
  content:'';position:absolute;left:-4px;top:0;height:1px;width:0;
  background-image:repeating-linear-gradient(to right,var(--icon-dim) 0 1px,transparent 1px 4px);
  transition:width .3s cubic-bezier(.2,.7,.2,1),opacity .2s;opacity:0}
.rrow.hov:hover .rk,.rrow.hov.open .rk{color:var(--text)}
.rrow.hov:hover .rlead::after,.rrow.hov.open .rlead::after{width:calc(100% + 8px);opacity:1}
/* the list itself: a card to the side of the row, tall enough to read and no taller,
   scrolling inside itself when a run touched more than it can show */

/* Run logs, by connection: a list of connections, each holding its runs as a thread.
   The same fold as the results rail -- the slot's grid track goes to 0fr, so nothing
   has to be measured and the rows keep their place in the list. */
.lconn + .lconn{margin-top:var(--s3)}
/* the header takes the same bleed as the rows under it, so both edges line up
   with the run rows and the count reaches the same right edge */
#historyList .tname{cursor:default;margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:9px var(--rd-sys-spacing-d) 12px}
#historyList .tname.can-toggle{cursor:pointer}
/* on the name, not in front of it: the header's own 16px gap is cancelled so the
   chevron reads as belonging to the word it follows */
#historyList .chev{flex:0 0 auto;display:flex;margin-left:-8px;color:var(--icon-dim);
  transition:transform .3s cubic-bezier(.32,.72,0,1),color .12s}
#historyList .lconn:not(.collapsed) .chev{transform:rotate(90deg)}
#historyList .tname.can-toggle:hover .chev{color:var(--text)}
#historyList .tname .st{display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
#historyList .slot{display:grid;grid-template-rows:1fr;overflow:hidden;
  margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:0 var(--rd-sys-spacing-d);
  transition:grid-template-rows .34s cubic-bezier(.32,.72,0,1)}
#historyList .lconn.collapsed .slot{grid-template-rows:0fr}
#historyList .sinner{min-height:0}
/* the thread: one line down the indent, and the runs hanging off it */
/* the thread: one line down the indent and nothing crossing it */
.lruns{margin-left:7px;padding:0 0 6px 21px;border-left:1px solid var(--hairline)}
#historyList .lconn.collapsed .lruns{border-left-color:transparent}
.lrun{position:relative;margin:0 calc(-1 * var(--rd-sys-spacing-d));
  border-radius:var(--rd-sys-radius-6)}
/* the count names the row; the stamp is what it answers to */
.lrun .lmet{font-size:var(--rd-sys-type-body-size);color:var(--text);white-space:nowrap}
.lwhen{font-size:var(--rd-sys-type-caption-size);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.lrun .st{white-space:nowrap;display:inline-flex;align-items:center;gap:7px}

/* it opens: the same mark the result rows carry, rather than a control that
   appears under the pointer */
.lrun .grow{flex:1 1 auto;min-width:var(--s2)}
.lrun .rgo{flex:0 0 auto;display:flex;color:var(--icon-dim);
  transition:color .12s,transform .18s cubic-bezier(.2,.7,.2,1)}
.lrun:hover .rgo{color:var(--text);transform:translateX(2px)}
.lrun:hover .lwhen,.lrun.open .lwhen{color:var(--text-dim)}

/* the way back out of a run that was opened from the logs: Radiant's Breadcrumb,
   then the run itself. The trail past the parent has no component, so the
   separator and the current page are still the prototype's. */
.crumb{display:flex;align-items:center;gap:var(--s2);margin:0 0 var(--s2)}
.crumb .rad-breadcrumb__back{background:var(--rd-sys-color-bg-secondary-action)}
.crumb .rad-breadcrumb:hover .rad-breadcrumb__back{background:var(--rd-sys-color-chip-filter-hover)}
.csep{color:var(--icon-dim)}
/* the run you are in is the subject of the page, so it reads at full strength */
.ccur{color:var(--text)}

/* ---------- motion ----------
   Layout shifts are animated with FLIP (see flipRender in JS): positions are measured
   before and after a re-render, then the delta is played out as a transform. Reveals
   use .rise. Everything here is disabled under prefers-reduced-motion. */
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* Between one screenful of work and the next, the page says what it is doing
   rather than showing an empty frame. */
.loadwrap{flex:1;min-height:0;display:none;align-items:center;justify-content:center}
.loadwrap.on{display:flex}
/* Radiant's PageLoader: three dots over what the page is doing. The caption keeps
   the prototype's travelling highlight, which is how every other wait reads here. */
.loadin{gap:var(--rd-sys-spacing-f)}
.loadin .rad-pageloader__msg{letter-spacing:.03em}
/* the header drops in over the loader, so the frame arrives before the content */
@keyframes hdrDrop{from{opacity:0;transform:translateY(-100%)}to{opacity:1;transform:none}}
.hdrdrop{animation:hdrDrop .46s cubic-bezier(.22,.68,0,1) both}

/* Moving between steps carries a direction: forward brings the next page in from
   the right, back brings the previous one in from the left. */
@keyframes inFromRight{from{opacity:0;transform:translateX(34px)}to{opacity:1;transform:none}}
@keyframes inFromLeft{from{opacity:0;transform:translateX(-34px)}to{opacity:1;transform:none}}
.slidein-r{animation:inFromRight .38s cubic-bezier(.22,.68,0,1) both}
.slidein-l{animation:inFromLeft .38s cubic-bezier(.22,.68,0,1) both}
/* what arrives after a loader has no direction to come from: it simply appears */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeOut{from{opacity:1}to{opacity:0}}
.fadein{animation:fadeIn .36s ease both}
@keyframes listIn{
  from{transform:translateY(-14px);opacity:0}
  to{transform:none;opacity:1}
}

/* a status that has just changed arrives rather than appearing */
@keyframes stateIn{from{opacity:0;transform:translateX(8px)}to{opacity:1;transform:none}}
.statein{animation:stateIn .3s cubic-bezier(.22,.68,0,1) both}

/* the tab swap is a quick exchange, not an arrival, so both halves are short */
.fadein-q{animation:fadeIn .16s ease both}
.fadeout{animation:fadeOut .11s ease both}
#orgSection{will-change:height}
.rise{animation:rise .26s cubic-bezier(.2,.7,.2,1) both}
.srclist{max-height:0;overflow:hidden;opacity:0;margin-top:0;
  transition:max-height .32s cubic-bezier(.2,.7,.2,1),opacity .22s ease,margin-top .32s cubic-bezier(.2,.7,.2,1)}
.srclist.on{max-height:2000px;opacity:1;margin-top:var(--s3)}
@media (prefers-reduced-motion: reduce){
  .rise{animation:none}
  #runList .row .newdot{animation:none}
  .srclist{transition:none}
  *{transition-duration:0s !important}
}

/* prototype controls */
/* The prototype's own control: out of the way for now, kept in place for later.
   It appears when the URL carries ?proto, so a demo can still jump between states
   without it sitting in the header the rest of the time. */
#proto{display:none;position:fixed;left:var(--s3);top:13px;z-index:100;text-align:left}
#proto.show{display:block}
#proto .tog{background:var(--raised);border:1px solid var(--hairline);border-radius:var(--rd-sys-radius-6);padding:5px 9px}
#proto .body{
  display:none;margin-top:6px;background:var(--raised);border:1px solid var(--hairline);
  border-radius:var(--rd-sys-radius-8);box-shadow:var(--shadow-menu);padding:var(--s2);width:240px;text-align:left;
  max-height:calc(100vh - 90px);overflow-y:auto;
}
#proto.open .body{display:block}
#proto .body .lbl{display:block;margin-bottom:var(--s1)}
#proto .body button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:var(--rd-sys-radius-6);font-size:12px;font-family:'Geist Mono',Menlo,monospace;color:var(--text-dim)}
#proto .body button:hover{background:var(--ghost-hover);color:var(--text)}
#proto .body button.on{color:var(--accent)}
#proto .body hr{border:none;border-top:1px solid var(--hairline);margin:var(--s1) 0}
</style>
</head>
<body>

<!-- ================= AUTH ================= -->
<!-- ================= INTRO ================= -->
<!-- The one place the portal can say what it is: after this screen the user is in
     the middle of setting a run up. -->
<section id="app" class="screen on">
  <header class="hdr">
    <span class="brand" aria-label="ThoughtSpot">
      <svg viewBox="0 0 48 48" width="21" height="21" fill="currentColor" aria-hidden="true">
        <path d="M47.7108 0H0.289185V8.78311H47.7108V0Z"/>
        <path d="M47.7108 11.7108H29.6927V20.4939H47.7108V11.7108Z"/>
        <path d="M11.8012 11.7108H0.289185V20.4939H11.8012C16.1024 20.4939 19.6084 23.9999 19.6084 28.3011V47.4216H28.3915V28.3011C28.3915 19.1566 20.9458 11.7108 11.8012 11.7108Z"/>
        <path d="M38.7108 33.253C34.6446 33.253 31.3373 36.5603 31.3373 40.6265C31.3373 44.6928 34.6446 48 38.7108 48C42.7771 48 46.0843 44.6928 46.0843 40.6265C46.0843 36.5603 42.7771 33.253 38.7108 33.253Z"/>
      </svg>
    </span>
    <div class="rad-segmented seg" role="tablist">
      <button type="button" class="rad-segmented__item is-active" data-tab="scope">New run</button>
      <button type="button" class="rad-segmented__item" data-tab="history">Run logs</button>
    </div>
    <!-- The page's progress rides the bar's own bottom edge: the wizard's two
         steps while a run is being set up, the run's band while it works. -->
    <div class="hprog" id="hProg" aria-hidden="true"
      ><span class="hseg" id="hSegA"></span><span class="hseg" id="hSegB"></span
      ><span class="hsnake" id="hSnake"></span></div>
  </header>

  <div id="load" class="loadwrap">
    <div class="rad-pageloader loadin" id="loadIn" role="status" aria-label="Loading"></div>
  </div>

  <!-- ---- scope ---- -->
  <div id="viewScope" class="pgview">
    <div class="wrap">
      <div class="rad-banner rad-banner--failure stepwarn" id="stepWarn" role="alert"
        style="display:none"><span class="rad-banner__icon" aria-hidden="true"
          id="stepWarnIcon"></span><span class="rad-banner__body rd-body" id="stepWarnMsg"></span
        ><button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small"
          id="stepWarnX" aria-label="Dismiss"><span class="rad-iconbtn__icon"
          id="stepWarnXIcon"></span></button></div>
      <!-- stage: connections -->
      <div id="stConn">
        <div class="pghd" data-k="conn-title">
          <h1 class="pgtitle"><span>Select connection</span></h1>
          <span class="pgsub">in <span class="ctxwrap orgpick"><button type="button"
            class="rad-field__box rad-select__trigger" id="orgPick"
            aria-haspopup="listbox" aria-expanded="false"
            ><span class="rad-select__value" id="orgPickLabel"></span><span
              class="rad-field__icon rad-select__chev pchev" aria-hidden="true"></span></button>
            <div class="rad-menu ctxpop" id="ctxPop">
              <div class="orgblk">
                <div class="rad-menu__search"><div class="rad-field rad-searchbar msf">
                  <div class="rad-field__box rad-field__box--underline">
                    <span class="rad-field__icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
                    <input id="orgSearch" type="search" placeholder="Search organisations"
                      spellcheck="false" autocomplete="off">
                  </div>
                </div></div>
                <div class="rad-menu__list rad-menu__list--scroll" id="orgList"></div>
              </div>
            </div></span> org</span>
          <div class="right">
            <button class="rad-btn rad-btn--basic rad-btn--primary ctanext"
              ><span class="rad-btn__label">Next</span></button>
          </div>
        </div>
        <div class="srow">
          <div class="rad-field rad-searchbar sf">
            <div class="rad-field__box">
              <span class="rad-field__icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
              <input id="connSearch" type="search" placeholder="Search connections" spellcheck="false" autocomplete="off">
              <button type="button" class="rad-searchbar__clear is-hidden" data-clear="conn"
                aria-label="Clear"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            </div>
          </div>
        </div>
        <div id="connList" data-k="conn-list"></div>
      </div>

      <!-- stage: models -->
      <div id="stModel" style="display:none">
        <div class="pghd" data-k="model-title"><h1 class="pgtitle"><span>Select models</span></h1>
          <span class="pgsub" id="modelCount"></span>
          <div class="right">
            <button class="rad-btn rad-btn--basic rad-btn--secondary ctaback"
              ><span class="rad-btn__label">Back</span></button>
            <button class="rad-btn rad-btn--basic rad-btn--primary ctanext"
              ><span class="rad-btn__icon ctaicon" aria-hidden="true"></span
              ><span class="rad-btn__label">Run</span></button>
          </div>
        </div>
        <div class="srow">
          <div class="sall" id="modelAllWrap"><div class="sallin">
            <span class="rad-link rad-link--gray" id="modelAll">select all</span>
            <span class="vr"></span>
          </div></div>
          <div class="rad-field rad-searchbar sf">
            <div class="rad-field__box">
              <span class="rad-field__icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
              <input id="modelSearch" type="search" placeholder="Search models" spellcheck="false" autocomplete="off">
              <button type="button" class="rad-searchbar__clear is-hidden" data-clear="model"
                aria-label="Clear"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            </div>
          </div>
        </div>
        <div id="modelHead" data-k="model-head"></div>
        <div id="modelList" data-k="model-list"></div>

        <!-- The run reads the history you give it: one CSV, exported from the
             connection, sitting under the models it will be read against. Titled
             like the step above it, because it is the second half of the same ask. -->
        <div class="qh" data-k="qh">
          <div class="pghd" data-k="qh-title"><h1 class="pgtitle"><span>Upload query history</span></h1></div>
          <label class="qdrop" id="qDrop">
            <input type="file" id="qFile" accept=".csv,text/csv" hidden>
            <span class="qic" data-ric="upload:22"></span>
            <span class="qtxt">Drop the query history CSV here</span>
            <span class="qsub mono dim">or click to browse</span>
          </label>
          <div class="qrow" id="qRow" style="display:none">
            <span class="qtext">
              <span class="qname" id="qName"></span>
              <span class="mono dim" id="qMeta"></span>
              <span class="mono dim qdone"><span class="qtick"></span><span id="qWhen"></span></span>
              <span class="mono dim qdone" id="qScan" style="display:none"
                ><span class="qtick"></span><span>query history scanned</span></span>
            </span>
            <span class="rad-link rad-link--small rad-link--gray" id="qSwap">replace</span>
            <span class="rad-link rad-link--small rad-link--gray" id="qClear">remove</span>
          </div>
          <div class="qbusy" id="qBusy"></div>
        </div>
      </div>
    </div>

  </div>

  <!-- ---- run / results ---- -->
  <div id="viewRun" class="pgview" style="display:none">
    <div class="runmain">
      <div class="wrap">
        <div class="crumb" id="runCrumb" style="display:none">
          <button type="button" class="rad-breadcrumb" id="crumbBack">
            <span class="rad-breadcrumb__back" aria-hidden="true"></span>
            <span class="rad-breadcrumb__label rd-body">Run logs</span>
          </button>
          <span class="csep">/</span>
          <span class="mono ccur" id="crumbCur"></span>
        </div>
        <!-- What the run is doing, and then what it did: Radiant's Banner, info
             while it works and success once it lands. It stands until dismissed. -->
        <div class="rad-banner runnote" id="runNote" role="status"
          ><span class="rad-banner__icon" aria-hidden="true" id="runNoteIcon"></span
          ><span class="rad-banner__body rd-body" id="runNoteMsg"></span
          ><button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small"
            id="runBarX" aria-label="Dismiss"
            ><span class="rad-iconbtn__icon" id="runBarXIcon"></span></button></div>
        <div class="pghd">
          <h1 class="pgtitle" id="runTitle">Run results</h1>
          <span class="pgsub" id="runSub"></span>
          <div class="right">
            <span class="sall" id="newRunWrap"><span class="sallin">
              <button class="rad-btn rad-btn--basic rad-btn--secondary" id="btnNewRun">Start another run</button>
            </span></span>
          </div>
        </div>
        <div class="srow">
          <div class="rad-field rad-searchbar sf">
            <div class="rad-field__box">
              <span class="rad-field__icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
              <input id="runSearch" type="search" placeholder="Search models" spellcheck="false" autocomplete="off">
              <button type="button" class="rad-searchbar__clear is-hidden" data-clear="run"
                aria-label="Clear"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            </div>
          </div>
        </div>
        <div id="runList"></div>
      </div>
    </div>
    <aside class="detail" id="detail">
      <div class="pprog" id="pProg" aria-hidden="true"><span class="psnake" id="pSnake"></span></div>
      <button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small panelclose" id="paneClose"
        aria-label="Close"><span class="rad-iconbtn__icon" id="paneCloseIcon"></span></button>
      <div class="pane" id="pane"></div>
    </aside>
  </div>

  <!-- ---- history ---- -->
  <div id="viewHistory" class="pgview" style="display:none">
    <div class="wrap">
      <div class="pghd">
        <h1 class="pgtitle"><span>Run logs</span></h1>
      </div>
      <!-- One row of ways in: a run is remembered by when it ran, but just as often
           by which connection or model it was about. -->
      <!-- One row of ways in. "When" is a single question -- the grouping of the
           cards follows from the answer rather than being asked separately. -->
      <div class="srow frow">
        <div class="dd" id="ddTime">
          <button type="button" class="rad-field__box rad-select__trigger ddbtn"><span
            class="rad-select__value" id="timeLabel">All time</span><span
            class="rad-field__icon rad-select__chev car" aria-hidden="true"></span></button>
          <div class="rad-menu menu tmenu">
            <div class="rad-menu__list tpres"></div>
            <hr class="rad-menu-divider trule">
            <div class="rad-menu__list">
              <button type="button" class="rad-menu-item tcustom" id="tCustom"><span
                class="rad-menu-item__label mtx">Custom range</span><span
                class="rad-menu-item__chevron chev" aria-hidden="true"></span></button>
              <div class="rwrap" id="rWrap" style="display:none">
              <div class="rfield"><span class="mono dim">from</span>
                <div class="rad-field"><div class="rad-field__box"><input type="date" id="rFrom"></div></div></div>
              <div class="rfield"><span class="mono dim">to</span>
                <div class="rad-field"><div class="rad-field__box"><input type="date" id="rTo"></div></div></div>
                <div class="rcta"><span class="rad-link rad-link--small rad-link--gray"
                  id="rClear">clear</span><button class="rad-btn rad-btn--basic rad-btn--primary"
                  id="rApply">Apply</button></div>
              </div>
            </div>
          </div>
        </div>
        <span class="vr"></span>
        <div class="dd ms" id="ddScope">
          <button type="button" class="rad-field__box rad-select__trigger ddbtn"><span
            class="rad-select__value" id="fsLabel">All connections and models</span><span
            class="rad-field__icon rad-select__chev car" aria-hidden="true"></span></button>
          <div class="rad-menu menu wide"></div>
        </div>
        <span class="fgap"></span>
        <span class="mono dim" id="grpNote"></span>
        <span class="rad-link rad-link--small rad-link--gray" id="fClear" style="display:none">clear filters</span>
      </div>
      <div id="historyList"></div>
    </div>
  </div>
</section>

<!-- ================= PROTOTYPE CONTROLS ================= -->
<div id="proto">
  <button class="tog mono dim">prototype</button>
  <div class="body">
    <span class="lbl">Jump to state</span>
    <button data-go="reset">1 · fresh start</button>
    <button data-go="scope">2 · scope, nothing selected</button>
    <button data-go="preselect">3 · scope, models chosen</button>
    <button data-go="running">4 · run in progress</button>
    <button data-go="done">5 · completed run</button>
    <button data-go="nosignal">6 · model with no signal</button>
    <button data-go="partial">7 · partially failed run</button>
    <hr>
    <span class="lbl">Theme</span>
    <button data-theme-set="light">light</button>
    <button data-theme-set="dark">dark</button>
  </div>
</div>

<script>
/* ============================== RADIANT ICONS ==============================
   src/radiant/components/Icon/Icon.tsx, in one file: the glyphs it would have
   glob-imported, put through the same transform (dark neutral fills to
   currentColor, intrinsic width/height stripped) and handed out by name. */
const RAD_ICONS={
  "cross":"<svg viewBox=\"0 0 16 16\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\"> <path d=\"M4.22876 2.97168L2.97168 4.22876L6.74292 7.99999L2.97168 11.7712L4.22876 13.0283L7.99999 9.25707L11.7712 13.0283L13.0283 11.7712L9.25707 7.99999L13.0283 4.22876L11.7712 2.97168L7.99999 6.74292L4.22876 2.97168Z\" fill=\"currentColor\"/> </svg>",

const RIC=(name,size=16,cls='')=>{
  const svg=RAD_ICONS[name];
  if(svg==null){console.warn(`[Radiant] Unknown icon "${name}"`);return '';}
  return `<span class="rad-icon${cls?' '+cls:''}" style="width:${size}px;height:${size}px"
    aria-hidden="true">${svg}</span>`;
};

/* ===================== RADIANT FORM CONTROLS =====================
   The markup Checkbox.tsx / Radio.tsx / Toggle.tsx render, as template helpers.
   State is written on the real input, the way the React components do it, so the
   component's own CSS drives every visual state; `indeterminate` has no attribute
   in HTML, so it is flagged here and applied by radSync() after each render. */
const CHECK_MARK='<path fill-rule="evenodd" clip-rule="evenodd" d="M12.3777 4.21103L5.99443 '
  +'10.5943L1.94446 6.54436L3.0444 5.44442L5.99443 8.39445L11.2778 3.11108L12.3777 4.21103Z" '
  +'fill="currentColor"/>';
const MINUS_MARK='<path d="M1.55566 7.77778V6.22223H12.4446V7.77778H1.55566Z" fill="currentColor"/>';
/* state: 'on' | 'part' | '' */
const CHECK=(state,attrs='')=>`<span class="rad-check" ${attrs}
  ><input type="checkbox" class="rad-check__input" tabindex="-1"${state==='on'?' checked':''}${
    state==='part'?' data-ind="1"':''}
  ><span class="rad-check__box" aria-hidden="true"
    ><svg class="rad-check__mark" viewBox="0 0 14 14" fill="none">${
      state==='part'?MINUS_MARK:CHECK_MARK}</svg></span></span>`;
const RADIO=(on,attrs='')=>`<span class="rad-radio" ${attrs}
  ><input type="radio" class="rad-radio__input" tabindex="-1"${on?' checked':''}
  ><span class="rad-radio__ring" aria-hidden="true"><span class="rad-radio__dot"></span></span></span>`;
const TOGGLE=(on,attrs='')=>`<span class="rad-toggle" ${attrs}
  ><input type="checkbox" class="rad-toggle__input" tabindex="-1" role="switch"
    aria-checked="${on?'true':'false'}"${on?' checked':''}
  ><span class="rad-toggle__track"></span><span class="rad-toggle__thumb"></span></span>`;
/* ----- src/radiant/components/ExplainerCard/ExplainerCard.tsx ----- */
/* Explainer card. Titled: [title . dismiss] / body / media / actions.
   Compact (no title): [body . dismiss] -- the hover form, which the spec leaves
   without a dismiss. `media` is the tinted slot; left empty it draws the spec's
   170px placeholder block. */
const EXCARD=({title=null,body=null,media=null,actions=null,dismiss=true,cls=''})=>{
  const x=dismiss?`<button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small"
      data-ex-x aria-label="Dismiss"><span class="rad-iconbtn__icon">${RIC('cross',16)}</span></button>`:'';
  const b=body==null?'':`<div class="rad-explainer__body rd-body">${body}</div>`;
  return title==null
    ? `<div class="rad-explainer rad-explainer--compact${cls?' '+cls:''}" role="dialog">${b}${x}</div>`
    : `<div class="rad-explainer rad-explainer--titled${cls?' '+cls:''}" role="dialog"
        ><div class="rad-explainer__head"
          ><div class="rad-explainer__title rd-label-section">${title}</div>${x}</div>${b}${
        media==null?'':`<div class="rad-explainer__media">${media}</div>`}${
        actions==null?'':`<div class="rad-explainer__actions">${actions}</div>`}</div>`;
};
