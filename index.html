/**
 * Radiant — Semantic Color Tokens (the alias layer)
 * Reference THESE in product code — never a primitive directly.
 * Every value maps onto a primitive from primitives.css by NAME.
 *
 * NOTE on source fidelity: in the Figma some later cards (Toggle, Button)
 * print copy-pasted hex labels that don't match their named primitive
 * (e.g. "Gray 40 #FFEBEC"). The primitive NAME is authoritative there, and
 * that is what these mappings follow.
 *
 * Light theme lives on :root. Dark theme overrides live on [data-theme="dark"].
 */

:root {
  /* ============================ Background ============================ */
  /* --rd-sys-color-bg-* — surfaces & backgrounds of pages, containers, menus, cards, actions */
  --rd-sys-color-bg-sunken: var(--rad-gray-10);
  --rd-sys-color-bg-base: var(--rad-gray-0);
  --rd-sys-color-bg-on-base: var(--rad-gray-10);

  --rd-sys-color-bg-active: var(--rad-gray-0);
  --rd-sys-color-bg-secondary-action: var(--rad-gray-20);
  --rd-sys-color-bg-brand: var(--rad-blue-60);
  --rd-sys-color-bg-inverse: var(--rad-gray-80);
  --rd-sys-color-bg-success: var(--rad-green-20);
  --rd-sys-color-bg-warning: var(--rad-yellow-20);
  --rd-sys-color-bg-failure: var(--rad-red-20);

  --rd-sys-color-bg-overlay: var(--rad-gray-70a);
  --rd-sys-color-bg-ghost-hover: var(--rad-gray-10a);
  --rd-sys-color-bg-ghost-highlight: rgba(113, 161, 244, 0.12); /* Blue 50 @ 12% — per live Figma (#71a1f41f); the semantic PDF showed Blue 10 @ 12% */
  --rd-sys-color-bg-accent-green: var(--rad-green-20);
  --rd-sys-color-bg-accent-yellow: var(--rad-yellow-20);
  --rd-sys-color-bg-accent-red: var(--rad-red-20);
  --rd-sys-color-bg-accent-blue: var(--rad-blue-20);
  --rd-sys-color-bg-accent-gray: var(--rad-gray-10);
  --rd-sys-color-bg-accent-purple-subtle: var(--rad-purple-20);
  --rd-sys-color-bg-accent-purple-bold: var(--rad-purple-60);

  /* ============================= Content ============================= */
  /* --rd-sys-color-content-* — foreground: text, icons, links */
  --rd-sys-color-content-primary: var(--rad-gray-90);
  --rd-sys-color-content-secondary: var(--rad-gray-60);

  --rd-sys-color-chip-date-default: var(--rad-purple-20);

  --rd-sys-color-chip-error-active-border: var(--rad-gray-30);

  /* ============================== Toggle ============================= */
  /* --rd-sys-color-toggle-* — switch track & thumb */
  --rd-sys-color-toggle-track-off: var(--rad-gray-40);
  --rd-sys-color-toggle-track-on: var(--rad-blue-30);

/**
 * Radiant — Spacing
 * A 4-point scale. Every margin, padding and gap in the product is one of
 * these twelve steps. Values are literal pixels (the ramp is not scaled).
 * Figma names: Spacing/A … Spacing/L.
 */

:root {
  --rd-sys-spacing-a: 4px;
  --rd-sys-spacing-b: 8px; /* KEY — 8-point grid unit, vertical element margin */
  --rd-sys-spacing-c: 12px;
  --rd-sys-spacing-d: 16px; /* KEY — horizontal element margin */
  --rd-sys-spacing-e: 20px;
  --rd-sys-spacing-f: 24px; /* KEY — horizontal content cell margin */
  --rd-sys-spacing-g: 28px;
  --rd-sys-spacing-h: 32px; /* KEY — vertical content cell margin */
  --rd-sys-spacing-i: 40px;
  --rd-sys-spacing-j: 48px;
  --rd-sys-spacing-k: 56px;
  --rd-sys-spacing-l: 64px;
}

/* ===== radiant: src/radiant/tokens/radius.css (verbatim) ===== */
/**
 * Radiant — Radius
 * Five corner values. Radius rises with the size of the surface — the smaller
 * the element, the tighter the corner. Figma names: Radius/4 … Radius/16.
 */

:root {
  --rd-sys-radius-4: 4px;   /* Chips, checkboxes, tags & other small controls under 24px tall */
  --rd-sys-radius-6: 6px;   /* Default — buttons, inputs, search bars, menu items, segmented controls */
  --rd-sys-radius-8: 8px;   /* Modals, popovers, toasts & menu containers */
  --rd-sys-radius-12: 12px; /* Cards, tiles & panels inside a page */
  --rd-sys-radius-16: 16px; /* Page-level containers, sheets & full-width surfaces */
}

/* ===== radiant: src/radiant/tokens/typography.css (verbatim) ===== */
/**
 * Radiant — Typography
 * Font: Geist (loaded from Google Fonts in index.html). Text scale uses
 * 400 (regular) and 600 (medium) in HTML; <b> uses 700 to bold a word.
 * (Figma renders these as Light 375 / Medium 600 — HTML uses 400 / 600.)
 */

:root {
  --rd-sys-font-family: 'Geist', -apple-system, 'Helvetica Neue', Arial, system-ui, sans-serif;
  --rd-sys-font-family-mono: 'Geist Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;

  --rd-sys-font-weight-regular: 400;
  --rd-sys-font-weight-medium: 600;
  --rd-sys-font-weight-bold: 700;

  /* Per-style size / line-height / letter-spacing tokens (weights via the tokens above).
     Letter-spacing confirmed from the live Figma where available; values marked
     (infer) follow the family pattern and should be confirmed from the type node. */
  --rd-sys-type-h1-size: 32px;   --rd-sys-type-h1-line: 40px;   --rd-sys-type-h1-tracking: -0.4px; /* Display — Large Headline (infer) */
  --rd-sys-type-h2-size: 24px;   --rd-sys-type-h2-line: 32px;   --rd-sys-type-h2-tracking: -0.4px; /* Title — Page Title */
  --rd-sys-type-h3-size: 20px;   --rd-sys-type-h3-line: 28px;   --rd-sys-type-h3-tracking: -0.4px; /* Title — Modal Title */
  --rd-sys-type-h4-size: 18px;   --rd-sys-type-h4-line: 24px;   --rd-sys-type-h4-tracking: -0.4px; /* Label — Section Label (infer) */
  --rd-sys-type-h5-size: 16px;   --rd-sys-type-h5-line: 24px;   --rd-sys-type-h5-tracking: -0.4px; /* Label — Content Label */
  --rd-sys-type-subhead-size: 14px; --rd-sys-type-subhead-line: 20px; --rd-sys-type-subhead-tracking: 0; /* Label — Content Label Subhead */
  --rd-sys-type-body-large-size: 16px; --rd-sys-type-body-large-line: 24px; --rd-sys-type-body-large-tracking: 0; /* Body — Large (p-large) (infer) */
  --rd-sys-type-body-size: 14px; --rd-sys-type-body-line: 20px; --rd-sys-type-body-tracking: 0; /* Body — Normal (p) */
  --rd-sys-type-caption-size: 12px; --rd-sys-type-caption-line: 18px; --rd-sys-type-caption-tracking: -0.6px; /* Footnote / Caption / Overline */
}

/* ===== radiant: src/radiant/tokens/elevation.css (verbatim) ===== */
/**
 * Radiant — Elevations
 * Three levels. Every elevation is a two-layer shadow: a tight ambient layer
 * plus a directional layer. Values are the exact box-shadows from Figma
 * "Elevations". Light base color is #192331; dark is #000000.
 *
 * This is the authoritative shadow spec — it supersedes the opacity values in
 * the color doc's "Shadow" section (which were kept as color-only tokens).
 */

:root {
  /* Elevation/100 — smallest lift (toggle thumb, segmented active pill). Two identical layers. */
  --rd-sys-elevation-100: 0 2px 4px 0 rgba(25, 35, 49, 0.04), 0 2px 4px 0 rgba(25, 35, 49, 0.04);
  --rd-sys-elevation-surface: 0 0 4px 0 rgba(25, 35, 49, 0.1), 0 2px 4px 0 rgba(25, 35, 49, 0.04);
  --rd-sys-elevation-menu: 0 0 4px 0 rgba(25, 35, 49, 0.08), 0 12px 24px 0 rgba(25, 35, 49, 0.12);
  --rd-sys-elevation-modal: 0 0 4px 0 rgba(25, 35, 49, 0.1), 0 24px 32px 0 rgba(25, 35, 49, 0.16);
}

[data-theme='dark'] {
  --rd-sys-elevation-100: 0 2px 4px 0 rgba(0, 0, 0, 0.16), 0 2px 4px 0 rgba(0, 0, 0, 0.16);
  --rd-sys-elevation-surface: 0 0 4px 0 rgba(0, 0, 0, 0.4), 0 2px 4px 0 rgba(0, 0, 0, 0.16);
  --rd-sys-elevation-menu: 0 0 4px 0 rgba(0, 0, 0, 0.32), 0 12px 24px 0 rgba(0, 0, 0, 0.48);
  --rd-sys-elevation-modal: 0 0 4px 0 rgba(0, 0, 0, 0.4), 0 24px 32px 0 rgba(0, 0, 0, 0.64);
}

/* ===== radiant: src/radiant/reset.css (verbatim) ===== */
/**
 * Radiant — global scroll behaviour.
 * Kills the overscroll "rubber-band" / stretch and stops scroll chaining, so
 * overscrolling an inner list never bounces the surface behind it.
 * NOTE: use `contain`, NOT `none`, on `*` — `overscroll-behavior: none` on a
 * NESTED scroll container triggers a Chromium wheel-latch bug where the list
 * scrolls once and then freezes. `contain` prevents chaining without the freeze.
 * The page root keeps `none` to fully suppress the top-level rubber-band.
 */
* {
  overscroll-behavior: contain;
}
html,
body {
  overscroll-behavior: none;
}

/**
 * Radiant — Scroll bar. 8px track, fully-rounded (radius 6) gray thumb
 * (Content/Tertiary), transparent track. Applied to every scroll area.
 */
* {
  scrollbar-width: thin;
  scrollbar-color: var(--rd-sys-color-content-tertiary) transparent;
}
*::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}
*::-webkit-scrollbar-track {
  background: transparent;
}
*::-webkit-scrollbar-thumb {
  background: var(--rd-sys-color-content-tertiary);
  border-radius: var(--rd-sys-radius-6);
}
*::-webkit-scrollbar-thumb:hover {
  background: var(--rd-sys-color-content-secondary);
}
*::-webkit-scrollbar-corner {
  background: transparent;
}

/* ===== radiant: alias bridge =====
   The prototype's own variable names, re-pointed at the real Radiant tokens above,
   so every rule written against them now resolves to a design-system value. Kept
   rather than search-replaced: the names read as what the prototype means by them,
   and a token that moves in Radiant moves here in one place. */
:root{
  /* The portal is an app page, so it sits on bg-base -- which is also what every
     Radiant component assumes behind it. That pushes the stack up a step: a card or
     a block laid on the page is bg-on-base, and only a menu, a popover or the
     prototype's own panel is bg-raised. */
  --page:var(--rd-sys-color-bg-base);
  /* The bar floats over the page, so it takes bg-raised -- kept just short of
     opaque, so the list still shows through as it passes underneath. */
  --page-glass:color-mix(in srgb, var(--rd-sys-color-bg-raised) 86%, transparent);
  --panel:var(--rd-sys-color-bg-on-base);
  --raised:var(--rd-sys-color-bg-raised);
  --track:var(--rd-sys-color-bg-secondary-action);
  --text:var(--rd-sys-color-content-primary);
  --text-dim:var(--rd-sys-color-content-secondary);
  --icon-dim:var(--rd-sys-color-content-tertiary);
  --accent:var(--rd-sys-color-content-brand);
  --error:var(--rd-sys-color-content-failure);
  --ok:var(--rd-sys-color-content-success);
  --ok-bg:var(--rd-sys-color-bg-success);
  --hairline:var(--rd-sys-color-border-subtle);
  --hairline-hover:var(--rd-sys-color-border-subtle-hover);
  --field:var(--rd-sys-color-border-bold);
  --field-hover:var(--rd-sys-color-border-bold-hover);
  --ghost-hover:var(--rd-sys-color-bg-ghost-hover);
  --ghost-sel:var(--rd-sys-color-bg-ghost-highlight);
  --shadow-menu:var(--rd-sys-elevation-menu);
  /* Radiant's Surface elevation -- the lightest of the three that lifts -- mirrored:
     its directional layer points down, which a bar standing on the screen's bottom
     edge throws off-screen. The system's own shadow colours; only the direction is
     the page's. */
  --shadow-lift:0 0 4px 0 var(--rd-sys-color-shadow-surface-1),
                0 -2px 4px 0 var(--rd-sys-color-shadow-surface-2);
  /* the 8pt steps the prototype was built on, each one a step of Radiant's own
     4pt ramp rather than a parallel scale */
  --s1:var(--rd-sys-spacing-b);  /* 8  */
  --s2:var(--rd-sys-spacing-d);  /* 16 */
  --s3:var(--rd-sys-spacing-f);  /* 24 */
  --s4:var(--rd-sys-spacing-h);  /* 32 */
  --s5:var(--rd-sys-spacing-j);  /* 48 */
  --s6:var(--rd-sys-spacing-l);  /* 64 */
  /* what sits on the brand fill: the inverse of the page, per the button spec */
  --on-accent:var(--rd-sys-color-content-inverse);
  /* The travelling highlight on working text is the one thing with no token: Radiant
     has none for a moving flare, and its own Shimmer hardcodes its stops for the same
     reason. So the two ends are named here off the primitive ramp -- the resting end a
     step back from the text colour, the flare a step past it -- and each theme names
     its own pair, because a flare brightens on a dark ground and darkens on a light one. */
  --shim-rest:var(--rad-gray-50);
  --shim-flare:var(--rad-gray-90);
  --shim-acc-rest:var(--rad-blue-50);
  --shim-acc-flare:var(--rad-blue-80);
  --sweep-flare:var(--rad-blue-80);
}
[data-theme='dark']{
  --shim-rest:var(--rad-darkgray-80);
  --shim-flare:var(--rad-gray-0);
  --shim-acc-rest:color-mix(in srgb,var(--rad-blue-50) 70%,var(--rad-darkgray-0));
  --shim-acc-flare:var(--rad-blue-20);
  --sweep-flare:var(--rad-blue-20);
}

/* Radiant components — each block is the component's own stylesheet from       */
/* src/radiant/components/<Name>/<Name>.css, copied verbatim. Anything the      */
/* prototype needs on top of a component sits in the "fit" block at the end,    */
/* never inside these.                                                          */
/* ================================================================== */

/* ----- src/radiant/components/Icon/Icon.css ----- */
/** Radiant — Icon. Renders a Radiant SVG glyph; inherits its context's colour
    (so a CTA's icon matches the CTA text), scales to `size`. */
.rad-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  line-height: 0;
  color: inherit;
}
.rad-icon svg {
  width: 100%;
  height: 100%;
  display: block;
}

/* ----- src/radiant/components/Button/Button.css ----- */
/**
 * Radiant — Button styles. Values taken verbatim from the Figma "Button"
 * component set (node 16814:14250). Colors reference semantic tokens.
 *
 * Geometry:
 *   Basic — padding 6px 16px, radius 16px (pill on the 32px height)
 *   Small — padding 3px 12px, radius 12px
 *   Tertiary — minimal x-padding (…4px), radius 6px (text-button feel)
 */

.rad-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--rd-sys-spacing-a); /* 4px icon↔label; Figma tightens tertiary, see below */
  box-sizing: border-box;
  border: none;
  outline: none;
  cursor: pointer;
  white-space: nowrap;
  font-family: var(--rd-sys-font-family);
  /* Label style = Body/Normal (14/20, 400) at Basic; Small steps down to caption */
  font-weight: var(--rd-sys-font-weight-regular);
  text-decoration: none;
  transition: background-color 120ms ease, color 120ms ease;
}

.rad-btn__label {
  display: inline-block;
}
.rad-btn__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

/* ---------------- Sizes ---------------- */
.rad-btn--basic,
.rad-btn--large {
  padding: 6px var(--rd-sys-spacing-d); /* 6px 16px */
  min-height: 32px;
  font-size: var(--rd-sys-type-body-size); /* 14px */
  line-height: var(--rd-sys-type-body-line); /* 20px */
  letter-spacing: var(--rd-sys-type-body-tracking);
  border-radius: var(--rd-sys-radius-16); /* pill */
  gap: var(--rd-sys-spacing-b); /* 8px */
}
.rad-btn--small {
  padding: 3px var(--rd-sys-spacing-c); /* 3px 12px */
  min-height: 24px;
  font-size: var(--rd-sys-type-caption-size); /* 12px */
  line-height: var(--rd-sys-type-caption-line); /* 18px */
  letter-spacing: var(--rd-sys-type-caption-tracking);
  border-radius: var(--rd-sys-radius-12);
  gap: var(--rd-sys-spacing-a); /* 4px */
}

/* Icon box scales with size */
.rad-btn--basic .rad-btn__icon,
.rad-btn--large .rad-btn__icon { font-size: 16px; }
.rad-btn--small .rad-btn__icon { font-size: 14px; }

/* ---------------- Primary ---------------- */
.rad-btn--primary {
  background: var(--rd-sys-color-button-background-primary-default);
  color: var(--rd-sys-color-content-inverse);
}
.rad-btn--primary:hover,
.rad-btn--primary[data-force-state='hover'] {
  background: var(--rd-sys-color-button-background-primary-hover);
}
.rad-btn--primary:active,
.rad-btn--primary[data-force-state='activated'] {
  background: var(--rd-sys-color-button-background-primary-pressed);
}

/* ---------------- Secondary ---------------- */
.rad-btn--secondary {
  background: var(--rd-sys-color-button-background-secondary-default);
  color: var(--rd-sys-color-content-primary);
}
.rad-btn--secondary:hover,
.rad-btn--secondary[data-force-state='hover'] {
  background: var(--rd-sys-color-button-background-secondary-hover);
}
.rad-btn--secondary:active,
.rad-btn--secondary[data-force-state='activated'] {
  background: var(--rd-sys-color-button-background-secondary-pressed);
}

/* ---------------- Tertiary ---------------- */
.rad-btn--tertiary {
  background: transparent;
  color: var(--rd-sys-color-content-brand);
  border-radius: var(--rd-sys-radius-6);
}
.rad-btn--tertiary.rad-btn--basic,
.rad-btn--tertiary.rad-btn--large {
  padding: 6px var(--rd-sys-spacing-a); /* 6px 4px */
}
.rad-btn--tertiary.rad-btn--small {
  padding: 3px var(--rd-sys-spacing-a); /* 3px 4px */
}
.rad-btn--tertiary:hover,
.rad-btn--tertiary[data-force-state='hover'] {
  background: var(--rd-sys-color-bg-ghost-hover);
}
.rad-btn--tertiary:active,
.rad-btn--tertiary[data-force-state='activated'] {
  background: var(--rd-sys-color-bg-ghost-highlight);
}

/* ---------------- Disabled ----------------
   Figma keeps Secondary's resting fill and mutes the label; Primary/Tertiary
   fall back to a muted, non-interactive look. (Disabled label = content-tertiary;
   confirm exact disabled tokens from the Button node if they diverge.) */
.rad-btn:disabled,
.rad-btn[aria-disabled='true'] {
  cursor: not-allowed;
  color: var(--rd-sys-color-content-tertiary);
}
.rad-btn--primary:disabled {
  background: var(--rd-sys-color-button-background-secondary-default);
}
.rad-btn--tertiary:disabled {
  background: transparent;
}

/* ---------------- White colorway (on colored / brand surfaces) ----------------
   Figma defines this for Primary + Tertiary. Primary = white fill with brand
   label (on-color tokens); Tertiary = ghost washes with a white label. */
.rad-btn--on-color.rad-btn--primary {
  background: var(--rd-sys-color-button-background-primary-on-color-default);
  color: var(--rd-sys-color-content-brand);
}
.rad-btn--on-color.rad-btn--primary:hover,
.rad-btn--on-color.rad-btn--primary[data-force-state='hover'] {
  background: var(--rd-sys-color-button-background-primary-on-color-hover);
}
.rad-btn--on-color.rad-btn--primary:active,
.rad-btn--on-color.rad-btn--primary[data-force-state='activated'] {
  background: var(--rd-sys-color-button-background-primary-on-color-pressed);
}
.rad-btn--on-color.rad-btn--tertiary {
  color: var(--rd-sys-color-content-inverse);
}

/* Focus ring — Radiant focus border token */
.rad-btn:focus-visible {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 1px;
}

/* ----- src/radiant/components/IconButton/IconButton.css ----- */
/**
 * Radiant — Icon button. Circular icon-only button.
 * Verified against the Figma "Icon buttton" render:
 *   Primary   — filled blue circle, white icon (blue60→70→80)
 *   Secondary — filled gray circle, dark icon (gray20→30→40)
 *   Ghost     — transparent → ghost-hover → ghost-highlight (icon turns brand on activate)
 * Sizes: Standard 32 · Small 24 · XS 20. Disabled = 40% opacity.
 */

.rad-iconbtn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  border: none;
  outline: none;
  padding: 0;
  cursor: pointer;
  border-radius: 50%;
  transition: background-color 120ms ease, color 120ms ease;
}
.rad-iconbtn__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 0;
}
/* Notification badge — red dot hugging the top-right (Figma Ellipse 260, 12px,
   x=20 y=-2 on the 32px button). A 2px ring in the surface colour punches it out. */
.rad-iconbtn--dot { position: relative; overflow: visible; }
.rad-iconbtn__dot {
  position: absolute;
  top: -2px;
  right: -2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--rd-sys-color-content-failure);
  box-shadow: 0 0 0 2px var(--rd-sys-color-bg-base);
}

/* Sizes (square → circle) */
.rad-iconbtn--standard { width: 32px; height: 32px; }
.rad-iconbtn--small { width: 24px; height: 24px; }
.rad-iconbtn--xs { width: 20px; height: 20px; }
.rad-iconbtn--standard .rad-iconbtn__icon { font-size: 20px; }
.rad-iconbtn--small .rad-iconbtn__icon { font-size: 16px; }
.rad-iconbtn--xs .rad-iconbtn__icon { font-size: 14px; }

/* Primary — filled blue, white icon */
.rad-iconbtn--primary {
  background: var(--rd-sys-color-button-background-primary-default);
  color: var(--rd-sys-color-content-inverse);
}
.rad-iconbtn--primary:hover,
.rad-iconbtn--primary[data-force-state='hover'] {
  background: var(--rd-sys-color-button-background-primary-hover);
}
.rad-iconbtn--primary:active,
.rad-iconbtn--primary[data-force-state='activated'] {
  background: var(--rd-sys-color-button-background-primary-pressed);
}

/* Secondary — filled gray, dark icon */
.rad-iconbtn--secondary {
  background: var(--rd-sys-color-button-background-secondary-default);
  color: var(--rd-sys-color-content-primary);
}
.rad-iconbtn--secondary:hover,
.rad-iconbtn--secondary[data-force-state='hover'] {
  background: var(--rd-sys-color-button-background-secondary-hover);
}
.rad-iconbtn--secondary:active,
.rad-iconbtn--secondary[data-force-state='activated'] {
  background: var(--rd-sys-color-button-background-secondary-pressed);
}

/* Ghost — transparent, icon = muted secondary; washes on hover/active; icon → brand on activate */
.rad-iconbtn--ghost {
  background: transparent;
  color: var(--rd-sys-color-content-secondary);
}
.rad-iconbtn--ghost:hover,
.rad-iconbtn--ghost[data-force-state='hover'] {
  background: var(--rd-sys-color-bg-ghost-hover);
}
.rad-iconbtn--ghost:active,
.rad-iconbtn--ghost[data-force-state='activated'] {
  background: var(--rd-sys-color-bg-ghost-highlight);
  color: var(--rd-sys-color-content-brand);
}
/* Ghost on colored surfaces — white icon */
.rad-iconbtn--ghost.rad-iconbtn--on-color {
  color: var(--rd-sys-color-content-inverse);
}

/* Disabled — whole control at 40% */
.rad-iconbtn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

.rad-iconbtn:focus-visible {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 1px;
}

/* ----- src/radiant/components/Checkbox/Checkbox.css ----- */
/** Radiant — Checkbox (Figma "Checkbox" 378:17205), verified 1:1 by sampling the
    render: OUTLINED in every state — white fill, no filled square.
      • Unselected: gray border, no mark.
      • Selected / Intermediate: brand-blue border + brand-blue check / minus.
      • Error: red border + red mark.
      • Disabled: whole control at 40% opacity.
    16px box, radius 4. */
.rad-check {
  position: relative;
  display: inline-flex;
  width: 16px;
  height: 16px;
  flex: none;
}
.rad-check__input {
  position: absolute;
  inset: 0;
  margin: 0;
  opacity: 0;
  cursor: pointer;
}
.rad-check__box {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  /* Decorative only — let clicks fall through to the input beneath (which is
     opacity:0 and painted below this box), so a bare checkbox toggles on click. */
  pointer-events: none;
  border: 1px solid var(--rd-sys-color-border-bold); /* unselected: gray outline */
  border-radius: 1.5px; /* Figma: rx 1.5 — measured from render (a subtle round, not 4px) */
  background: var(--rd-sys-color-bg-base); /* white fill — never a filled square */
  color: var(--rd-sys-color-content-brand); /* the check / minus colour */
  transition: border-color 100ms ease, color 100ms ease;
}
.rad-check__mark {
  width: 14px; /* 14×14 glyph centred in the 16px box (1px inset each side) */
  height: 14px;
  opacity: 0;
}
/* hover only affects the unselected box */
.rad-check__input:hover:not(:checked):not(:indeterminate) + .rad-check__box {
  border-color: var(--rd-sys-color-border-bold-hover);
}
/* Selected / Intermediate = brand border + brand mark (fill stays white) */
.rad-check__input:checked + .rad-check__box,
.rad-check__input:indeterminate + .rad-check__box {
  border-color: var(--rd-sys-color-border-brand);
}
.rad-check__input:checked + .rad-check__box .rad-check__mark,
.rad-check__input:indeterminate + .rad-check__box .rad-check__mark {
  opacity: 1;
}
.rad-check__input:focus-visible + .rad-check__box {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 1px;
}
.rad-check__input:disabled + .rad-check__box { cursor: not-allowed; }

/* Error = red border + red mark in every state. The extra `.rad-check--error`
   class out-specifies the checked / indeterminate / hover rules above. */
.rad-check--error .rad-check__box,
.rad-check--error .rad-check__input:hover + .rad-check__box,
.rad-check--error .rad-check__input:checked + .rad-check__box,
.rad-check--error .rad-check__input:indeterminate + .rad-check__box {
  border-color: var(--rd-sys-color-border-failure);
  color: var(--rd-sys-color-content-failure);
}

/* Disabled fades the whole control (box + label) to 40%. */
.rad-check:has(.rad-check__input:disabled),
.rad-check-field:has(.rad-check__input:disabled) { opacity: 0.4; }

.rad-check-field {
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px (Figma) */
  cursor: pointer;
}
.rad-check-field__label {
  color: var(--rd-sys-color-content-primary);
}

/* ----- src/radiant/components/Radio/Radio.css ----- */
/**
 * Radiant — Radio. 16px ring, 1px border (Figma: circle r7.5 stroke 1px).
 *   Unselected — gray #C0C6CF ring · Selected — blue ring + 8px blue dot.
 *   Error — red ring (+ red dot when selected), in every state.
 *   Disabled — 40%.
 */
.rad-radio { position: relative; display: inline-flex; width: 16px; height: 16px; flex: none; }
.rad-radio__input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; }

.rad-radio__ring {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid var(--rd-sys-color-border-bold);
  border-radius: 50%;
  background: var(--rd-sys-color-bg-base);
  transition: border-color 100ms ease;
}
.rad-radio__dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--rd-sys-color-bg-brand);
  transform: scale(0);
  transition: transform 100ms ease;
}
.rad-radio__input:hover + .rad-radio__ring { border-color: var(--rd-sys-color-border-bold-hover); }
.rad-radio__input:checked + .rad-radio__ring { border-color: var(--rd-sys-color-border-brand); }
.rad-radio__input:checked + .rad-radio__ring .rad-radio__dot { transform: scale(1); }
.rad-radio__input:focus-visible + .rad-radio__ring {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 1px;
}
.rad-radio__input:disabled + .rad-radio__ring { cursor: not-allowed; }
.rad-radio:has(.rad-radio__input:disabled) { opacity: 0.4; }

/* Error — red ring + red dot in EVERY state (must out-specify :checked / :hover). */
.rad-radio--error .rad-radio__ring,
.rad-radio--error .rad-radio__input:hover + .rad-radio__ring,
.rad-radio--error .rad-radio__input:checked + .rad-radio__ring {
  border-color: var(--rd-sys-color-border-failure);
}
.rad-radio--error .rad-radio__dot { background: var(--rd-sys-color-content-failure); }

.rad-radio-field {
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px */
  cursor: pointer;
}
.rad-radio-field__label { color: var(--rd-sys-color-content-primary); }

/* ----- src/radiant/components/Toggle/Toggle.css ----- */
/**
 * Radiant — Toggle. Exact geometry from the Figma "Toggle/Utils" SVG:
 *   switch 28×16 · track 28×8 (radius 4) · thumb 16px overhanging the track.
 *   Off  — track #C0C6CF, white thumb + 1px #DBDFE7 ring, Elevation/100.
 *   On   — track #CEDCF5, solid #2770EF thumb (no ring), thumb travels 12px.
 *   Disabled — whole switch (and label) at 40%.
 */
.rad-toggle { position: relative; display: inline-flex; width: 28px; height: 16px; flex: none; }
.rad-toggle__input { position: absolute; inset: 0; margin: 0; opacity: 0; cursor: pointer; z-index: 1; }

.rad-toggle__track {
  position: absolute;
  top: 4px; /* (16 - 8) / 2 */
  left: 0;
  width: 28px;
  height: 8px;
  box-sizing: border-box;
  border-radius: 4px;
  background: var(--rd-sys-color-toggle-track-off);
  transition: background-color 120ms ease;
}
.rad-toggle__thumb {
  position: absolute;
  top: 0;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border-radius: 50%;
  background: var(--rd-sys-color-toggle-thumb-off);
  border: 1px solid var(--rd-sys-color-toggle-thumb-outline-off);
  box-shadow: var(--rd-sys-elevation-100);
  transition: transform 120ms ease, background-color 120ms ease, border-color 120ms ease;
}
.rad-toggle__input:checked ~ .rad-toggle__track {
  background: var(--rd-sys-color-toggle-track-on);
}
.rad-toggle__input:checked ~ .rad-toggle__thumb {
  transform: translateX(12px); /* 28 track − 16 thumb */
  background: var(--rd-sys-color-toggle-thumb-on);
  border-color: transparent;
}
.rad-toggle__input:focus-visible ~ .rad-toggle__track {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 3px;
}

/* Disabled — dim the whole control (matches Figma's 40% on the component). */
.rad-toggle.is-disabled,
.rad-toggle-field.is-disabled { opacity: 0.4; }
.rad-toggle.is-disabled,
.rad-toggle.is-disabled .rad-toggle__input,
.rad-toggle-field.is-disabled,
.rad-toggle-field.is-disabled .rad-toggle__input { cursor: not-allowed; }

.rad-toggle-field {
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px */
  cursor: pointer;
}
.rad-toggle-field__label { color: var(--rd-sys-color-content-primary); }

/* ----- src/radiant/components/SegmentedControl/SegmentedControl.css ----- */
/**
 * Radiant — Segmented control. Container bg secondary-action (gray-20), pill,
 * 2px padding. Active segment = white (bg-active) + Surface shadow + brand content.
 */
.rad-segmented {
  display: inline-flex;
  align-items: center;
  gap: 0;
  padding: 2px;
  background: var(--rd-sys-color-bg-secondary-action);
  border-radius: 32px; /* Figma container radius */
}
.rad-segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--rd-sys-spacing-b);
  border: none;
  background: transparent;
  cursor: pointer;
  padding: 4px var(--rd-sys-spacing-d); /* Figma: 4px 16px */
  border-radius: 14px; /* Figma item radius */
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size);
  line-height: var(--rd-sys-type-body-line);
  color: var(--rd-sys-color-content-primary);
  transition: background-color 120ms ease, color 120ms ease;
}
.rad-segmented__item--icon { padding: 4px 10px; }
.rad-segmented__icon { display: inline-flex; align-items: center; font-size: 16px; }

.rad-segmented__item:hover:not(.is-active) {
  background: var(--rd-sys-color-bg-ghost-hover);
  color: var(--rd-sys-color-content-primary);
}
.rad-segmented__item.is-active {
  background: var(--rd-sys-color-bg-active);
  color: var(--rd-sys-color-segmented-control-content-active);
  box-shadow: var(--rd-sys-elevation-100); /* Figma: Elevation/100 */
}
.rad-segmented__item:focus-visible {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 1px;
}

/* ----- src/radiant/components/Field/Field.css ----- */
/**
 * Radiant — Field (shared input scaffold). From "Text input" (361:14470).
 *   Label row — 12px caption; primary, blue on focus, red on error (+ icon).
 *   Box — 32px min-height, padding 6px 12px 6px 16px, radius 6, 1px border.
 *   States — default border-bold, hover border-bold-hover, focus brand,
 *            error failure, read-only sunken bg (no border), disabled 40%.
 */

.rad-field {
  display: flex;
  flex-direction: column;
  gap: var(--rd-sys-spacing-a); /* 4px */
  font-family: var(--rd-sys-font-family);
}

.rad-field__label-row {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-a);
}
.rad-field__label {
  font-size: var(--rd-sys-type-caption-size); /* 12px */
  line-height: var(--rd-sys-type-caption-line);
  letter-spacing: var(--rd-sys-type-caption-tracking);
  font-weight: var(--rd-sys-font-weight-medium); /* "Label" is semibold (Figma) */
  color: var(--rd-sys-color-content-primary);
}
.rad-field__helper {
  font-size: var(--rd-sys-type-caption-size);
  line-height: var(--rd-sys-type-caption-line);
  letter-spacing: var(--rd-sys-type-caption-tracking);
  color: var(--rd-sys-color-content-secondary);
}
.rad-field__erricon {
  display: inline-flex;
  color: var(--rd-sys-color-content-failure);
}

/* Box */
.rad-field__box {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px */
  box-sizing: border-box;
  min-height: 32px;
  padding: 6px 12px 6px var(--rd-sys-spacing-d); /* 6px 12px 6px 16px */
  background: var(--rd-sys-color-bg-base);
  border: 1px solid var(--rd-sys-color-border-bold);
  border-radius: var(--rd-sys-radius-6);
  transition: border-color 100ms ease;
}
.rad-field__box:hover {
  border-color: var(--rd-sys-color-border-bold-hover);
}
.rad-field:focus-within .rad-field__box,
.rad-field--active .rad-field__box {
  border-color: var(--rd-sys-color-border-brand);
}

/* Controls inside the box */
.rad-field__box input,
.rad-field__box textarea {
  flex: 1 1 auto;
  min-width: 0;
  border: none;
  outline: none;
  box-shadow: none;
  background: transparent;
  padding: 0;
  margin: 0;
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size); /* 14px */
  line-height: var(--rd-sys-type-body-line);
  color: var(--rd-sys-color-content-primary);
  resize: none;
}
/* Override the legacy global `input:focus` blue ring (index.css) — Radiant fields
   signal focus with the box border only. Needs :focus to outrank `input:focus`. */
.rad-field__box input:focus,
.rad-field__box textarea:focus { box-shadow: none; }
.rad-field__box input::placeholder,
.rad-field__box textarea::placeholder {
  color: var(--rd-sys-color-content-secondary);
}
.rad-field__box .rad-field__icon {
  display: inline-flex;
  align-items: center;
  color: var(--rd-sys-color-content-secondary);
  font-size: 16px;
  flex: none;
}

/* Focus — label turns blue */
.rad-field:focus-within .rad-field__label,
.rad-field--active .rad-field__label {
  color: var(--rd-sys-color-content-brand);
}

/* Error */
.rad-field--error .rad-field__label { color: var(--rd-sys-color-content-failure); }
.rad-field--error .rad-field__box { border-color: var(--rd-sys-color-border-failure); }
.rad-field--error:focus-within .rad-field__box { border-color: var(--rd-sys-color-border-failure); }

/* Read only — sunken fill, no border */
.rad-field--readonly .rad-field__box {
  background: var(--rd-sys-color-bg-sunken);
  border-color: transparent;
}

/* Disabled — whole field at 40% */
.rad-field--disabled {
  opacity: 0.4;
  pointer-events: none;
}

/* ----- src/radiant/components/SearchBar/SearchBar.css ----- */
/** Radiant — Search bar. */
.rad-searchbar input[type='search']::-webkit-search-cancel-button { display: none; }

.rad-searchbar__clear {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  cursor: pointer;
  color: var(--rd-sys-color-content-secondary);
  padding: 0;
  flex: none;
}
.rad-searchbar__clear:hover { color: var(--rd-sys-color-content-primary); }
/* Keep the slot (width) but hide it when the field is empty. */
.rad-searchbar__clear.is-hidden { visibility: hidden; pointer-events: none; }

/* Underline variant — bottom border only (Figma "Type=Underlined": #EAEDF2
   subtle border, 10px 16px padding). Stays subtle on hover; brand on focus. */
.rad-field__box--underline {
  border: none;
  border-bottom: 1px solid var(--rd-sys-color-border-subtle);
  border-radius: 0;
  padding: 10px var(--rd-sys-spacing-d);
  background: transparent;
}
.rad-field__box--underline:hover {
  border-color: var(--rd-sys-color-border-subtle);
}
.rad-field:focus-within .rad-field__box--underline {
  border-color: var(--rd-sys-color-border-brand);
}

/* ----- src/radiant/components/Select/Select.css ----- */
/** Radiant — Select dropdown. */
.rad-select__anchor { position: relative; }

.rad-select__trigger {
  width: 100%;
  cursor: pointer;
  text-align: left;
  justify-content: space-between;
  gap: var(--rd-sys-spacing-b);
}
.rad-select__trigger:disabled { cursor: not-allowed; }
.rad-select__value {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: var(--rd-sys-type-body-size);
  line-height: var(--rd-sys-type-body-line);
  color: var(--rd-sys-color-content-primary);
}
.rad-select__value.is-placeholder { color: var(--rd-sys-color-content-secondary); }
.rad-select__chev { color: var(--rd-sys-color-content-secondary); }

/* Menu (Elevation/Menu) */
.rad-select__menu {
  position: absolute;
  top: calc(100% + 4px);
  left: 0;
  right: 0;
  z-index: 30;
  display: flex;
  flex-direction: column;
  padding: var(--rd-sys-spacing-a);
  background: var(--rd-sys-color-bg-raised);
  border-radius: var(--rd-sys-radius-8);
  box-shadow: var(--rd-sys-elevation-menu);
  max-height: 280px;
  overflow-y: auto;
}
.rad-select__option {
  border: none;
  background: transparent;
  cursor: pointer;
  text-align: left;
  padding: var(--rd-sys-spacing-b) var(--rd-sys-spacing-c);
  border-radius: var(--rd-sys-radius-6);
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size);
  line-height: var(--rd-sys-type-body-line);
  color: var(--rd-sys-color-content-primary);
}
.rad-select__option:hover { background: var(--rd-sys-color-bg-ghost-hover); }
.rad-select__option.is-selected {
  background: var(--rd-sys-color-bg-ghost-highlight);
  color: var(--rd-sys-color-content-brand);
}
.rad-select__empty {
  padding: var(--rd-sys-spacing-b) var(--rd-sys-spacing-c);
  font-size: var(--rd-sys-type-body-size);
  color: var(--rd-sys-color-content-secondary);
}

/* ----- src/radiant/components/Menu/Menu.css ----- */
/**
 * Radiant — Menu / Dropdown list. From the "Single line", "_Utils/ Single line
 * List item", "_Utils/ Two line list item" and "Menu" Figma sets.
 *   Surface — white, radius-6, Elevation/Menu, 8px vertical padding.
 *   Item    — row, pad 6px 16px, gap 12px; hover = ghost-hover (gray@12%),
 *             activated = ghost-highlight (blue@12%) + brand label, disabled = 0.4.
 */

/* ---------------- Surface ---------------- */
.rad-menu {
  display: flex;
  flex-direction: column;
  box-sizing: border-box;
  background: var(--rd-sys-color-bg-base);
  border-radius: var(--rd-sys-radius-6);
  box-shadow: var(--rd-sys-elevation-menu);
  overflow: hidden; /* clip the flush search bar to the rounded corners */
  min-width: 172px;
  font-family: var(--rd-sys-font-family);
}
/* Search sits flush at the top; the SearchBar's own underline is the divider. */
.rad-menu__search { display: block; }
.rad-menu__search .rad-field { width: 100%; }
.rad-menu__list {
  display: flex;
  flex-direction: column;
  min-height: 0;
  padding: var(--rd-sys-spacing-b) 0; /* 8px top/bottom (Figma list frame) */
}
.rad-menu__list--scroll { overflow-y: auto; }

/* ---------------- Single-line item ---------------- */
.rad-menu-item {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c);
  padding: 6px var(--rd-sys-spacing-d); /* Figma: 6px 16px → 32px row on a 20px line */
  border: none;
  background: transparent;
  width: 100%;
  text-align: left;
  cursor: pointer;
  color: var(--rd-sys-color-content-primary);
  transition: background-color 100ms ease;
}
.rad-menu-item:hover { background: var(--rd-sys-color-bg-ghost-hover); }
.rad-menu-item.is-activated { background: var(--rd-sys-color-bg-ghost-highlight); }
.rad-menu-item.is-activated .rad-menu-item__label,
.rad-menu-item.is-activated .rad-menu-item__num { color: var(--rd-sys-color-content-brand); }
.rad-menu-item:disabled,
.rad-menu-item.is-disabled { opacity: 0.4; cursor: not-allowed; }
.rad-menu-item:disabled:hover,
.rad-menu-item.is-disabled:hover { background: transparent; }

.rad-menu-item__icon {
  display: inline-flex;
  flex: none;
  width: 16px;
  height: 16px;
  color: var(--rd-sys-color-content-primary);
}
.rad-menu-item__label {
  flex: 1 1 auto;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: var(--rd-sys-color-content-primary);
}
.rad-menu-item__num {
  flex: none;
  margin-left: auto;
  color: var(--rd-sys-color-content-secondary);
  font-variant-numeric: tabular-nums;
}
/* a trailing number after a fill label doesn't need the auto margin */
.rad-menu-item__label + .rad-menu-item__num { margin-left: var(--rd-sys-spacing-c); }
.rad-menu-item__chevron {
  display: inline-flex;
  flex: none;
  margin-left: auto;
  width: 16px;
  height: 16px;
  color: var(--rd-sys-color-content-secondary);
}
.rad-menu-item__label + .rad-menu-item__chevron { margin-left: var(--rd-sys-spacing-c); }
.rad-menu-item__check { flex: none; }

/* ---------------- Two-line item ---------------- */
.rad-menu-item--two {
  flex-direction: column;
  align-items: stretch;
  gap: 0;
  padding: 5px var(--rd-sys-spacing-d);
}
.rad-menu-item__title {
  color: var(--rd-sys-color-content-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rad-menu-item__sub {
  color: var(--rd-sys-color-content-secondary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.rad-menu-item--two.is-activated .rad-menu-item__title,
.rad-menu-item--two.is-activated .rad-menu-item__sub { color: var(--rd-sys-color-content-brand); }

/* ---------------- Section title ---------------- */
/* Label/Content Label Subhead — normal case, medium 14px (NOT small-caps). */
.rad-menu-section {
  padding: 6px var(--rd-sys-spacing-d);
  color: var(--rd-sys-color-content-primary);
}

/* ---------------- Divider ---------------- */
.rad-menu-divider {
  height: 1px;
  background: var(--rd-sys-color-border-subtle);
  border: none;
  margin: var(--rd-sys-spacing-b) 0;
}

/* ---------------- Clear-selection footer ---------------- */
.rad-menu__footer {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  height: 40px;
  padding: 0 var(--rd-sys-spacing-c);
  border-top: 1px solid var(--rd-sys-color-border-subtle);
  margin-top: var(--rd-sys-spacing-b);
}

/* ---------------- No results ---------------- */
.rad-menu__empty {
  padding: 6px var(--rd-sys-spacing-d);
  color: var(--rd-sys-color-content-secondary);
  text-align: left;
}

/* ----- src/radiant/components/ListItem/ListItem.css ----- */
/** Radiant — single-line List item (Figma "_Utils/ Single line List item" 501:79830).
    Row, 6px 16px padding, 12px gap, ~32px tall. leading · label [· secondary] … [trailing]. */
.rad-listitem {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px */
  box-sizing: border-box;
  min-height: 32px;
  padding: 6px var(--rd-sys-spacing-d); /* 6px 16px */
  cursor: pointer;
}
.rad-listitem__text { color: var(--rd-sys-color-content-primary); }
/* Secondary (e.g. data type) — same Body/Normal size, content-secondary. */
.rad-listitem__secondary { color: var(--rd-sys-color-content-secondary); }
.rad-listitem__trailing { display: inline-flex; align-items: center; }

.rad-listitem:not(.is-disabled):hover { background: var(--rd-sys-color-bg-ghost-hover); }
.rad-listitem.is-disabled { cursor: not-allowed; }
.rad-listitem.is-disabled .rad-listitem__text,
.rad-listitem.is-disabled .rad-listitem__secondary { color: var(--rd-sys-color-content-tertiary); }

/* ----- src/radiant/components/Link/Link.css ----- */
/**
 * Radiant — Link styles. From Figma "Link" set: Weight (Light/Medium) ×
 * Type/tone (Blue/White/Black/Gray) × State (Default / Hover=underline).
 */

.rad-link {
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size); /* 14px */
  line-height: var(--rd-sys-type-body-line); /* 20px */
  cursor: pointer;
  text-decoration: none;
  transition: text-decoration-color 100ms ease;
}

/* Size */
.rad-link--small {
  font-size: var(--rd-sys-type-caption-size); /* 12px */
  line-height: var(--rd-sys-type-caption-line);
}

/* Weight */
.rad-link--light { font-weight: var(--rd-sys-font-weight-regular); }
.rad-link--medium { font-weight: var(--rd-sys-font-weight-medium); letter-spacing: var(--rd-sys-type-subhead-tracking); }

/* Tone */
.rad-link--blue { color: var(--rd-sys-color-content-brand); }
.rad-link--white { color: var(--rd-sys-color-content-inverse); }
.rad-link--black { color: var(--rd-sys-color-content-primary); }
.rad-link--gray { color: var(--rd-sys-color-content-secondary); }

/* Always-underlined variant */
.rad-link--underline {
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* Hover — underline */
.rad-link:hover,
.rad-link--force-hover {
  text-decoration: underline;
  text-underline-offset: 2px;
}

.rad-link:focus-visible {
  outline: 2px solid var(--rd-sys-color-border-focus);
  outline-offset: 2px;
  border-radius: var(--rd-sys-radius-4);
}

/* ----- src/radiant/components/Tag/Tag.css ----- */
/** Radiant — Tag (outlined). Exact from Figma "Tag" (17763:20960):
    padding 2px 4px, radius 4px, 1px blue-60 border, Body/Normal 14px text. */
.rad-tag {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  box-sizing: border-box;
  padding: 2px var(--rd-sys-spacing-a); /* 2px 4px */
  border: 1px solid var(--rd-sys-color-content-brand);
  border-radius: var(--rd-sys-radius-4);
  color: var(--rd-sys-color-content-primary);
  background: var(--rd-sys-color-bg-base);
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size); /* 14px */
  line-height: var(--rd-sys-type-body-line);
  font-weight: var(--rd-sys-font-weight-regular);
  white-space: nowrap;
}

/* ----- src/radiant/components/Chip/Chip.css ----- */
/** Radiant — Chip / read-only token. Exact from Figma "Token / Read Only":
    padding 2px 4px, radius 4, height 24, Body/Normal 14px, fill per kind. */
.rad-chip {
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-b); /* 8px icon↔label */
  box-sizing: border-box;
  min-height: 24px;
  padding: 2px var(--rd-sys-spacing-a); /* 2px 4px */
  border: none;
  border-radius: var(--rd-sys-radius-4);
  color: var(--rd-sys-color-content-primary);
  white-space: nowrap;
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size); /* 14px */
  line-height: var(--rd-sys-type-body-line);
  font-weight: var(--rd-sys-font-weight-regular);
  cursor: default;
}
button.rad-chip { cursor: pointer; }
.rad-chip__icon {
  display: inline-flex;
  align-items: center;
  font-size: 14px;
  line-height: 0;
}

.rad-chip--attribute { background: var(--rd-sys-color-chip-attribute-default); }
.rad-chip--attribute .rad-chip__icon { color: var(--rd-sys-color-chip-attribute-icon); }
.rad-chip--measure { background: var(--rd-sys-color-chip-measure-default); }
.rad-chip--measure .rad-chip__icon { color: var(--rd-sys-color-chip-measure-icon); }
.rad-chip--filter { background: var(--rd-sys-color-chip-filter-default); }
.rad-chip--filter .rad-chip__icon { color: var(--rd-sys-color-chip-filter-icon); }
.rad-chip--date { background: var(--rd-sys-color-chip-date-default); }
.rad-chip--date .rad-chip__icon { color: var(--rd-sys-color-chip-date-icon); }
.rad-chip--input { background: var(--rd-sys-color-chip-input-pressed); }
.rad-chip--error { background: var(--rd-sys-color-chip-error-default); }

button.rad-chip--attribute:hover { background: var(--rd-sys-color-chip-attribute-hover); }
button.rad-chip--measure:hover { background: var(--rd-sys-color-chip-measure-hover); }
button.rad-chip--filter:hover { background: var(--rd-sys-color-chip-filter-hover); }
button.rad-chip--date:hover { background: var(--rd-sys-color-chip-date-hover); }

/* ----- src/radiant/components/Chip/TriggerChip.css ----- */
/**
 * Radiant — Trigger chip. From the Figma "Chip / Trigger" set.
 *   Pill (radius 16), 28px tall, padding 4px 12px, gap 8px, trailing chevron.
 *   Attribute = blue, Measure = green, Filter = gray, Cross filter = white+blue border.
 *   States: default → hover → pressed (darker fills); disabled = 40%.
 *   Optional circular delete badge overlaps the top-right (appears on hover).
 */
.rad-trigger {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-b); /* 8px */
  box-sizing: border-box;
  height: 28px;
  padding: 4px var(--rd-sys-spacing-c); /* 4px 12px */
  border: none;
  border-radius: var(--rd-sys-radius-16);
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-body-size);
  line-height: var(--rd-sys-type-body-line);
  color: var(--rd-sys-color-content-primary);
  white-space: nowrap;
  cursor: pointer;
  transition: background-color 100ms ease;
}
.rad-trigger__label b { font-weight: var(--rd-sys-font-weight-medium); }
.rad-trigger__chev { display: inline-flex; color: var(--rd-sys-color-content-primary); flex: none; }

/* ---- kinds ---- */
.rad-trigger--attribute { background: var(--rd-sys-color-chip-attribute-default); }
.rad-trigger--attribute:hover { background: var(--rd-sys-color-chip-attribute-hover); }
.rad-trigger--attribute.is-active { background: var(--rd-sys-color-chip-attribute-pressed); }
.rad-trigger--measure { background: var(--rd-sys-color-chip-measure-default); }
.rad-trigger--measure:hover { background: var(--rd-sys-color-chip-measure-hover); }
.rad-trigger--measure.is-active { background: var(--rd-sys-color-chip-measure-pressed); }
.rad-trigger--filter { background: var(--rd-sys-color-chip-filter-default); }
.rad-trigger--filter:hover { background: var(--rd-sys-color-chip-filter-hover); }
.rad-trigger--filter.is-active { background: var(--rd-sys-color-chip-filter-pressed); }
/* Cross filter — white with a brand border */
.rad-trigger--crossfilter {
  background: var(--rd-sys-color-bg-base);
  box-shadow: inset 0 0 0 1px var(--rd-sys-color-border-brand);
  color: var(--rd-sys-color-content-primary);
}
.rad-trigger--crossfilter:hover { background: var(--rd-sys-color-bg-ghost-highlight); }

.rad-trigger:disabled,
.rad-trigger.is-disabled { opacity: 0.4; cursor: not-allowed; }

/* ---- delete badge ---- */
.rad-trigger__delete {
  position: absolute;
  top: -5px;
  right: -5px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 16px;
  height: 16px;
  border: none;
  border-radius: 50%;
  background: var(--rd-sys-color-content-secondary);
  color: var(--rd-sys-color-content-inverse);
  cursor: pointer;
  opacity: 0;
  transition: opacity 100ms ease;
}
.rad-trigger:hover .rad-trigger__delete,
.rad-trigger__delete:focus-visible { opacity: 1; }

/* ---- skeleton / loading ---- */
.rad-trigger--skeleton {
  background: transparent;
  border: 1px dashed var(--rd-sys-color-border-bold);
  color: var(--rd-sys-color-content-secondary);
  cursor: default;
  padding: 5px var(--rd-sys-spacing-d);
}

/* ----- src/radiant/components/Banner/Banner.css ----- */
/** Radiant — Banner. Padding 14px 16px, radius 6, gap 12; dark filled status glyph. */
.rad-banner {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c); /* 12px */
  box-sizing: border-box;
  padding: 14px var(--rd-sys-spacing-d);
  border-radius: var(--rd-sys-radius-6);
}
.rad-banner--warning { background: var(--rd-sys-color-bg-warning); }
.rad-banner--info { background: var(--rd-sys-color-bg-brand-subtle, var(--rd-sys-color-bg-ghost-highlight)); }
.rad-banner--success { background: var(--rd-sys-color-bg-success-subtle, var(--rd-sys-color-chip-measure-default)); }
.rad-banner--failure { background: var(--rd-sys-color-bg-failure-subtle, var(--rd-sys-color-chip-error-default)); }
.rad-banner--muted { background: var(--rd-sys-color-bg-secondary-action); }

.rad-banner__icon {
  display: inline-flex;
  flex: none;
  align-self: center; /* centred with the text */
}
/* Status glyph is tinted by status (white mark inside). */
.rad-banner--warning .rad-banner__icon { color: var(--rd-sys-color-content-warning); }
.rad-banner--failure .rad-banner__icon { color: var(--rd-sys-color-content-failure); }
.rad-banner--success .rad-banner__icon { color: var(--rd-sys-color-content-success); }
.rad-banner--info .rad-banner__icon { color: var(--rd-sys-color-content-brand); }
.rad-banner__body { flex: 1 1 auto; color: var(--rd-sys-color-content-primary); }
.rad-banner .rad-iconbtn { flex: none; align-self: center; }
/* The dismiss is drawn in Content/Primary, not the ghost button's muted
   secondary -- it reads at the weight of the message it closes. */
.rad-banner .rad-iconbtn--ghost { color: var(--rd-sys-color-content-primary); }
.rad-banner .rad-iconbtn--ghost:active,
.rad-banner .rad-iconbtn--ghost[data-force-state='activated'] { color: var(--rd-sys-color-content-brand); }

/* ----- src/radiant/components/ExplainerCard/ExplainerCard.css ----- */
/**
 * Radiant — Explainer card (Figma "Explainer card" 18310:23047).
 *
 *   Card      — 340px fixed, padding 20 (E), gap 12 (C), radius 6, bg Raised,
 *               Elevation/Menu.
 *   Titled    — column: [title · dismiss] / body / media / actions.
 *   Compact   — row: [body · dismiss]. No title, media or actions; this is the
 *               hover form, so it usually has no dismiss either.
 *   Media     — Gray/10A, radius 6, full content width. Empty it holds the
 *               spec's 170px placeholder; with content it sizes to it.
 *   Actions   — right-aligned, gap 16 (D); small Tertiary + small Primary.
 */
.rad-explainer {
  box-sizing: border-box;
  display: flex;
  gap: var(--rd-sys-spacing-c); /* 12px */
  align-items: flex-start;
  width: 340px;
  min-width: 340px;
  max-width: 340px;
  padding: var(--rd-sys-spacing-e); /* 20px */
  background: var(--rd-sys-color-bg-raised);
  border-radius: var(--rd-sys-radius-6);
  box-shadow: var(--rd-sys-elevation-menu);
}
.rad-explainer--titled { flex-direction: column; }

/* Title row — the title takes the width the dismiss button leaves. */
.rad-explainer__head {
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-c);
  width: 100%;
}
.rad-explainer__title {
  flex: 1 1 0;
  min-width: 0;
  color: var(--rd-sys-color-content-primary);
}

.rad-explainer__body { color: var(--rd-sys-color-content-primary); }
.rad-explainer--titled .rad-explainer__body { width: 100%; }
/* Compact: body beside the dismiss — 264px at the spec's 340 card. */
.rad-explainer--compact .rad-explainer__body { flex: 1 1 auto; min-width: 0; }
/* Opt-in line cap (maxLines); -webkit-line-clamp is the cross-browser spelling. */
.rad-explainer__body[data-clamp] {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.rad-explainer__media {
  width: 100%;
  box-sizing: border-box;
  background: var(--rad-gray-10a); /* Figma Color/Gray/10A — no semantic alias for it */
  border-radius: var(--rd-sys-radius-6);
  overflow: hidden;
}
.rad-explainer__media:empty { height: 170px; } /* the spec's placeholder block */

.rad-explainer__actions {
  display: flex;
  align-items: flex-start;
  justify-content: flex-end;
  gap: var(--rd-sys-spacing-d); /* 16px */
  width: 100%;
}

/* The dismiss never shrinks; in the compact form it sits against the first body line. */
.rad-explainer > .rad-iconbtn,
.rad-explainer__head .rad-iconbtn { flex: none; }
/* Drawn in Content/Primary, not the ghost button's muted secondary — the spec
   gives the card's dismiss the same weight as its title. Activate still goes brand. */
.rad-explainer .rad-iconbtn--ghost { color: var(--rd-sys-color-content-primary); }
.rad-explainer .rad-iconbtn--ghost:active,
.rad-explainer .rad-iconbtn--ghost[data-force-state='activated'] { color: var(--rd-sys-color-content-brand); }

/* ----- src/radiant/components/Tooltip/Tooltip.css ----- */
/** Radiant — Tooltip (Figma 246:11127): dark inverse bubble, white caption text. */
.rad-tooltip-trigger {
  display: inline-flex;
  align-items: center;
}
.rad-tooltip {
  position: fixed;
  z-index: 1000;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--rd-sys-spacing-b); /* 8px */
  max-width: 280px;
  padding: var(--rd-sys-spacing-b) var(--rd-sys-spacing-c); /* 8px 12px */
  border-radius: var(--rd-sys-radius-6);
  background: var(--rd-sys-color-bg-inverse); /* #323946 */
  color: var(--rd-sys-color-content-inverse); /* #FFFFFF */
  box-shadow: var(--rd-sys-elevation-menu, 0px 12px 24px 0px rgba(25, 35, 49, 0.12), 0px 0px 4px 0px rgba(25, 35, 49, 0.08));
  font-family: var(--rd-sys-font-family);
  font-size: var(--rd-sys-type-caption-size); /* 12px */
  line-height: var(--rd-sys-type-caption-line); /* 18px */
  letter-spacing: var(--rd-sys-type-caption-tracking);
  font-weight: var(--rd-sys-font-weight-regular);
  pointer-events: none;
  /* Short labels stay on one line (they fit under max-width); long labels wrap. */
  white-space: normal;
}

/* ----- src/radiant/components/Spinner/Spinner.css ----- */
/** Radiant — Contextual spinner. A 3/4 arc that rotates. */
.rad-spinner {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex: none;
  animation: rad-spin 0.7s linear infinite;
}
.rad-spinner svg { display: block; }
.rad-spinner--blue { color: var(--rd-sys-color-content-brand); }   /* #2770EF */
.rad-spinner--gray { color: var(--rd-sys-color-border-bold); }     /* #C0C6CF */
.rad-spinner--white { color: #ffffff; }

@keyframes rad-spin {
  to { transform: rotate(360deg); }
}

/* ----- src/radiant/components/PageLoader/PageLoader.css ----- */
/** Radiant — Global / Page loader. Three gray dots pulsing in a staggered wave. */
.rad-pageloader {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: var(--rd-sys-spacing-l, 32px); /* 32px dots → caption (Copy=True) */
}
.rad-pageloader__dots {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.rad-pageloader__dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--rd-sys-color-border-bold); /* #C0C6CF */
  animation: rad-pageloader-dot 1.2s ease-in-out infinite;
}
.rad-pageloader__dot:nth-child(2) { animation-delay: 0.15s; }
.rad-pageloader__dot:nth-child(3) { animation-delay: 0.3s; }

.rad-pageloader__msg {
  margin: 0;
  max-width: 256px;
  text-align: center;
  color: var(--rd-sys-color-content-secondary);
}

@keyframes rad-pageloader-dot {
  0%, 100% { transform: scale(1); }
  40% { transform: scale(0.34); } /* down to ~4px, matching the smallest Figma dot */
}

/* ----- src/radiant/components/ProgressBar/ProgressBar.css ----- */
/** Radiant — Progress bar. Track EAEDF2, fill 2770EF, 8px, radius 8. */
.rad-progress {
  width: 100%;
  height: 8px;
  border-radius: var(--rd-sys-radius-8);
  background: var(--rd-sys-color-border-subtle);
  overflow: hidden;
}
.rad-progress__fill {
  display: block;
  height: 100%;
  border-radius: var(--rd-sys-radius-8);
  background: var(--rd-sys-color-bg-brand);
  transition: width 200ms ease;
}

/* ----- src/radiant/components/Breadcrumb/Breadcrumb.css ----- */
/** Radiant — Breadcrumb (20401:11320). Back arrow (in a subtle circle) + parent title. */
.rad-breadcrumb {
  display: inline-flex;
  align-items: center;
  gap: var(--rd-sys-spacing-b); /* 8px */
  height: 24px;
  padding: 0;
  border: none;
  background: transparent;
  color: var(--rd-sys-color-content-secondary);
  cursor: pointer;
  font-family: var(--rd-sys-font-family);
}
.rad-breadcrumb__back {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--rd-sys-color-bg-secondary-action);
  color: var(--rd-sys-color-content-primary);
  flex: none;
  transition: background 100ms ease;
}
.rad-breadcrumb:hover .rad-breadcrumb__back { background: var(--rd-sys-color-chip-filter-hover); }
.rad-breadcrumb__label { color: var(--rd-sys-color-content-secondary); }
.rad-breadcrumb:hover .rad-breadcrumb__label { color: var(--rd-sys-color-content-primary); }

/* ===== the prototype's own layer, on top of the system ===== */
*{box-sizing:border-box}
/* Overscroll is radiant/reset.css's: `contain` on everything so an inner list never
   bounces the page behind it, `none` only on the page root. The library's own note
   is explicit that `none` on a NESTED scroller trips a Chromium wheel-latch freeze,
   so the model list's local `none` went with it. */
/* A scrollbar must never change the width of the content beside it: every scroll
   container reserves the gutter whether or not it is currently scrollable, so a
   list that shortens under a filter does not re-flow everything inside it. */
/* An overlay scrollbar -- macOS's default -- hides until you touch it and reserves
   no width, so a list that scrolls gives no sign of it. Returning these two
   properties to their initial values hands the rendering back to the
   ::-webkit-scrollbar rules in radiant/reset.css above: a real 8px bar with the
   library's rounded Content/Tertiary thumb, always there. The stable gutter is what
   keeps it out of the content's width -- the room is reserved whether or not the
   list is scrollable, so nothing re-flows when it becomes one. */
#connList,#modelList,#historyList,#runList,.pane,.rail,.pbody,
.pane > .inner,.ctxpop #orgList,.dd .menu .mbody{
  scrollbar-width:auto;scrollbar-color:auto;scrollbar-gutter:stable}
/* A scrolling list should not end on a hard edge: whichever side has more content
   behind it fades out, and only that side -- a list scrolled to the top has nothing
   above it to soften. */
.softscroll{--mt:0px;--mb:0px;
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt),
    #000 calc(100% - var(--mb)),transparent 100%);
  mask-image:linear-gradient(to bottom,transparent 0,#000 var(--mt),
    #000 calc(100% - var(--mb)),transparent 100%);
  transition:--mt .2s linear,--mb .2s linear}
/* shallow enough to soften the cut without dimming the row at the edge */
.softscroll.mtop{--mt:10px}
.softscroll.mbot{--mb:12px}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
/* Body/Normal is the system's default text: 14/20 in the Geist stack the tokens
   name, rather than the 15px the prototype used before it had a scale. */
body{
  background:var(--page); color:var(--text);
  font-family:var(--rd-sys-font-family);
  font-size:var(--rd-sys-type-body-size);
  line-height:var(--rd-sys-type-body-line);
  letter-spacing:var(--rd-sys-type-body-tracking);
  font-weight:var(--rd-sys-font-weight-regular);
  -webkit-font-smoothing:antialiased;
}
/* Caption, set in the mono face. Radiant has no mono type ramp, so the size and
   line come from Caption and only the family and figures are the prototype's. */
.mono{font-family:var(--rd-sys-font-family-mono);
  font-size:var(--rd-sys-type-caption-size);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.dim{color:var(--text-dim)}
.acc{color:var(--accent)}
.err{color:var(--error)}
.lbl{font-family:var(--rd-sys-font-family-mono);font-size:var(--rd-sys-type-caption-size);letter-spacing:.06em;text-transform:uppercase;color:var(--text-dim);transition:color .12s}
::selection{background:var(--rd-sys-color-bg-ghost-highlight)}
/* Scrollbars come from radiant/reset.css above: 8px track, rounded Content/Tertiary
   thumb. The prototype's own 10px inset-border thumb is gone with it. */

button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none}
a{color:inherit}

/* ---------- primitives ---------- */
/* Buttons and text links are Radiant's -- see .rad-btn / .rad-link above, and a
   disabled primary is the component's own: muted to the secondary fill. */

/* Checkbox, Radio and Toggle are Radiant's. The rows they sit in are the
   prototype's, so all that is left here is the row's own hover reaching the
   control -- the component covers every state the control owns itself. */
.row:hover .rad-check__box,.tname:hover .rad-check__box,
.met:hover .rad-check__box{border-color:var(--rd-sys-color-border-bold-hover)}
.row:hover .rad-radio__ring{border-color:var(--rd-sys-color-border-bold-hover)}
.rad-check__input:checked + .rad-check__box,
.row:hover .rad-check__input:checked + .rad-check__box,
.tname:hover .rad-check__input:checked + .rad-check__box,
.rad-check__input:indeterminate + .rad-check__box,
.tname:hover .rad-check__input:indeterminate + .rad-check__box{
  border-color:var(--rd-sys-color-border-brand)}
.rad-radio__input:checked + .rad-radio__ring,
.row:hover .rad-radio__input:checked + .rad-radio__ring{
  border-color:var(--rd-sys-color-border-brand)}
/* the rows are the click target, so the control never takes the caret itself */
.rad-check__input,.rad-radio__input{pointer-events:none}

/* Radiant's ListItem supplies the row -- its height, its padding, its 12px gap and
   its hover. What the page adds is that the hover bleeds into the gutter either
   side, so a row's name still starts on the content column's own left edge, and
   that the bleed has a corner. */
.row{margin:0 calc(-1 * var(--rd-sys-spacing-d));border-radius:var(--rd-sys-radius-6)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* the matched run of characters, marked in place rather than recoloured wholesale */
mark{background:color-mix(in srgb,var(--rd-sys-color-content-brand) 24%,transparent);color:inherit;border-radius:var(--rd-sys-radius-4);padding:0 1px;margin:0 -1px}
.row .meta{flex:0 0 auto;display:grid;gap:var(--s2);align-items:center}
#connList .row .meta{grid-template-columns:76px 72px}
/* the counts are numbers: right-aligned so their digits line up down the column */
#connList .row .meta > :last-child{text-align:right}
#modelList .row .meta{grid-template-columns:124px;text-align:right}
.hrow .meta{flex:0 0 auto;display:grid;gap:var(--s2);align-items:center;grid-template-columns:104px 78px 96px 200px}

/* ---------- screens ---------- */
.screen{display:none}
/* the page itself never scrolls: the app is a viewport-tall column and only the
   list inside a view is scrollable, so titles, fields and bars stay put */
#app.on{display:flex;flex-direction:column;height:100%;position:relative}
#app > .hdr{flex:0 0 auto}
#viewScope,#viewHistory{flex:1;min-height:0;flex-direction:column}
/* width:100% is load-bearing — `margin:0 auto` on a flex item suppresses the
   default cross-axis stretch, so without it the column shrink-wraps its content. */
#viewScope > .wrap,#viewHistory > .wrap{flex:1;min-height:0;display:flex;flex-direction:column;
  width:100%;box-sizing:border-box;padding-bottom:0}
#stConn,#stModel{flex:1;min-height:0;flex-direction:column}
/* the history sits below the list and keeps its own height, so the list gives up the
   space rather than the block being pushed under the bar */
/* the models step ends on a block rather than a list running under the bar, so the
   stage keeps the bar's own height clear and the list gives up that space */
/* twelve models at a time, then the list scrolls; the step itself scrolls to reach
   the upload under it, so the list keeps its height instead of being squeezed */
/* the step itself never scrolls: the list is the only scroller, up to twelve models
   at a time, and the upload keeps a fixed height under it */
/* nothing stands on the bottom edge any more, so the step keeps only its own
   breathing room under the upload block */
#stModel{overflow:hidden;
  padding-bottom:var(--s4);
  /* the lists inside bleed their hover surface into the gutter either side, and the
     step clips its overflow -- so it carries that room on both sides rather than
     cutting the fill off at the content column's right edge */
  padding-left:48px;padding-right:48px;margin-left:-48px;margin-right:-48px}
#stModel #modelHead{flex:0 0 auto}
/* The list takes the height its models need and no more: `flex:0 1 auto` grows to
   the content, so a short list does not hold a half-empty box open, and shrinks to
   whatever the step has left once the content would overrun it -- at which point it
   is filling the available height and scrolls inside itself. No fixed row cap: the
   window decides how many fit, which on a normal one is about a dozen. */
/* two rows is as far as it gives: below that the step has run out of window and
   there is nothing useful left to show either section */
#stModel #modelList{flex:0 1 auto;min-height:64px;padding-bottom:2px}
/* The upload block follows the list rather than being pinned under the step: with a
   few models it rides up to sit beneath them, and it comes down as the list grows
   until the list is full and scrolling, which is as low as it goes. */
.qh{flex:0 0 auto;display:flex;flex-direction:column;margin-top:var(--s4)}
.qh .pghd{flex:0 0 auto}
/* a target, not a button: the whole strip takes a drop */
.qdrop{flex:0 0 auto;height:132px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:26px 20px;cursor:pointer;text-align:center;
  border:1px dashed var(--hairline-hover);border-radius:var(--rd-sys-radius-12);background:var(--panel);
  transition:border-color .14s}
/* Pointing at the target only darkens its glyph -- the block itself holds still.
   A file actually dragged over it is a different matter, and takes the accent. */
.qdrop.over{border-color:var(--accent)}
.qdrop .qtxt{font-size:var(--rd-sys-type-body-large-size);
  line-height:var(--rd-sys-type-body-large-line);color:var(--text)}
.qdrop .qsub{font-size:var(--rd-sys-type-caption-size)}
.qdrop .qic{margin-bottom:2px}
.qic{flex:0 0 auto;display:flex;color:var(--icon-dim)}
.qdrop:hover .qic,.qdrop.over .qic{color:var(--text)}
.qic.done{color:var(--rd-sys-color-content-success)}
/* and once it is in, what came in */
/* the same height as the target it replaces, so nothing below it moves */
.qrow{display:flex;align-items:center;gap:var(--s2);padding:18px;height:132px;
  box-sizing:border-box;
  border:1px solid var(--hairline);border-radius:var(--rd-sys-radius-12);background:var(--panel)}
/* What came in, read top-down: the file first, then what is in it, then what has
   been done with it. A tick marks each fact that is settled, and sits on the same
   left edge as the line above it, so the column starts in one place. */
.qrow .qtext{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.qrow .qdone{display:flex;align-items:center;gap:6px}
.qrow .qtick{flex:0 0 auto;display:flex;color:var(--rd-sys-color-content-success)}
.qrow .qname{font-size:var(--rd-sys-type-h5-size);line-height:var(--rd-sys-type-h5-line);
  letter-spacing:var(--rd-sys-type-h5-tracking);font-weight:var(--rd-sys-font-weight-medium);
  color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .mono{font-size:var(--rd-sys-type-caption-size)}
.qrow .rad-link{flex:0 0 auto}
.qbusy{display:none;align-items:center;justify-content:center;gap:10px;padding:18px;
  height:132px;box-sizing:border-box;
  border:1px solid var(--hairline);border-radius:var(--rd-sys-radius-12);background:var(--panel)}
.qbusy.on{display:flex}
.qbusy .mono{font-size:var(--rd-sys-type-body-size)}
/* the wait, with a line under it: name and percentage over a filling bar */
.qup{display:flex;flex-direction:column;align-items:center;gap:10px}
.qup .qline{display:flex;align-items:center;gap:10px}
.qup .mono{font-size:var(--rd-sys-type-body-size)}
/* Radiant's ProgressBar; how wide it is is the upload block's. */
.qbar{width:260px}
#connList,#modelList,#historyList{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  margin:0 calc(-1 * var(--rd-sys-spacing-d));padding:0 var(--rd-sys-spacing-d) 120px}
.screen.on{display:block}
@keyframes twk{0%,100%{opacity:var(--o)}50%{opacity:calc(var(--o) * .4)}}
@keyframes csOn{to{fill:var(--accent);r:2.6}}
@keyframes csHalo{0%{opacity:0;r:2.4}16%{opacity:.42;r:7.5}42%,100%{opacity:0;r:11.5}}
@keyframes cnGrow{to{stroke-dasharray:1 1;stroke-dashoffset:0}}
@keyframes bubOpen{to{opacity:1;transform:scale(1)}}
/* The wait for a cluster stands in for the button that started it: the same accent
   loader the runs use, sized for a row rather than for a page. */
.cbusy{display:none;align-items:center;gap:10px}
.cbusy.on{display:inline-flex}
.cbusy .shimmer{letter-spacing:.03em}


/* header */
/* the switcher lives in the header, centred on the page rather than on the space
   left over beside the cluster pill */
.hdr{
  height:56px;display:flex;align-items:center;justify-content:flex-end;
  padding:0 var(--s3);border-bottom:1px solid var(--hairline);
  position:sticky;top:0;background:var(--page);z-index:30;
}
.hdr > .seg{position:absolute;left:50%;transform:translateX(-50%)}
/* The page's progress rides the top bar's bottom edge, the full width of the page
   rather than the content column. Radiant's wizard footer bar straightened out:
   4px, a 6px gap at the middle, 2px ends, border-subtle waiting and bg-brand done.
   The run's band shares the rail -- it has no progress to report, so instead of
   filling it stretches out of one end and gathers into the other. */
.hprog{position:absolute;left:0;right:0;bottom:-2px;height:4px;
  pointer-events:none;display:none;overflow:hidden}
.hprog.on{display:block}
.hseg,.hsnake{position:absolute;top:0;height:4px;border-radius:2px}
.hseg{background:var(--rd-sys-color-border-subtle);transition:background .3s ease}
.hseg.is-filled{background:var(--rd-sys-color-bg-brand)}
#hSegA{left:0;width:calc(50% - 3px)}
#hSegB{right:0;width:calc(50% - 3px)}
/* laid out full-width and driven only by transform, so the band's two ends can
   move in turn without either being animated on a layout property */
.hsnake{left:0;right:0;display:none;transform-origin:left center;
  background:var(--rd-sys-color-bg-brand)}
.hprog.run .hsnake{display:block}
.hprog.run .hseg{display:none}
/* the mark holds the left end of the bar; the switcher is centred on the page, so
   the mark takes the space rather than pushing anything */
.brand{display:flex;align-items:center;margin-right:auto;color:var(--text)}
.brand svg{display:block}
/* The cluster is context, not a control: Radiant's read-only Chip, set in the mono
   face every other identifier in the portal uses. */
.ctxwrap{position:relative}
/* The organisation card is a Radiant Menu hung off the trigger chip that names the
   organisation. Where it opens and how wide it is are the page's. */
.ctxpop{position:absolute;left:0;top:calc(100% + 6px);width:340px;z-index:40;display:none}
.ctxpop.open{display:flex}
.ctxpop .orgblk{display:flex;flex-direction:column;min-height:0}
/* flush to both edges -- the field's own underline is the divider, and the menu
   clips it to its rounded corners */
.ctxpop .rad-menu__search .rad-field{width:100%}
.ctxpop #orgList{max-height:238px;scrollbar-gutter:stable}
.orow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Radiant's TriggerChip, sitting in the caption: the organisation is a value in the
   sentence, and the sentence is where you change it. The chip anchors the menu, so
   the caption that holds it is the positioned box. */
.orgpick{position:relative;display:inline-flex;vertical-align:baseline;margin:0 2px}
/* Radiant's Select is a form control sized to its column; here it stands in a
   sentence, so the one thing overridden is that width. The open state is the
   Field's own active border, reached through the class the picker already sets. */
.orgpick .rad-select__trigger{width:auto;cursor:pointer;text-align:left}
.orgpick .rad-select__trigger.is-active{border-color:var(--rd-sys-color-border-brand)}
.orgpick .pchev{display:inline-flex;transition:transform .2s cubic-bezier(.32,.72,0,1)}
.orgpick .rad-select__trigger.is-active .pchev{transform:rotate(180deg)}
/* view switcher, now in page content */
/* The view switcher is Radiant's SegmentedControl; only where it sits is ours.
   An inactive segment reads back a step, so the active one is the one that says
   where you are. */
.rad-segmented__item:not(.is-active){color:var(--rd-sys-color-content-secondary)}

/* scope */
.wrap{max-width:760px;margin:0 auto;padding:var(--s3) var(--s3) 140px}
.sechd{display:flex;align-items:center;justify-content:space-between;margin:0 0 var(--s3)}
/* each step is titled: the one large piece of type on the page, so the eye lands
   before it reaches the controls */
.pghd{display:flex;align-items:flex-end;justify-content:space-between;
  flex-wrap:wrap;gap:var(--s1) var(--s3);margin:0 0 var(--s3)}
.pgtitle{font-size:var(--rd-sys-type-h1-size);line-height:var(--rd-sys-type-h1-line);
  letter-spacing:var(--rd-sys-type-h1-tracking);font-weight:var(--rd-sys-font-weight-medium);
  color:var(--text);margin:0}
/* margin, not just justify-content: when the header wraps, space-between puts the
   wrapped slot at the start of its line, which is what pulled the CTA off the
   content's right edge */
.pghd .right{display:flex;align-items:center;gap:var(--s2);padding-bottom:3px;
  white-space:nowrap;flex:0 0 auto;margin-left:auto}
.pgtitle{min-width:0;position:relative}
/* The caption sits beside the title rather than under it, so it costs the list no
   height and both scope steps keep the same rhythm whether or not they carry one.
   It hugs the title, leaving the header's right slot where it was. */
/* pulled back out of the header's 24px column gap: the caption belongs to the
   title, so it sits closer to it than the header's own right-hand controls do */
/* The caption continues the title's sentence, so it sits closer to it than the
   header's own column gap -- pulled back to a word space at the caption's size. */
/* The caption holds one line and keeps 48px clear of the step's actions -- 36px
   of its own plus the header's 12px column gap. The actions stay pinned right by
   their own auto margin, so the clearance is a floor, not a fixed distance.
   It is laid out as a flex line rather than as running text so the one part that
   can run long -- the org name -- is the part that gives when the line is short of
   room. The 4px gap stands in for the word spaces flex would otherwise collapse. */
.pgsub{display:flex;align-items:baseline;gap:4px;white-space:nowrap;
  margin:0 36px 0 calc(-1 * var(--s2));color:var(--text-dim);
  font-size:var(--rd-sys-type-body-size);flex:0 1 auto;min-width:0}
/* the pill takes what the line has left and ellipses, rather than pushing "org"
   into the clearance or breaking the header onto a second row */
.pgsub .orgpick{min-width:0;flex:0 1 auto}
.pgsub .rad-select__trigger{min-width:0;max-width:100%}
.pgsub .rad-select__value{overflow:hidden;text-overflow:ellipsis;min-width:0}
.pgsub .on{color:var(--text)}
/* the models tally is the caption's subject, not framing round it, so once it has
   something to count it reads at full strength -- an empty tally stays quiet */
#modelCount{color:var(--text-dim)}
#modelCount.strong{color:var(--text)}
/* One ground line through the whole header, whatever the size: the caption shares
   the title's baseline, and the chip in it shares the caption's -- an inline-flex
   takes its baseline from its first item, so the chip's own label sits on the line
   and the pill stands on it rather than floating beside it. */
.pghd{align-items:baseline}
/* The actions stand on the header's own ground line, the one the title, the
   caption and the pill in it all share -- so the CTA and the org pill read as
   sitting on the same floor rather than as two boxes centred on nothing. */
.pghd .right{align-self:baseline}
/* .sall is a clipping window holding an absolutely positioned child, so it has no
   in-flow text and a clipped box hands the header its bottom edge as a baseline
   instead. The window is 34px and the button's label sits 22px down inside it, so
   it is sunk by the 12px between the two and the CTA lands on the same line. */
.pghd .right .sall{top:12px}
.group{margin-top:var(--s4)}
/* the first group follows the global select-all row at the same distance the
   connections list does, so both steps start their list at the same rhythm */
.group:first-child{margin-top:0}
/* list headers carry no rule of their own — the vertical dividers between the
   controls are the only structure they need */
