const T0=performance.now();
const phase=(period,offset=0)=>-Math.round((performance.now()-T0+offset)%period);
/* Radiant's contextual Spinner: the same rotating arc the library ships, at the
   size the line it sits on needs. `cls` is still 'acc' or '' at the call sites, so
   it picks the component's blue or its gray. */
const SPIN_ARC='<path d="M2.6527e-06 9C1.18765e-06 4.02944 4.02944 0 9 0C9.55228 1.03081e-06 10 '
  +'0.447716 10 1C10 1.55228 9.55228 2 9 2C5.13401 2 2 5.13401 2 9C2 12.866 5.13401 16 9 16C12.866 '
  +'16 16 12.866 16 9C16 8.44772 16.4477 8 17 8C17.5523 8 18 8.44772 18 9C18 13.9706 13.9706 18 9 '
  +'18C4.02944 18 4.11774e-06 13.9706 2.6527e-06 9Z" fill="currentColor"/>';
const SPIN=(size=14,color='blue')=>`<span class="rad-spinner rad-spinner--${color}"
  style="width:${size}px;height:${size}px" role="status" aria-label="Loading"
  ><svg viewBox="0 0 18 18" width="${size}" height="${size}" fill="none" aria-hidden="true"
    >${SPIN_ARC}</svg></span>`;
const DOTS=()=>SPIN(14,'blue');
const SHIM=()=>`style="animation-delay:${phase(1900)}ms"`;
/* how long until the next boundary of a period, at least `min` from now: what an
   animation has to wait to come in on the same beat as everything already running */
function pulseWait(min,period=1900){
  const at=(performance.now()-T0)%period;
  let w=period-at;
  while(w<min)w+=period;
  return Math.round(w);
}
const escHTML=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
/* mark every occurrence of the query inside a piece of list content */
function hl(text,q){
  text=String(text);
  if(!q)return escHTML(text);
  const low=text.toLowerCase();
  let out='',i=0,at;
  while((at=low.indexOf(q,i))!==-1){
    out+=escHTML(text.slice(i,at))+'<mark>'+escHTML(text.slice(at,at+q.length))+'</mark>';
    i=at+q.length;
  }
  return out+escHTML(text.slice(i));
}
const connOf=id=>CONNS.find(c=>c.id===id);
/* search covers everything the row shows, not just its name */
/* while it is working the row shows what is happening and the buttons wait: the
   labels stay legible rather than being replaced by a loader */
function credBusy(id,msg,...btns){
  const el=$(id); if(!el)return;
  const on=!!msg;
  el.innerHTML=on?`${DOTS('acc')}<span class="mono acc shimmer" ${SHIM()}>${escHTML(msg)}</span>`:'';
  el.classList.toggle('on',on);
  /* the loader stands where the buttons stood: nothing to press while the cluster
     is being reached, so nothing is offered */
  btns.forEach(b=>{const n=$(b); if(n)n.style.display=on?'none':'';});
}
/* the connection card lives in one place and is relocated between the auth screen
   and the header popover, so there is only ever one instance of it */
/* The header says which cluster you are on and nothing else -- a read-only token,
   not a control. Which organisation you are reading is picked where the sentence
   names it, on the Connections step. */
const renderOrgPick=()=>{$('#orgPickLabel').textContent=orgName(st.org);};
$('#orgPick .pchev').innerHTML=RIC('chevron-down',16);
function orgMatches(){
  const q=st.orgQ;
  return ORGS.filter(o=>!q||o.n.toLowerCase().includes(q));
}
function renderOrgs(){
  const vis=orgMatches();
  const host=$('#orgList');
  if(!vis.length){host.innerHTML='<div class="notice mono dim">No organisation matches that search.</div>';return;}
  host.innerHTML=vis.map(o=>`<div class="rad-menu-item orow${o.id===st.org?' is-activated':''}" data-o="${o.id}">
      ${RADIO(o.id===st.org)}
      <span class="rad-menu-item__label nm">${hl(o.n,st.orgQ)}</span>
      ${o.id===st.org?'<span class="rad-menu-item__num mono dim">current</span>':''}
    </div>`).join('');
  $$('#orgList .orow').forEach(el=>el.onclick=()=>switchOrg(el.dataset.o));
  softEdges(host);
}
/* Another organisation is another set of connections, so the scope cannot carry
   over: the setup starts again on what the new organisation has. */
function switchOrg(id){
  if(id===st.org){closePop();return;}
  st.org=id;
  renderOrgPick();closePop();
  resetScope();
  loadThen('Loading organisation details',1300,()=>fade('#viewScope'));
}
$('#orgSearch').oninput=e=>{st.orgQ=e.target.value.trim().toLowerCase();renderOrgs();};
function closePop(){$('#ctxPop').classList.remove('open');$('#orgPick').classList.remove('is-active');}
$('#orgPick').onclick=e=>{
  e.stopPropagation();
  const open=$('#ctxPop').classList.toggle('open');
  $('#orgPick').classList.toggle('is-active',open);
  if(open){st.orgQ='';$('#orgSearch').value='';renderOrgs();rise('#ctxPop');}
};
$('#ctxPop').onclick=e=>e.stopPropagation();
document.addEventListener('click',closePop);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop();});

/* ============================== NAV ============================== */
/* The portal is the whole of it now: there is no cover and no credentials screen
   to come from, so `go` only ever lands on the app. */
function go(screen){
  $$('.screen').forEach(s=>s.classList.remove('on'));
  $('#'+screen).classList.add('on');
  if(screen==='app')paint();
}
$$('.seg button').forEach(b=>b.onclick=()=>{
  const to=b.dataset.tab;
  if(to===st.tab)return;                 // already there, and it keeps its place
  /* Each tab is left as it was found: a setup part-way through keeps what has been
     picked, and the logs keep the run being read -- coming back is coming back to
     where you were, not to the top. The breadcrumb is what leaves a run. */
  st.tab=to;
  $$('.seg button').forEach(x=>x.classList.toggle('is-active',x===b));
  /* Same arrival as the very first page after signing in: the page being left goes
     without ceremony and the new one simply fades up. */
  paint(); fade(visibleView());
});
function paint(){
  const setup=st.tab==='scope';
  const showRun=st.tab==='history'&&!!st.viewing;
  const busy=!!st.loading;
  $('#load').classList.toggle('on',busy);
  $('#viewScope').style.display=(!busy&&setup)?'flex':'none';
  $('#viewRun').style.display=(!busy&&showRun)?'flex':'none';
  $('#viewHistory').style.display=(!busy&&st.tab==='history'&&!st.viewing)?'flex':'none';
  syncRail();
  if(busy)return;
  softAll();
  if(setup){syncStage();renderConns();renderModels();qhSync();renderBar();}
  if(showRun){renderRail();renderPane();}
  if(st.tab==='history'&&!st.viewing)renderHistory();
  const past=st.viewing;
  $('#runCrumb').style.display=past?'flex':'none';
  if(past)$('#crumbCur').textContent=fmtWhen(past.ts);
  radSync();
}

/* ============================== SCOPE ============================== */
function connMatches(){
  const q=st.connQ;
  return orgConns(st.org).filter(c=>!q||c.n.toLowerCase().includes(q)||c.wh.toLowerCase().includes(q));
}
function renderConns(){
  const vis=connMatches();
  /* Where these came from: the list is one organisation's, and the way to another
     is the pill that names it. */
  // the organisation is the fact in the sentence, so it reads at full strength
  renderOrgPick();
  if(!vis.length){$('#connList').innerHTML='<div class="notice mono dim">No connection matches that search.</div>';return;}
  $('#connList').innerHTML=vis.map(c=>`
    <div class="rad-listitem row" data-k="c:${c.id}" data-c="${c.id}">
      ${RADIO(st.selC.has(c.id))}
      <span class="nm">${hl(c.n,st.connQ)}</span>
      <span class="meta">
        <span class="mono dim">${hl(c.wh,st.connQ)}</span>
        <span class="mono dim">${c.t} tables</span>
      </span>
    </div>`).join('');
  /* One run reads one connection: picking another replaces the first rather than
     adding to it, and the models chosen under the old one go with it. */
  $$('#connList .row').forEach(r=>r.onclick=()=>{
    const id=r.dataset.c;
    st.selC=st.selC.has(id)?new Set():new Set([id]);
    [...st.selM].forEach(m=>{if(!st.selC.has(model(m).c))st.selM.delete(m);});
    fpaint();
  });
}
function visibleModels(){
  const q=st.filter;
  return MODELS.filter(m=>{
    if(!st.selC.has(m.c))return false;
    if(!q)return true;
    // a connection that matches brings its whole set of models with it
    return m.n.toLowerCase().includes(q)||connOf(m.c).n.toLowerCase().includes(q);
  });
}
function syncStage(){
  const m=st.stage==='model';
  $('#stConn').style.display=m?'none':'flex';
  $('#stModel').style.display=m?'flex':'none';
}
function renderModels(){
  if(st.stage!=='model')return;
  const cs=CONNS.filter(c=>st.selC.has(c.id));
  const vis=visibleModels();
  $('#modelAll').textContent=(vis.length&&vis.every(m=>st.selM.has(m.id)))?'deselect all':'select all';
  collapseX('#modelAllWrap',!searching('model'));   // after the label: it is measured
  if(!vis.length){
    $('#modelHead').innerHTML='';
    $('#modelList').innerHTML='<div class="notice mono dim">No model matches that search.</div>';return;}
  /* One connection is scanned at a time, so its name sits above the list rather
     than inside it: it stays put without the list having to hold it there. */
  /* its own key: the group inside the list carries "g:", and two elements answering
     to one key is what made this one jump on every tick */
  $('#modelHead').innerHTML=cs.map(c=>`<div class="tname" data-k="mh:${c.id}"
      ><span class="lbl">${hl(c.n,st.filter)}</span></div>`).join('');
  $('#modelList').innerHTML=cs.map(c=>{
    const ms=vis.filter(m=>m.c===c.id); if(!ms.length)return '';
    return `<div class="group" data-k="g:${c.id}">
      ${ms.map(m=>`<div class="rad-listitem row" data-k="m:${m.id}" data-m="${m.id}">
        ${CHECK(st.selM.has(m.id)?'on':'')}
        <span class="nm">${hl(m.n,st.filter)}</span>
        <span class="meta">
          <span class="mono dim">${m.has?'has instructions':'no instructions'}</span>
        </span></div>`).join('')}
    </div>`;}).join('');
  $$('#modelList .row').forEach(r=>r.onclick=()=>{
    const id=r.dataset.m; st.selM.has(id)?st.selM.delete(id):st.selM.add(id); fpaint();
  });
}
$('#modelAll').onclick=()=>{
  const vis=visibleModels(), every=vis.length&&vis.every(m=>st.selM.has(m.id));
  vis.forEach(m=>every?st.selM.delete(m.id):st.selM.add(m.id));
  fpaint();
};
const SEARCHES={
  run:  {key:'runQ',   render:()=>flipRender(renderRail)},
  conn: {key:'connQ',  render:()=>flipRender(renderConns)},
  model:{key:'filter', render:()=>flipRender(renderModels)}
};
/* "searching" now means the query is actually narrowing the list — an empty but
   focused field leaves the bulk-select controls in place, because nothing is hidden
   from the user yet and there is still a whole list to act on. */
const searching=k=>!!(SEARCHES[k]&&st[SEARCHES[k].key]);

/* Clear is the SearchBar's own control: it keeps its slot so the field never
   changes width, and only its visibility follows whether there is anything to clear. */
function syncClear(k){
  const btn=$(`[data-clear="${k}"]`);
  if(btn)btn.classList.toggle('is-hidden',!searching(k));
}
/* A field signals focus the way Radiant's does -- the box's own border turns
   brand under :focus-within. The prototype's hand-driven rule is gone with it. */
Object.keys(SEARCHES).forEach(k=>{
  const s=SEARCHES[k], input=$('#'+k+'Search');
  input.oninput=e=>{st[s.key]=e.target.value.toLowerCase().trim();s.render();syncClear(k);};
  const clear=$(`[data-clear="${k}"]`);
  if(clear)clear.onmousedown=e=>e.preventDefault();   // keep focus, so the rule never blinks
  if(clear)clear.onclick=()=>{input.value='';st[s.key]='';s.render();syncClear(k);input.focus({preventScroll:true});};
  input.onkeydown=e=>{if(e.key==='Escape'&&clear)clear.click();};
});
/* ============================== QUERY HISTORY ============================== */
/* The file is taken at face value -- this is a prototype, so nothing is parsed: the
   count is derived from its size so the same file always reports the same figure. */
const qhRows=f=>Math.max(120,Math.round(f.size/38));
function qhSync(){
  const has=!!st.qh,up=!!st.up;
  $('#qDrop').style.display=(has||up)?'none':'flex';
  $('#qRow').style.display=(has&&!up)?'flex':'none';
  if(has){
    $('#qName').textContent=st.qh.name;
    $('#qMeta').textContent=`${nf(st.qh.rows)} queries · ${st.qh.size}`;
    /* When it came in, on its own line. A file carried over from the last run on
       this connection is stamped with the day it was uploaded then -- it is the same
       history until somebody replaces it. */
    $('#qWhen').textContent=st.qh.kept?`uploaded ${st.qh.kept}`:'';
    /* A file that has already been read against this connection says so: nothing
       about the history has changed, so the scan does not have to happen again. */
    $('#qScan').style.display=st.qh.scanned?'flex':'none';
    $$('#qRow .qtick').forEach(t=>{if(!t.firstChild)t.innerHTML=RIC('checkmark',12);});
  }
}
const qhSize=b=>b>=1048576?`${(b/1048576).toFixed(1)} MB`:`${Math.max(1,Math.round(b/1024))} KB`;
/* These files run to hundreds of megabytes, so the upload is a wait, not a beat:
   it reports its own progress, and the run waits for it. */
/* the prototype's own "now", shared by a run's stamp and a fresh upload's */
const NOW='18 Aug 2026, 10:24';
const upMs=f=>Math.max(3000,Math.min(12000,1400+f.size/24000));
let UPT=null;
function upStop(){ if(UPT){clearInterval(UPT);UPT=null;} st.up=null; }
function upPaint(){
  const busy=$('#qBusy');
  if(!st.up){busy.classList.remove('on');busy.innerHTML='';return;}
  busy.innerHTML=`<span class="qup"><span class="qline"><span class="mono acc"
    >uploading ${escHTML(st.up.name)}</span><span class="mono dim">${st.up.pct}%</span></span>
    <span class="rad-progress qbar"><span class="rad-progress__fill"
      style="width:${st.up.pct}%"></span></span></span>`;
  busy.classList.add('on');
}
function qhTake(file){
  if(!file)return;
  upStop(); st.qh=null;
  st.up={name:file.name,pct:0};
  qhSync();upPaint();renderBar();
  const dur=upMs(file),t0=performance.now();
  UPT=setInterval(()=>{
    if(!st.up){clearInterval(UPT);UPT=null;return;}
    st.up.pct=Math.min(100,Math.round((performance.now()-t0)/dur*100));
    if(st.up.pct<100){upPaint();renderBar();return;}
    upStop();
    st.qh={name:file.name,size:qhSize(file.size),rows:qhRows(file),kept:fmtWhen(NOW)};
    /* Kept against the connection: the next run on it starts from this file rather
       than from an empty target, since nothing else has changed about the history. */
    st.selC.forEach(cid=>{st.qhBy[cid]={...st.qh};});
    upPaint();qhSync();renderBar();
  },90);
}
$('#qFile').onchange=e=>{qhTake(e.target.files&&e.target.files[0]);e.target.value='';};
$('#qSwap').onclick=e=>{e.preventDefault();e.stopPropagation();$('#qFile').click();};
$('#qClear').onclick=e=>{
  e.preventDefault();e.stopPropagation();
  upStop();st.qh=null;
  st.selC.forEach(cid=>{delete st.qhBy[cid];});   // and it is not offered again
  qhSync();renderBar();
};
['dragenter','dragover'].forEach(ev=>$('#qDrop').addEventListener(ev,e=>{
  e.preventDefault();$('#qDrop').classList.add('over');}));
['dragleave','drop'].forEach(ev=>$('#qDrop').addEventListener(ev,e=>{
  e.preventDefault();$('#qDrop').classList.remove('over');}));
$('#qDrop').addEventListener('drop',e=>{
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  qhTake(f);
});

$('#stModel .ctaback').onclick=()=>{st.stage='conn';st.filter='';$('#modelSearch').value='';syncClear('model');fpaint();enter('#stConn',-1);};

/* Two segments on the header rail: the first step fills the left half, the second
   the right, with the 6px gap between them. Straight lines need no measuring --
   the widths are the rail's own halves, so there is nothing to repaint on resize. */
function paintHeadProg(){
  const prog=$('#hProg'), a=$('#hSegA'), b=$('#hSegB');
  if(!prog||!a||!b)return;
  a.classList.add('is-filled');
  b.classList.toggle('is-filled',st.stage==='model');
}

/* What the step still needs before its CTA can do anything. Returns null once the
   step is ready, otherwise the sentence to put in front of the user. */
function stepBlocker(){
  if(st.stage==='conn')
    return st.selC.size?null:'Select a connection to carry on.';
  /* The run needs both, so an empty step is told both at once rather than sending
     the user back for the second one after they have dealt with the first. A file
     already going up is its own case: there is nothing left to do about it but
     wait, so saying "upload a CSV" would be telling the user to redo what they
     have just done. */
  const noModels=!st.selM.size, uploading=!!st.up, noCsv=!st.qh;
  if(noModels&&uploading)
    return 'Select at least one model, and wait for the query history to finish uploading.';
  if(uploading)return 'The query history is still uploading — the run can start once it is in.';
  if(noModels&&noCsv)
    return 'Select at least one model, and upload a query history CSV to run.';
  if(noModels)return 'Select at least one model to run.';
  if(noCsv)return 'Upload a query history CSV to run.';
  return null;
}
/* The CTA stays live either way: pressing it early is how you find out what is
   missing, rather than being left with a dead button and no reason. */
function warnStep(msg){
  const w=$('#stepWarn');
  if(!msg){w.style.display='none';return;}
  $('#stepWarnMsg').textContent=msg;
  w.style.display='flex';
  rise('#stepWarn');
}
const clearWarn=()=>{$('#stepWarn').style.display='none';};

/* The step's actions live in its own page header, beside the title, so the setup
   steps carry nothing standing on the bottom edge. Each step owns its slot; this
   only has to find the one on screen. */
function renderBar(){
  const onModels=st.stage==='model';
  const step=$(onModels?'#stModel':'#stConn');
  const btn=step.querySelector('.ctanext');
  /* the Run CTA carries a leading glyph, so its wording goes in the label rather
     than replacing everything inside the button */
  const say=t=>{btn.querySelector('.rad-btn__label').textContent=t;};
  paintHeadProg();
  if(!stepBlocker())clearWarn();                 // the moment it is satisfied, it goes
  if(st.stage==='conn'){
    say('Next');btn.disabled=false;
    btn.onclick=()=>{
      const why=stepBlocker(); if(why)return warnStep(why);
      clearWarn();
      /* The history is a property of the connection, not of the run: stepping into
         the models for one picks up the CSV it was last given. */
      const cid=[...st.selC][0];
      /* Replaced, not filled in: what is carried into the models step is this
         connection's history and nothing else. Leaving the last one's in place is
         how a CSV uploaded for one connection turned up under another. */
      st.qh=cid&&st.qhBy[cid]?{...st.qhBy[cid]}:null;
      st.stage='model';window.scrollTo(0,0);fpaint();enter('#stModel',1);};
  }else{
    /* the step's caption carries the tally, in the slot the connection step gives
       to its organisation */
    const tot=MODELS.filter(m=>st.selC.has(m.c)).length;
    $('#modelCount').textContent=`${st.selM.size}/${tot} selected`;
    $('#modelCount').classList.toggle('strong',st.selM.size>0);
    /* One CTA, whatever the upload is doing: the run cannot start before the
       history is in, and pressing Run while it is still going up says so rather
       than taking the request and holding it. */
    say('Run');btn.disabled=false;
    btn.onclick=()=>{
      const why=stepBlocker(); if(why)return warnStep(why);
      clearWarn();startRun();
    };
  }
}

/* ============================== RUN ============================== */
const TIMERS=new Set();
/* A timer belongs to the run that set it, so starting a new run can leave the old
   one's work alone -- while changing the cluster can still stop all of it. */
function runTimer(r,fn,ms){
  const t=setTimeout(()=>{
    TIMERS.delete(t); if(r)r.timers.delete(t);
    fn();
  },ms);
  TIMERS.add(t); if(r)r.timers.add(t);
  return t;
}
const liveRuns=()=>st.live;
/* everything this run had in flight, dropped: it is not going to finish */
function stopRun(r){
  if(!r||!r.timers)return;
  r.timers.forEach(t=>{clearTimeout(t);TIMERS.delete(t);});
  r.timers.clear();
}
const runById=id=>liveRuns().find(r=>r.id===id)||null;
/* A run only draws when it is the one being looked at: the others are working out
   of sight, and redrawing for them would rebuild a list they are not in. */
const onScreen=r=>!!r&&r===st.viewing&&st.tab==='history'&&!st.loading;
/* nothing reading, nothing left to generate */
const isSettled=r=>!!r&&!r.conns.some(c=>c.state==='wait'||c.state==='reading')
                      &&!r.models.some(m=>m.state==='queued'||m.state==='gen');
const redraw=r=>{ if(onScreen(r)){flipRender(renderRail); if(PANE_NAV)PANE_NAV();} };
let RUN_SEQ=103;
function newRun(){
  // every run starts with its bar to say, however the run was built
  BAR_OUT=false;
  const bar=$('#runBar'); if(bar)bar.classList.remove('out');
  return {id:'r-'+(RUN_SEQ++),ts:NOW,win:st.win,timers:new Set(),
    conns:[...st.selC].map(id=>({id,total:conn(id).t,read:0,state:'wait'})),
    models:MODELS.filter(m=>st.selC.has(m.c)).map(m=>({id:m.id,
      state:st.selM.has(m.id)?'queued':'skipped',text:null,orig:null,applied:false})),
    state:'running'};
}
function startRun(){
  armAudio();armNotify();
  /* The run's first act is to read the history, so from here on this connection's
     kept file carries that: a later run on it need not scan again. */
  st.selC.forEach(cid=>{if(st.qhBy[cid])st.qhBy[cid].scanned=true;});
  if(st.qh)st.qh.scanned=true;
  const r=newRun();
  st.live.push(r);
  /* A started run is a log entry from that moment on: read where every other run is
     read, breadcrumb and all, while the tab that set it up goes back to being an
     empty setup page. */
  st.viewing=r;st.sel=null;
  st.tab='history';
  $$('.seg button').forEach(x=>x.classList.toggle('is-active',x.dataset.tab==='history'));
  resetSelections({keepTab:true});
  paint();enter(RUNBODY,1);
  // every connection starts reading at once and finishes at its own pace, so the
  // list resolves progressively rather than one connection at a time
  r.conns.forEach((c,i)=>readConn(r,c,i));
  renderRail();          // the first paint ran before any connection was marked reading
}
function readConn(r,c,i){
  c.state='reading';c.read=0;
  const dur=5200+i*1700+(c.total%6)*450;      // staggered, derived not random
  // nothing about a reading row changes until it finishes, so there is no tick to
  // render — re-rendering mid-read is what made the loaders stutter
  runTimer(r,()=>{
    c.read=c.total;
    c.state='done';
    c.doneAt=performance.now();
    startModelsFor(r,c.id);
    // one render for the whole landing: the connection finishing and its models
    // starting are the same moment, and two renders would cancel each other's slide
    if(!settle(r))redraw(r);
  },dur);
}
/* Every selected model under a connection starts generating the moment that
   connection has been read, and each finishes at its own pace. */
function beginModel(r,m,i=0){
  m.state='gen';

  runTimer(r,()=>{
    finishModel(m);
    /* Whether it opens itself decides whether it is ever marked unread: marking it
       and clearing it in the same beat put the dot in and took it straight back
       out, and the name slid both ways for nothing. */
    const asked=m.openWhenDone; m.openWhenDone=false;
    const opened=asked?openModel(r,m,{soft:true}):autoOpenFirst(r,m);
    if(!opened&&m.state==='done'&&(m.mets||[]).length)markFresh(r,m.id);
    // the loader goes, the dot takes its place and the name slides between them --
    // one render, so the slide runs its course

/* Opening the panel for the first time re-widths the whole list -- the rail gives up
   its space to the panel. Sliding the names at the same time means animating them
   inside a box that is itself resizing, which is what made the dot's departure
   judder. So: FLIP the names only when the panel is already open and the geometry
   is holding still. */
function drawSel(fn){
  if($('#viewRun').classList.contains('open'))flipRender(fn); else fn();
}
/* Stepping through models walks past whatever the list is scrolled to, so the row
   being read is brought into view -- only when it is actually outside it, and only
   as far as it has to travel. */
function revealSel(){
  const list=$('#runList'), row=st.sel&&$(`#runList .row[data-m="${st.sel}"]`);
  if(!list||!row)return;
  const l=list.getBoundingClientRect(), r=row.getBoundingClientRect();
  const pad=12;
  let d=0;
  if(r.top<l.top+pad)d=r.top-(l.top+pad);
  else if(r.bottom>l.bottom-pad)d=r.bottom-(l.bottom-pad);
  if(!d)return;
  const to=Math.max(0,Math.min(list.scrollHeight-list.clientHeight,list.scrollTop+d));
  if(REDUCED.matches){list.scrollTop=to;return;}
  list.scrollTo({top:to,behavior:'smooth'});
  // a throttled timeline can drop a smooth scroll altogether; make sure it lands
  setTimeout(()=>{if(Math.abs(list.scrollTop-to)>1)list.scrollTop=to;},420);
}
/* Which run a model's freshness belongs to: the same model can be unread in one run
   and read in another. */
const fkey=(rid,mid)=>rid+':'+mid;
/* The topmost model with instructions, in the order the list actually shows them --
   grouped by connection, as the panel's own arrows walk them. Which model finished
   first stops meaning anything once a run is being read back: what is at the top of
   the list is what belongs open. */
const firstWithMets=r=>{
  if(!r)return null;
  for(const c of r.conns){
    const m=r.models.find(x=>model(x.id).c===c.id&&x.state==='done'&&(x.mets||[]).length);
    if(m)return m;
  }
  return null;
};
/* A model the user went and asked for instructions on, whose instructions they have not read
   yet -- earliest in the list if there are several. Asking for one is a deliberate
   act, and coming back to the run is coming back for it, so it takes precedence
   over whatever sits at the top of the list. Instructions that arrived as part of a run
   are not this: nobody singled them out. */
function firstAsked(r){
  if(!r)return null;
  for(const c of r.conns){
    const m=r.models.find(x=>model(x.id).c===c.id&&x.state==='done'&&(x.mets||[]).length
      &&st.askedM.has(fkey(r.id,x.id))&&st.freshM.has(fkey(r.id,x.id)));
    if(m)return m;
  }
  return null;
}
/* Arriving at a run's results -- opened from the logs, or returned to on the New
   run tab. Whatever there is to read, the first of it is open: a page of names with
   an empty panel beside it is not the result. A panel already open is left alone,
   so coming back does not lose the model being read. */
/* `asked` says whether a single model that was asked for may take precedence. It
   may not while the run's own completion is still the news: a run landing is read
   from the top, and only once that has been seen does a model asked for on its own
   become the thing to come back to. */
function openOnArrival(r,asked){
  if(!r||st.sel)return false;
  return openModel(r,(asked&&firstAsked(r))||firstWithMets(r),{soft:true});
}
const curRun=()=>st.viewing;
const isFresh=mid=>{const r=curRun();return !!r&&st.freshM.has(fkey(r.id,mid));};
const markFresh=(r,mid)=>{if(r)st.freshM.add(fkey(r.id,mid));};
const clearFresh=(r,mid)=>{if(r)st.freshM.delete(fkey(r.id,mid));};
/* Opening a model's panel, the same way clicking its row does. `soft` means the
   panel opened on its own rather than by a click: it never takes over a panel the
   user already has open on another model. */
function openModel(r,m,opts={}){
  if(!m||m.state!=='done'||!(m.mets||[]).length)return false;
  // a run working out of sight does not reach in and open a panel on the page the
  // user has moved on to
  if(opts.soft&&!onScreen(r))return false;
  if(opts.soft&&st.sel)return false;       // already reading something
  clearFresh(r,m.id);                      // its panel has been open: it is read
  st.sel=m.id;
  drawSel(()=>{renderRail();renderPane();});
  $('#viewRun').classList.add('open');
  revealSel();                             // it may be below the fold
  enter('#pane',1);

}
/* The first model to land opens itself, so the run shows its result without a
   click. Once only, and only that first one: if the user closes the panel while
   the rest are still generating, it stays closed. */
function autoOpenFirst(r,m){
  if(!r||r.autoOpened||!onScreen(r))return false;
  if(m.state!=='done'||!(m.mets||[]).length)return false;
  r.autoOpened=true;
  return openModel(r,m,{soft:true});
}
function startModelsFor(r,connId){
  if(!r)return;
  r.models.filter(m=>m.state==='queued'&&model(m.id).c===connId).forEach((m,i)=>beginModel(r,m,i));
}
/* The run's own indicator, on the same header rail the wizard's steps use. It has
   no progress to report and it never slides: its two ends move in turn. First the
   head runs out from the start with the tail held, then the head waits at the far
   end while the tail catches up. Both meet at each end of the lap, so there is no
   seam at the wrap. Its phase comes off the wall clock, so a re-render on each
   completion does not restart it mid-lap. */
const LAP=1900;
/* The rail is on while a run is being set up and while one is working, and off
   otherwise. One derived rule rather than each caller poking the class, so a band
   that stops cannot leave the rail lit on a page that has no progress to show. */
function syncRail(){
  const prog=$('#hProg'); if(!prog)return;
  prog.classList.toggle('on',!st.loading&&(st.tab==='scope'||prog.classList.contains('run')));
}
/* The band itself, on whichever rail it is handed: the page's while a run works,
   the panel's while a model is being written. Phase comes off the wall clock, so
   two rails running at once stay in step and a re-render never restarts one. */
function bandStart(line){
  if(!line||REDUCED.matches||line.getAnimations().length)return;
  const E='cubic-bezier(.65,.05,.36,1)';
  const a=line.animate([
    {transform:'translateX(0) scaleX(0)',easing:E},
    {transform:'translateX(0) scaleX(1)',easing:E,offset:.5},
    {transform:'translateX(100%) scaleX(0)'}
  ],{duration:LAP,iterations:Infinity});
  a.currentTime=(performance.now()-T0)%LAP;       // pick up mid-lap, not from zero
}
const bandStop=line=>{if(line)line.getAnimations().forEach(a=>a.cancel());};
function paintSnake(){
  const prog=$('#hProg'); if(!prog)return;
  prog.classList.add('run'); syncRail();
  bandStart($('#hSnake'));
}
/* The panel is writing: its own rail runs on its top edge -- for the one model
   being written into, since a model opened while another is still writing has
   nothing in flight of its own -- and the instructions and the bulk-select stand
   down, because there is nothing to change about them until it lands. `inert`
   rather than pointer-events alone: it takes the keyboard out too, so a caret
   already sitting in an instruction cannot keep typing into it. */
function paneWriting(on){
  const prog=$('#pProg'), p=$('#pane');
  if(prog){
    prog.classList.toggle('on',!!on);
    on?bandStart($('#pSnake')):bandStop($('#pSnake'));
  }
  if(!p)return;
  p.classList.toggle('writing',!!on);
  [p.querySelector('.mlist'),p.querySelector('#mAllWrap')].forEach(el=>{
    if(el)on?el.setAttribute('inert',''):el.removeAttribute('inert');
  });
}
/* What the model got, and when. It holds until it is closed -- the same rule the
   run's own banner follows. */
function paintPaneNote(m){
  const el=$('#paneNote'); if(!el)return;
  const show=!!(m&&m.addedN&&!m.addedOff);
  el.classList.toggle('on',show);
  if(show)$('#paneNoteMsg').textContent=
    `${m.addedN} instruction${m.addedN===1?'':'s'} added to model on ${m.addedAt}`;

/* the run has stopped: the band comes off the rail and the steps have it back */
function stopSnake(){
  const prog=$('#hProg');
  bandStop($('#hSnake'));
  if(prog)prog.classList.remove('run');
  syncRail();
}
/* the run is finished once nothing is reading and nothing is left to generate */
/* Reports whether it redrew, so the completion that triggered it does not draw the
   same list a second time: a second render cancels the slide the first one started,
   which is what made the name jump instead of travelling. */
function settle(r){
  if(!r)return false;
  const reading=r.conns.some(c=>c.state==='wait'||c.state==='reading');
  const pending=r.models.some(m=>m.state==='queued'||m.state==='gen');
  if(reading||pending)return false;
  const first=!r.everSettled; r.everSettled=true;
  r.state=r.conns.some(c=>c.state==='partial')||r.models.some(m=>m.state==='failed')?'partial':'done';
  /* Whatever it just produced -- a run finishing, or one more model generated
     inside a run that had already finished -- is news only if the user was not
     there to watch it land. */
  if(onScreen(r))st.doneSeen.add(r.id); else st.newRuns.add(r.id);
  /* A stored run only needed its live copy while there was work in it. */
  if(r!==st.viewing&&st.runs.some(x=>x.id===r.id)){
    const i=st.live.indexOf(r); if(i>=0)st.live.splice(i,1);
  }
  if(onScreen(r)){flipRender(renderRail);renderPane();}
  else if(st.tab==='history'&&!st.viewing)renderLogs();
  // one model generated inside a finished run has its own row to say so
  if(!first)return true;
  chime();                       // a run can take minutes; say so out loud
  markTitleDone();
  notifyDone(r);
  return true;
}

/* ---- telling someone who has looked away ---------------------------------- */
/* A run takes minutes and the page asks to be left open, so the tab has to be able
   to speak for itself: two soft notes, and the tab's own title carries the state. */
let AC=null;
/* Asked for on the click that starts a run -- the moment it is obvious why the page
   would want to interrupt you -- and only ever asked once. */
function armNotify(){
  try{
    if(!('Notification' in window))return;
    if(Notification.permission==='default')Notification.requestPermission();
  }catch(e){}
}
function notifyDone(r){
  try{
    if(!('Notification' in window)||Notification.permission!=='granted')return;
    if(!document.hidden)return;              // they are looking at it already
    const mets=r.models.filter(m=>m.state==='done').length;
    const n=new Notification('Run complete',{
      body:mets?`${mets} model${mets>1?'s':''} have instructions ready.`
               :'Query history scanned.',
      tag:'run-'+r.id});
    n.onclick=()=>{window.focus();n.close();};
  }catch(e){}
}
function armAudio(){                     // called from the click that starts a run,
  try{                                   // which is the gesture that unlocks audio
    AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended')AC.resume();
  }catch(e){AC=null;}
}
function chime(){
  if(!AC||REDUCED.matches)return;
  try{
    const now=AC.currentTime;
    [[880,0],[1318.5,.16]].forEach(([hz,at])=>{
      const o=AC.createOscillator(), g=AC.createGain();
      o.type='sine';o.frequency.value=hz;
      g.gain.setValueAtTime(0,now+at);
      g.gain.linearRampToValueAtTime(.09,now+at+.02);
      g.gain.exponentialRampToValueAtTime(.0001,now+at+.42);
      o.connect(g).connect(AC.destination);
      o.start(now+at);o.stop(now+at+.45);
    });
  }catch(e){}
}
const BASE_TITLE=document.title;
function setTitleProgress(pct){
  document.title=pct>=100?BASE_TITLE:`${pct}% · ${BASE_TITLE}`;
}
function markTitleDone(){
  if(!document.hidden){document.title=BASE_TITLE;return;}
  document.title='✓ Run complete · '+BASE_TITLE;
}
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&document.title.startsWith('✓'))document.title=BASE_TITLE;
});
function finishModel(m){
  if(m.id==='sandbox'){m.state='nosignal';return;}
  const b=blockFor(m.id);
  m.orig=b.i.join('\n\n');m.text=m.orig;m.state='done';
  // each suggestion is its own record from here on: the user keeps, drops, rates
  // and regenerates them one at a time
  m.mets=b.i.map((t,i)=>({text:t,orig:t,on:true,vote:0,note:'',
    title:(b.s[i]||{}).t||'',

function completeRun(run,opts={}){
  // failure states are out of scope for now: every read and every generation lands
  run.conns.forEach(c=>{c.read=c.total;c.state='done';});
  run.models.forEach(m=>{if(m.state!=='skipped')finishModel(m);});
  run.state='done';
  run.everSettled=true;          // it has already landed, however it was built

/* a finished connection says nothing: the models under it are the result */
const ST={
  wait:()=>'',
  reading:c=>`<span class="mono acc shimmer" ${SHIM()}>scanning query history</span>`,
  /* and once it is over it says so, in the same place the progress was */
  reuse:c=>'<span class="mono dim">query scan done</span>',
  done:c=>'<span class="mono dim">query scan done</span>',
  partial:c=>'<span class="mono dim">query scan done</span>'
};
const MST={
  queued:()=>'',
  gen:()=>`<span class="mono acc shimmer" ${SHIM()}>generating</span>`,
  done:m=>`<span class="mono open">${(m.mets||blockFor(m.id).i).length} instructions<span class="car">${RIC('chevron-right',14)}</span></span>`,
  nosignal:()=>'<span class="mono dim">no signal</span>',
  failed:()=>'<span class="mono err">failed</span>'
};

/* The window reads better as the actual period than as a count of days. Dates only:
   the hour a history read happened to start is not something anyone acts on. */
const MONTHS_FULL=['January','February','March','April','May','June','July',
  'August','September','October','November','December'];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function parseTs(ts){
  const m=/^(\d+)\s+(\w+)\s+(\d+),\s*(\d+):(\d+)$/.exec(ts||'');
  if(!m)return null;
  return new Date(+m[3],MONTHS.indexOf(m[2]),+m[1],+m[4],+m[5]);
}
const fmtD=d=>`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
/* stamps are stored on a 24-hour clock and read back on a 12-hour one */
function fmtWhen(ts){
  const d=parseTs(ts); if(!d)return ts;
  const ap=d.getHours()<12?'am':'pm', h=d.getHours()%12||12;
  return `${fmtD(d)}, ${h}:${String(d.getMinutes()).padStart(2,'0')} ${ap}`;
}
function windowLabel(r){
  const to=parseTs(r.ts);
  if(!to)return `${r.win} days`;
  const from=new Date(to.getTime()-r.win*864e5);
  return `${fmtD(from)} – ${fmtD(to)}`;
}
function runModels(){
  const r=st.viewing; if(!r)return[];
  const q=st.runQ;
  return r.models.filter(m=>{
    if(!q)return true;
    return model(m.id).n.toLowerCase().includes(q)||connOf(model(m.id).c).n.toLowerCase().includes(q);
  });
}
/* the run reuses the model page's list: same groups, same rhythm, minus every

/* A run holds the models it was asked about, and nothing is generated after the

let RAIL_RUN=null;
const RAIL_SEEN=new Map();
function renderRail(){

  /* Once the run has nothing left in flight, the page's own next step is another
     run -- offered here rather than at the foot of a list that can be long. */

      <div class="tname${cdone?' ready':''}${canToggle?' can-toggle':''}" data-k="rc:${c.id}" data-toggle="${canToggle?c.id:''}">
        ${reading?DOTS():''}
        <span class="lbl${cdone?' hastip':''}"
          data-k="cl:${c.id}" ${cdone?`data-c="${c.id}"`:''}>${hl(connOf(c.id).n,q)}</span>
        ${canToggle?`<span class="chev">${RIC('chevron-right',15)}</span>`:''}
        <span class="leader"></span>
        ${ST[c.state](c)?`<span class="gcount mono dim" data-sk="c:${c.id}" data-sv="${c.state}"

  // toggled on the live node rather than re-rendered, so the reveal can animate

function rowsOf(list,c,reading,q){

        const gen=m.state==='gen', queued=m.state==='queued';

        const fresh=m.state==='done'&&isFresh(m.id);
        const cl=['rad-listitem','row']; if(ready)cl.push('ready'); if(st.sel===m.id)cl.push('sel');

        // waiting on its connection: says so on hover rather than sitting there blank

        const row=`<div class="${cl.join(' ')}" data-k="rm:${m.id}" data-m="${m.id}">

            data-nd="${m.id}"${fresh?` style="animation-delay:${phase(1900)}ms"`:''}></span>`}</span>
          <span class="nm" data-k="nm:${m.id}">${hl(model(m.id).n,q)}</span>
          <span class="grow"></span>
          <span class="meta" data-sk="m:${m.id}" data-sv="${m.state}">${
