/* Which rows were carrying a lit dot last time round, so one that has just been
   lit can fade up and join the shared beat rather than snapping on. */
const DOT_ON=new Set();
function syncDots(){
  const now=new Set();
  $$('#runList .row.fresh').forEach(el=>now.add(el.dataset.m));
  now.forEach(id=>{
    if(DOT_ON.has(id))return;
    const d=$(`#runList [data-nd="${id}"]`); if(!d)return;
    /* The fade runs first and the pulse waits its turn -- overlapping them would
       have two animations fighting over the same opacity. It waits for the next
       boundary of the shared beat rather than starting straight after the fade, so
       a dot that arrives late still breathes with the ones already there. */
    d.style.animationDelay=`0ms,${pulseWait(260)}ms`;
    d.classList.add('in');
  });
  /* Nothing to do on the way out any more: the dot stays where it is and only
     loses its colour, so the name it sits beside never moves. */
  DOT_ON.clear(); now.forEach(id=>DOT_ON.add(id));
}
function wireRail(){
  const r=st.viewing;
  syncDots();
  /* The list is rebuilt whenever anything lands, so a mount animation would replay
     on every row each time. Only the ones whose state actually moved are played. */
  const seen=RAIL_SEEN;
  $$('#runList [data-sk]').forEach(el=>{
    const k=el.dataset.sk, v=el.dataset.sv;
    if(seen.get(k)!==v){seen.set(k,v);el.classList.add('statein');}
  });
  $$('#runList .row.ready').forEach(el=>el.onclick=()=>{
    const id=el.dataset.m;
    clearFresh(curRun(),id);                   // reading it is reading it
    if(id===st.sel){renderRail();return;}      // already showing
    /* Picking a model from the list travels the same way stepping does: forward if
       it sits below the one on screen, back if above. */
    const nav=navList();
    const from=nav.findIndex(x=>x.id===st.sel), to=nav.findIndex(x=>x.id===id);
    const dir=(from<0||to<0||to>from)?1:-1;
    st.sel=id; drawSel(()=>{renderRail();renderPane();});
    $('#viewRun').classList.add('open');
    enter('#pane',dir);
  });
  $$('#runList .hastip').forEach(el=>{
    const c=r.conns.find(x=>x.id===el.dataset.c); if(!c)return;
    el.onmouseenter=()=>tipShow(el,connTip(c,r));
    el.onmouseleave=tipHide;
  });
}

/* ============================== LOG FILTERS ==============================
   Three questions asked of the same list: when, which connection, which model.
   Several answers to one question widen it (any of them will do); answers to
   different questions narrow each other (a run has to satisfy all of them).
   Nothing here throws away a choice the user made: a model that falls outside the
   selected connections is kept and shown as out of range rather than deleted. */
/* a run holds objects while it is live and ids once it is stored */
const shapedRun=r=>typeof r.models[0]==='object';
const runConnIds=r=>shapedRun(r)?r.conns.map(c=>c.id):r.conns;
/* Every model the run was about, whether or not anything came of it: a run that
   scanned a model and found nothing is exactly what someone comes here to find. */
const runModelIds=r=>shapedRun(r)
  ? r.models.filter(m=>m.state!=='skipped').map(m=>m.id)   // in scope, whatever came of it
  : (r.sc||r.models).filter(id=>id!=='sandbox');
/* and the narrower set the card's own figure counts */
const runMetIds=r=>shapedRun(r)?r.models.filter(m=>m.state==='done').map(m=>m.id)
                              :r.models.filter(id=>id!=='sandbox');
const anyFilter=()=>!st.fAll||st.time.kind!=='all';
const appliedFilter=()=>FSNAP?(!FSNAP.all||st.time.kind!=='all'):anyFilter();
/* everything the logs list, live runs and stored ones, each counted once */
function logRows(){
  const rows=[];
  liveRuns().forEach(r=>rows.push({r,live:r.state==='running'}));
  st.runs.forEach(r=>{ if(!rows.some(x=>x.r.id===r.id))rows.push({r,live:false}); });
  return rows;
}
const dayNum=d=>d?new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime():0;
const DAY=864e5;
/* When: relative spans for the common case, two dates for the precise one. The
   grouping of the cards is read off the answer instead of being a second question. */
const TIMES=[{k:'d7',l:'Last 7 days',d:7},{k:'d30',l:'Last 30 days',d:30},
             {k:'m3',l:'Last 3 months',d:91},{k:'m12',l:'Last 12 months',d:365},
             {k:'all',l:'All time',d:0}];
const dOnly=s=>s?dayNum(new Date(s+'T00:00:00')):0;
function inRange(r){
  const t=st.time;
  if(t.kind==='all')return true;
  const d=parseTs(r.ts); if(!d)return false;
  const n=dayNum(d);
  if(t.kind==='custom'){
    if(!t.from&&!t.to)return true;
    if(t.from&&n<dOnly(t.from))return false;
    if(t.to&&n>dOnly(t.to))return false;
    return true;
  }
  const p=TIMES.find(x=>x.k===t.kind);
  return !p||!p.d?true:n>=dayNum(new Date())-(p.d-1)*DAY;
}
const timeLabel=()=>{
  const t=st.time;
  if(t.kind==='custom'){
    if(!t.from&&!t.to)return 'Custom range';
    return `${t.from?fmtD(new Date(t.from+'T00:00:00')):'any'} – ${t.to?fmtD(new Date(t.to+'T00:00:00')):'any'}`;
  }
  return (TIMES.find(x=>x.k===t.kind)||TIMES[4]).l;
};
/* A whole connection stands for every run that scanned it, models or none -- that
   is what someone means by "runs involving Billing_Core". Once part of a connection
   is let go, the question has become a narrower one, so only the models still picked
   speak for it. */
function matchFilters(r){
  if(!inRange(r))return false;
  if(st.fAll)return true;
  if(runConnIds(r).some(id=>connSel(id)==='all'))return true;
  return runModelIds(r).some(id=>st.fModel.has(id));
}
/* the models the logs know about, under the connection they belong to */
const logModelsOf=c=>allLogModels().filter(m=>m.c===c);
/* all of it, some of it, or none: a connection with nothing under it is simply
   picked or not */
function connSel(id){
  if(st.fAll)return 'all';           // at rest, everything is in
  const ms=logModelsOf(id);
  /* a connection with no models of its own is simply picked or not; one with models
     is read off them alone, so letting the last model go empties the box rather than
     leaving it half full */
  if(!ms.length)return st.fConn.has(id)?'all':'none';
  const on=ms.filter(m=>st.fModel.has(m.id)).length;
  return !on?'none':(on===ms.length?'all':'some');
}
/* Everything picked is the state the filter rests in, so it is recognised rather
   than stored: the moment it is true again the tree stops narrowing anything. */
function fSyncAll(){
  if(st.fAll)return;                 // the resting state is not re-derived, only left
  const cs=filterConns();
  st.fAll=cs.length>0&&cs.every(c=>connSel(c.id)==='all');
}
/* the first touch turns the resting state into a real selection to subtract from */
function fMaterialise(){
  if(!st.fAll)return;
  st.fConn=new Set(filterConns().map(c=>c.id));
  st.fModel=new Set(allLogModels().map(m=>m.id));
  st.fAll=false;
}
/* the filter tree's connection setter -- named apart from the credentials one, which
   a plain `setConn` was quietly shadowing */
function fSetConn(id,on){
  const ms=logModelsOf(id);
  if(on){st.fConn.add(id);ms.forEach(m=>st.fModel.add(m.id));}
  else{st.fConn.delete(id);ms.forEach(m=>st.fModel.delete(m.id));}
}
function setModel(id,on){
  const m=model(id); if(!m)return;
  on?st.fModel.add(id):st.fModel.delete(id);
}
function setAll(on){
  if(on){st.fConn=new Set(filterConns().map(c=>c.id));st.fModel=new Set(allLogModels().map(x=>x.id));}
  else{st.fConn.clear();st.fModel.clear();}
}
/* the runs the period alone leaves: what the two menus count their picks against,
   so a pick that would empty the list says so before it is made */
const timeRows=()=>logRows().filter(x=>inRange(x.r));
function filterCounts(){
  const c=new Map(), m=new Map(), mets=new Set();
  timeRows().forEach(x=>{
    runConnIds(x.r).forEach(id=>c.set(id,(c.get(id)||0)+1));
    runModelIds(x.r).forEach(id=>m.set(id,(m.get(id)||0)+1));
    runMetIds(x.r).forEach(id=>mets.add(id));
  });
  return {c,m,mets};
}
const runsMeta=n=>n?`${n} run${n>1?'s':''}`:'no runs';
/* Most-used first: browsing is what a menu is for, and search is what names are
   for. Alphabetical only helps someone who already knows what they want. */
const byCount=(cnt,name)=>(a,b)=>(cnt.get(b.id)||0)-(cnt.get(a.id)||0)||name(a).localeCompare(name(b));
/* the connections and models the logs contain -- filtering by something no run ever
   touched is a dead end, so it is never offered */
function filterConns(cnt){
  const seen=new Set();
  logRows().forEach(x=>runConnIds(x.r).forEach(id=>seen.add(id)));
  const cs=[...seen].map(conn).filter(Boolean);
  return cnt?cs.sort(byCount(cnt,c=>c.n)):cs.sort((a,b)=>a.n.localeCompare(b.n));
}
function allLogModels(){
  const seen=new Set();
  logRows().forEach(x=>runModelIds(x.r).forEach(id=>seen.add(id)));
  return [...seen].map(model).filter(Boolean);
}
/* One list, connections with their models under them -- the same shape the models
   page uses when a run is being set up, so the thing being narrowed looks like the
   thing that was chosen. */
function scopeTree(cCnt,mCnt){
  return filterConns(cCnt).map(c=>({c,items:logModelsOf(c.id).sort(byCount(mCnt,m=>m.n))}));
}

/* ---- the row itself ---------------------------------------------------------- */
/* A menu that several things are picked out of stays open while they are, and the
   list is fetched once the menu is done with -- not once per tick. */
let FDIRTY=false;
function syncTime(){
  const t=st.time;
  $('#timeLabel').textContent=timeLabel();
  $('#ddTime').classList.toggle('set',t.kind!=='all');
  $('#ddTime .tpres').innerHTML=TIMES.map(x=>
    `<button type="button" data-t="${x.k}" class="rad-menu-item${t.kind===x.k?' is-activated':''}"
      ><span class="rad-menu-item__label">${x.l}</span></button>`).join('');
  $('#tCustom').classList.toggle('is-activated',t.kind==='custom');
  const f=$('#rFrom'), o=$('#rTo');
  if(f&&document.activeElement!==f)f.value=t.from||'';
  if(o&&document.activeElement!==o)o.value=t.to||'';
  markEmpty();
}
const markEmpty=()=>['#rFrom','#rTo'].forEach(id=>{
  const el=$(id); if(el)el.classList.toggle('empty',!el.value);
});
function syncFilterBar(){
  const {c:cCnt,m:mCnt,mets}=filterCounts();
  syncTime();
  fSyncAll();

  const tree=scopeTree(cCnt,mCnt);
  const q=st.fQ.trim().toLowerCase();
  /* a search reaches both levels: a connection matches by its own name and keeps its
     models, and a model match keeps the connection it belongs to as its heading */
  const shown=tree.map(g=>{
    let items=g.items;
    if(q&&!g.c.n.toLowerCase().includes(q))items=items.filter(m=>m.n.toLowerCase().includes(q));
    /* `selected only` reads the picks, not the search: a connection with nothing in
       drops out of the list entirely */
    if(st.fOnly)items=items.filter(m=>st.fAll||st.fModel.has(m.id));
    return {c:g.c,items};
  }).filter(g=>{
    if(st.fOnly&&!g.items.length&&connSel(g.c.id)!=='all')return false;
    return g.items.length||!q||g.c.n.toLowerCase().includes(q);
  });

  /* Everything picked is the same as no question asked, so that is what the label
     says. Otherwise it names what is left: whole connections, and the models still
     standing inside the ones that were opened up. */
  const whole=tree.filter(g=>connSel(g.c.id)==='all');
  const partM=tree.filter(g=>connSel(g.c.id)==='some')
                  .flatMap(g=>g.items.filter(m=>st.fModel.has(m.id)));
  const nc=whole.length, nm=partM.length;
  const label=st.fAll?'All connections and models'
    :(!nc&&!nm)?'Nothing selected'
    :(nc===1&&!nm)?whole[0].c.n
    :(!nc&&nm===1)?partM[0].n
    :[nc?`${nc} connection${nc>1?'s':''}`:'',nm?`${nm} model${nm>1?'s':''}`:'']
       .filter(Boolean).join(' · ');
  $('#fsLabel').textContent=label;
  $('#ddScope').classList.toggle('set',!st.fAll);

  const mOn=id=>st.fAll||st.fModel.has(id);
  /* the bulk control says what it would do, as on the models page */
  const allOn=st.fAll;
  const nSel=tree.reduce((n,g)=>n+g.items.filter(m=>mOn(m.id)).length,0);
  const rowsHTML=shown.map(g=>{
    const state=connSel(g.c.id);
    const shut=!q&&st.fCol.has(g.c.id);      // a search stands its own matches open
    return `<div class="group${shut?' collapsed':''}">
      <div class="tname${g.items.length?' can-toggle':''}"${g.items.length?` data-tog="${escAttr(g.c.id)}"`:''}>
        ${CHECK(state==='all'?'on':(state==='some'?'part':''),`data-fc="${escAttr(g.c.id)}"`)}
        <span class="lbl">${hl(g.c.n,q)}</span>
        ${g.items.length?`<span class="chev">${RIC('chevron-right',15)}</span>`:''}
      </div>
      ${g.items.map(m=>`<div class="slot"><div class="sinner">
        <div class="rad-listitem row${mOn(m.id)?' on':''}" data-fm="${escAttr(m.id)}">
        ${CHECK(mOn(m.id)?'on':'')}
        <span class="nm">${hl(m.n,q)}</span>
      </div></div></div>`).join('')}
    </div>`;}).join('');
  /* The card is rebuilt whole on every pick, which throws away the scroller with
     it -- so the list would snap back to the top mid-scroll and read as the scroll
     having stopped. Its position is carried over. */
  const wasAt=($('#ddScope .mbody')||{}).scrollTop||0;
  $('#ddScope .menu').innerHTML=
    `<div class="msrow">
       <span class="rad-link rad-link--gray" data-all="${allOn?0:1}">${allOn?'deselect all':'select all'}</span>
       <span class="vr"></span>
       <div class="rad-field rad-searchbar msf">
         <div class="rad-field__box rad-field__box--underline">
           <span class="rad-field__icon" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>
           <input id="fsSearch" type="search" placeholder="Search" spellcheck="false" autocomplete="off" value="${escAttr(st.fQ)}">
           <button type="button" class="rad-searchbar__clear${st.fQ?'':' is-hidden'}" data-fclr="1"
             aria-label="Clear"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
         </div>
       </div>
     </div>`
    +(shown.length?`<div class="rad-menu__list rad-menu__list--scroll mbody mtree">${rowsHTML}</div>`
                  :`<div class="rad-menu__empty mnone">${st.fOnly&&!q?'Nothing is selected.'
                      :'No connection or model matches that search.'}</div>`)
    +`<div class="rad-menu__footer mfoot">
        ${TOGGLE(st.fOnly,'data-only="1" aria-label="Show selected only"')}
        <span class="mono dim">selected only</span>
        <button class="rad-btn rad-btn--basic rad-btn--primary" data-apply="1">Apply</button>
      </div>`;
  radSync($('#ddScope'));
  const body=$('#ddScope .mbody');
  if(body&&wasAt)body.scrollTop=wasAt;
  softEdges(body);

  /* A draft is not a filter yet: while the scope card holds unapplied picks, the way
     out reports what is actually narrowing the list -- the snapshot -- so it does not
     offer to clear something that has not happened. */
  $('#fClear').style.display=appliedFilter()?'':'none';
}
/* Changing a filter is a new question rather than a rearrangement of the answer to
   the old one, so the list is fetched again rather than shuffled in place. */
function applyFilters(){
  FDIRTY=false;
  $$('.frow .dd').forEach(x=>x.classList.remove('open'));
  loadThen('Filtering runs',700,()=>fade('#viewHistory'));
}
/* picks made inside an open menu are held until the menu is done with */
function commitFilters(){ FSNAP=null; if(FDIRTY)applyFilters(); }
/* What the scope card looked like when it was opened. With an Apply of its own, a
   selection is a draft until it is applied: leaving the card any other way puts back
   what was there, rather than quietly acting on half a thought. */
let FSNAP=null;
const fSnap=()=>({all:st.fAll,c:new Set(st.fConn),m:new Set(st.fModel),only:st.fOnly});
function fRestore(){
  if(!FSNAP)return;
  st.fAll=FSNAP.all;st.fConn=new Set(FSNAP.c);st.fModel=new Set(FSNAP.m);st.fOnly=FSNAP.only;
  FSNAP=null;FDIRTY=false;
  st.fQ='';
  if(st.tab==='history'&&!st.viewing)syncFilterBar();
}
function closeFilterMenus(){
  const open=$$('.frow .dd.open').length;
  $$('.frow .dd').forEach(x=>x.classList.remove('open'));
  if(!open)return;
  if(FSNAP)fRestore(); else commitFilters();
}
(function(){
  /* every menu is rebuilt with the list, so clicks are delegated to the menu box */
  const openOnly=d=>{
    const was=d.classList.contains('open');
    closeFilterMenus();
    d.classList.toggle('open',!was);
    if(!was){
      if(d.id==='ddScope')FSNAP=fSnap();
      const inp=d.querySelector('.msf input'); if(inp)inp.focus();
    }
  };
  const wire=(id,pick)=>{
    const d=$(id);
    d.querySelector('.ddbtn').onclick=e=>{e.stopPropagation();openOnly(d);};
    d.querySelector('.menu').addEventListener('click',e=>{
      e.stopPropagation();
      const b=e.target.closest('[data-fc],[data-fm],[data-all],[data-fclr],[data-tog],[data-only],[data-apply]');
      if(!b)return;
      const how=pick(b);
      if(how==='no-render')return;           // folding changes nothing to fetch
      /* the scope card holds its picks until Apply; every other menu applies as it
         is used */
      if(d.id==='ddScope'){
        if(!FSNAP)FSNAP=fSnap();
        if(how==='apply'){FSNAP=null;FDIRTY=true;applyFilters();return;}
        syncFilterBar();
        return;
      }
      FDIRTY=true;
      syncFilterBar();                       // the menu stays open, ticks and all
    });
    d.querySelector('.menu').addEventListener('input',e=>{
      const inp=e.target;
      if(!inp.matches('.msf input'))return;
      st.fQ=inp.value;
      syncFilterBar();
      const n=d.querySelector('.msf input');
      if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length);}
    });
  };
  wire('#ddScope',b=>{
    if(b.dataset.fclr){st.fQ='';return;}
    if(b.dataset.only){st.fOnly=!st.fOnly;return 'draft';}
    if(b.dataset.apply)return 'apply';
    /* folding is not a filter: it is toggled on the live node so the reveal can
       animate, and it leaves the selection -- and the list of runs -- alone */
    if(b.dataset.tog){
      const g=b.closest('.group'), id=b.dataset.tog;
      const shut=g.classList.contains('collapsed');
      g.classList.toggle('collapsed',!shut);
      shut?st.fCol.delete(id):st.fCol.add(id);
      return 'no-render';
    }
    fMaterialise();
    if(b.dataset.all!==undefined&&!b.dataset.fc&&!b.dataset.fm){setAll(b.dataset.all==='1');return;}
    if(b.dataset.fc)fSetConn(b.dataset.fc,connSel(b.dataset.fc)!=='all');
    else if(b.dataset.fm)setModel(b.dataset.fm,!st.fModel.has(b.dataset.fm));
    fSyncAll();
  });

  /* the period is one choice, so it is applied as it is made */
  const td=$('#ddTime');
  td.querySelector('.ddbtn').onclick=e=>{e.stopPropagation();openOnly(td);};
  td.querySelector('.menu').addEventListener('click',e=>{
    e.stopPropagation();
    const b=e.target.closest('button[data-t]');
    if(!b)return;
    st.time={kind:b.dataset.t,from:'',to:''};
    $('#rWrap').style.display='none';
    applyFilters();
  });
  $('#tCustom').onclick=e=>{
    e.stopPropagation();
    const w=$('#rWrap'), open=w.style.display==='none';
    w.style.display=open?'block':'none';
    $('#tCustom').classList.toggle('open',open);
  };
  ['#rFrom','#rTo'].forEach(id=>$(id).addEventListener('input',markEmpty));
  $('#rApply').onclick=e=>{
    e.stopPropagation();
    st.time={kind:'custom',from:$('#rFrom').value,to:$('#rTo').value};
    applyFilters();
  };
  $('#rClear').onclick=e=>{
    e.stopPropagation();
    st.time={kind:'all',from:'',to:''};
    $('#rFrom').value='';$('#rTo').value='';
    applyFilters();
  };
  $('#fClear').onclick=()=>{
    FSNAP=null;
    st.fAll=true;st.fConn.clear();st.fModel.clear();st.fQ='';st.fOnly=false;
    st.time={kind:'all',from:'',to:''};
    applyFilters();
  };
  document.addEventListener('click',closeFilterMenus);
  document.addEventListener('keydown',e=>{
    if(e.key!=='Escape')return;
    if($$('.frow .dd.open').length)closeFilterMenus();
  });
  document.addEventListener('click',e=>{
    const b=e.target.closest('#historyList [data-clearf]');
    if(b)$('#fClear').onclick();
  });
})();

/* Held on screen for the length of its exit: renderRail would otherwise hide it
   the moment the flag is set, and there would be nothing left to animate. */
let BAR_OUT=false;
/* Standing the bar down. While the run is still working there is nothing to stand
   down: the bar is progress then, not a message, and no amount of reading or
   clicking touches it -- it always survives to become the confirmation. Once the
   run has finished, the first thing done with the result takes it, for good: the
   run is rebuilt each time it is opened, so the fact has to outlive the object. */
function ackRun(){
  const b=$('#runNote');
  const r=curRun();
  if(!r)return;
  const landed=isSettled(r);
  /* Closing the working notice closes that message and nothing else: the run
     carries on, and when it lands it still has a result to report, so the success
     banner is not pre-dismissed by it. Closing the result's own banner is for
     good -- the run is rebuilt each time it is opened, so the fact has to outlive
     the object. */
  if(landed){
    if(r.barOff&&!BAR_OUT)return;           // already acknowledged
    r.barOff=true;st.barDone.add(r.id);
  }else{
    if(r.noteOff&&!BAR_OUT)return;
    r.noteOff=true;
  }
  if(!b.classList.contains('on')||REDUCED.matches){BAR_OUT=false;renderRail();return;}
  if(BAR_OUT)return;
  BAR_OUT=true;
  b.classList.add('out');
  const done=()=>{
    if(!BAR_OUT)return;
    BAR_OUT=false;b.classList.remove('out');renderRail();
  };
  b.addEventListener('animationend',done,{once:true});
  setTimeout(done,300);
}
$('#runBarX').onclick=ackRun;
/* The banner stands until it is closed. Working the result no longer takes it:
   it sits above the page rather than over it, so there is nothing for it to be in
   the way of, and dismissing it is the user's call. Everything else about standing
   it down is unchanged -- a run still working cannot be acknowledged, and once it
   has been, the run remembers. */
/* The same move as reaching for the New run tab: what is on this page carries on
   without us, and the setup page is where we land. */
$('#btnNewRun').onclick=()=>{
  document.title=BASE_TITLE;
  /* Another run starts where every run starts, at the connection -- carrying the
     one just looked at already picked, and the history it was last given, so
     repeating the run is a click away without the step being skipped for you. */
  const r=st.viewing;
  const cid=r&&r.conns.length?r.conns[0].id:null;
  st.tab='scope';
  st.stage='conn';
  if(cid){
    st.selC=new Set([cid]);st.selM=new Set();
    st.qh=st.qhBy[cid]?{...st.qhBy[cid]}:null;
  }
  $$('.seg button').forEach(x=>x.classList.toggle('is-active',x.dataset.tab==='scope'));
  paint();enter('#viewScope',-1);
};
$('#crumbBack').onclick=()=>{
  st.viewing=null;st.sel=null;
  $('#viewRun').classList.remove('open');
  paint();fade('#viewHistory');      // arrives the same way a tab does
};
$('#paneClose').onclick=()=>{
  st.sel=null;
  $('#viewRun').classList.remove('open');
  renderRail();
};
/* The models that produced instructions, in the order the list shows them -- the ones
   with nothing to read are stepped over. The ends wrap, so stepping never
   dead-ends, whether by the arrows or the arrow keys. */
/* The panel is rendered once and then left alone -- rebuilding it would drop the
   caret out of an instruction being edited -- so while a run is still landing
   models, only the two nav buttons are brought up to date. Without this they keep
   whatever they were when the panel opened, which on the first model to finish is
   nowhere to go, and they sit disabled for the rest of the run. */
let PANE_NAV=null;
function syncPaneNav(){
  const a=$('#mPrev'), b=$('#mNext');
  if(!a||!b||!st.viewing)return;
  const nav=navList();
  const at=nav.findIndex(x=>x.id===st.sel);
  const step=d=>nav.length>1&&at>=0?nav[(at+d+nav.length)%nav.length]:null;
  [[a,step(-1)],[b,step(1)]].forEach(([btn,to])=>{
    btn.disabled=!to;
    btn.title=to?model(to.id).n:'';
  });
}
function navList(){
  const r=st.viewing; if(!r)return [];
  return r.conns.flatMap(cc=>r.models.filter(x=>model(x.id).c===cc.id&&x.state==='done'));
}
/* Adding the selection to the model. The panel owns the work -- it holds the instructions
   and the button -- so it hands the closure over and this is the way in from
   anywhere else. */
let PUSH=null;
const pushSelected=()=>!!PUSH&&PUSH();
/* Copying the selection, whether asked for by the button or by the keyboard. */
function copySelected(){
  const r=st.viewing; if(!r)return false;
  const m=r.models.find(x=>x.id===st.sel); if(!m||!m.mets)return false;
  const sel=m.mets.filter(x=>x.on); if(!sel.length)return false;
  const done=()=>flashCopied();
  try{navigator.clipboard.writeText(sel.map(x=>x.text).join('\n\n')).then(done,done);}
  catch(e){done();}
  return true;
}
/* With the panel open, the copy shortcut takes the selected instructions -- unless there
   is a text selection, which the browser should copy as it normally would. */
document.addEventListener('keydown',e=>{
  if(!(e.metaKey||e.ctrlKey)||e.altKey||e.shiftKey)return;
  if((e.key||'').toLowerCase()!=='c')return;
  if(!$('#viewRun').classList.contains('open')||!st.sel)return;
  const picked=(window.getSelection&&String(window.getSelection()))||'';
  if(picked.trim())return;
  if(copySelected())e.preventDefault();
});
function stepModel(d){
  const nav=navList(); if(nav.length<2)return;
  const at=nav.findIndex(x=>x.id===st.sel); if(at<0)return;
  st.sel=nav[(at+d+nav.length)%nav.length].id;
  clearFresh(curRun(),st.sel);
  drawSel(()=>{renderRail();renderPane();});
  revealSel();
  enter('#pane',d);          // the panel travels the way you stepped
}
/* Arrow keys walk the panel, either axis. Held off while a field has focus, so
   typing in an instruction, a search box or a prompt still moves the caret. */
document.addEventListener('keydown',e=>{
  if(!$('#viewRun').classList.contains('open')||!st.sel)return;
  if(e.metaKey||e.ctrlKey||e.altKey||e.shiftKey)return;
  const t=e.target;
  if(t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable))return;
  const d=(e.key==='ArrowRight'||e.key==='ArrowDown')?1
         :(e.key==='ArrowLeft'||e.key==='ArrowUp')?-1:0;
  if(!d)return;
  e.preventDefault();
  stepModel(d);
});
function renderPane(){
  const r=st.viewing,p=$('#pane'); if(!r)return;
  closeOver();hideCopied();
  const m=r.models.find(x=>x.id===st.sel);
  const reading=!!(m&&m.state!=='queued'&&m.state!=='gen'&&m.state!=='skipped');
  $('#viewRun').classList.toggle('open',reading);
  if(!m)return;
  if(!m||m.state==='queued'||m.state==='gen'){
    const gen=r.models.find(x=>x.state==='gen');
    const tables=r.conns.reduce((a,c)=>a+c.total,0);
    let msg;
    if(gen)msg=DOTS()+' Generating instructions for '+model(gen.id).n;
    else if(r.state==='running')msg=DOTS()+' Reading query history';
    else if(!r.models.length)msg=`Query history scanned · ${r.conns.length} connection${r.conns.length>1?'s':''} · ${tables} tables`;
    else msg='Select a model';
    p.className='pane paneEmpty';
    p.innerHTML=`<span class="mono dim">${msg}</span>`;
    return;
  }
  p.className='pane';
  const md=model(m.id),c=conn(md.c),b=blockFor(m.id);

  if(m.state==='nosignal'){
    p.innerHTML=`<div class="inner">
      <span class="lbl">${c.n}</span><h2>${md.n}</h2>
      <div class="rad-banner rad-banner--muted notice"><span class="rad-banner__body rd-body"
        >Not enough signal to suggest instructions for this model.<br
        ><span class="mono dim">41 queries over ${r.win} days · 2 users · no repeated formula, filter or join pattern above threshold</span></span></div>
      <div class="acts"><span class="mono dim">Start a new run to read this model again.</span></div></div>`;
    return;
  }
  if(m.state==='failed'){
    p.innerHTML=`<div class="inner">
      <span class="lbl">${c.n}</span><h2>${md.n}</h2>
      <div class="rad-banner rad-banner--failure notice" role="alert"><span class="rad-banner__icon"
        aria-hidden="true">${RIC('exclamation-point-circle',16)}</span><span class="rad-banner__body rd-body"
        >Generation failed for this model.<br
        ><span class="mono dim">1 of ${c.t} tables in ${c.n} could not be read, and this model depends on it.</span></span></div>
      <div class="acts"><span class="mono dim">Start a new run to try this model again.</span></div></div>`;
    return;
  }

  const mets=m.mets||[];
  const on=()=>mets.filter(x=>x.on);
  const nav=navList();
  const at=nav.findIndex(x=>x.id===m.id);
  const step=d=>nav.length>1&&at>=0?nav[(at+d+nav.length)%nav.length]:null;
  const prev=step(-1), next=step(1);
  PANE_NAV=syncPaneNav;   // so a model landing mid-run can bring the two up to date

  p.innerHTML=`<div class="phd">
      <div class="pnav">
        <button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small navb" id="mPrev" ${prev?'':'disabled'}
          title="${prev?escAttr(model(prev.id).n):''}" aria-label="Previous model"
          ><span class="rad-iconbtn__icon">${RIC('arrow-left',14)}</span></button>
        <button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small navb next" id="mNext" ${next?'':'disabled'}
          title="${next?escAttr(model(next.id).n):''}" aria-label="Next model"
          ><span class="rad-iconbtn__icon">${RIC('arrow-right',14)}</span></button>
      </div>
      <span class="lbl">${c.n}</span>
      <h2><a class="rad-link rad-link--medium rad-link--black rad-link--underline mlink"
        id="aOpen" title="Opens in ThoughtSpot, in a new tab">${md.n}<span
        class="ext">${RIC('arrow-up-right',13)}</span></a></h2>
      <div class="rad-banner rad-banner--success panenote" id="paneNote" role="status"
      ><span class="rad-banner__icon" aria-hidden="true">${RIC('checkmark-circle',16)}</span
      ><span class="rad-banner__body rd-body" id="paneNoteMsg"></span
      ><button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small"
        id="paneNoteX" aria-label="Dismiss"
        ><span class="rad-iconbtn__icon">${RIC('cross',14)}</span></button></div>
      <div class="mhd"><span class="sall" id="mAllWrap"><span class="sallin"
          ><span class="rad-link rad-link--gray" id="mAll">select all</span
          ><span class="vr"></span></span></span
        ><span id="mCount"><span class="cnt" id="mCountFold"><span class="cntin" id="mCountRun"
          ><span id="mCountNum"></span>&nbsp;<span id="mCountWord"></span></span></span
          ><span class="cpd" id="mCopied"></span></span
        ><button class="rad-btn rad-btn--basic rad-btn--primary" id="mPush" aria-live="polite"
          ><span class="rad-btn__icon" aria-hidden="true"></span
          ><span class="rad-btn__label">Add to model</span></button></div>
    </div>
    <div class="pbody"><div class="mlist">${mets.map((x,i)=>metCard(x,i)).join('')}</div></div>`;

  /* Toggling and rating are local: re-rendering the whole panel for them would
     drop the caret out of an instruction being edited. */
  const cards=()=>$$('#pane .met');
  function syncBar(){
    const n=on().length;
    $('#mAll').textContent=n===mets.length?'deselect all':'select all';
    collapseX('#mAllWrap',true);   // after the label: the fold is measured off it
    paintCount(n,mets.length);
    $('#mCount').classList.toggle('strong',n>0);
    $('#mPush').disabled=n===0;
    cards().forEach((el,i)=>{
      el.classList.toggle('off',!mets[i].on);
      el.querySelector('.rad-check__input').checked=mets[i].on;
    });
  }
  /* Both are the model's own: a panel opened on one that is still writing shows
     its band, and one that has been written shows what it got. */
  paintPaneNote(m);
  paneWriting(!!m.pushing);
  $('#paneNoteX').onclick=()=>{m.addedOff=true;paintPaneNote(m);};
  syncBar();
  softEdges($('.pbody'));

  $$('#pane .met .mbody').forEach(el=>{
    const i=+el.dataset.txt;
    el.oninput=()=>{mets[i].text=el.textContent;};
  });
  $$('#pane [data-tog]').forEach(el=>el.onclick=()=>{
    mets[+el.dataset.tog].on=!mets[+el.dataset.tog].on;
    hideCopied();                     // the count changed, so the word no longer holds
    syncBar();
  });
  const paintVotes=i=>cards()[i].querySelectorAll('.ic').forEach(ic=>{
    const v=+ic.dataset.vote.split(':')[1], on=mets[i].vote===v;
    ic.classList.toggle('on',on);
    /* and the glyph fills: in Radiant the "-undo" thumb is the same outline with
       its cut-out closed, which is the given-rating state */
    ic.querySelector('.rad-iconbtn__icon').innerHTML=
      RIC((v===1?'thumb-up':'thumb-down')+(on?'-undo':''),15);
  });
  $$('#pane [data-vote]').forEach(el=>el.onclick=()=>{
    const [i,v]=el.dataset.vote.split(':').map(Number);
    const was=mets[i].vote;
    mets[i].vote=was===v?0:v;                          // clicking again clears it
    paintVotes(i);
    if(mets[i].vote===-1)askWrong(m,i,el);             // a dislike asks what went wrong
    else closeOver();
  });
  $$('#pane [data-src]').forEach(el=>el.onclick=()=>showSrc(mets[+el.dataset.src],el));

  $('#mAll').onclick=()=>{
    const all=on().length===mets.length;
    mets.forEach(x=>x.on=!all);hideCopied();syncBar();
  };
  /* Writing them into the model is the point of the whole run, so the button says so
     while it happens and the counter says so afterwards. Nothing else changes: what
     was selected stays selected, and the panel is where it was before. */
  PUSH=()=>{
    const sel=on(); if(!sel.length)return false;
    // the panel runs the page's band on its own top edge while it writes
    m.pushing=true; paneWriting(true);
    pushBusy(true);
    setTimeout(()=>{
      m.pushing=false;
      m.applied=true;
      m.addedN=sel.length; m.addedAt=fmtWhen(NOW); m.addedOff=false;
      /* The panel may have moved on while this was in flight. The record belongs
         to the model either way; only the panel actually showing it reports back,
         and opening it again picks the record up. */
      if(st.sel!==m.id)return;
      paneWriting(false);
      pushBusy(false);
      paintPaneNote(m);
      syncBar();
    },3000);   // long enough that the band and the spinner are actually read
    return true;
  };
  $('#mPush').onclick=()=>pushSelected();
  const goTo=(t,d)=>{if(!t)return;clearFresh(curRun(),t.id);
    st.sel=t.id;drawSel(()=>{renderRail();renderPane();});revealSel();enter('#pane',d);};
  $('#mPrev').onclick=()=>goTo(prev,-1);
  $('#mNext').onclick=()=>goTo(next,1);
  /* The name is the model's, not a slot for status: following the link leaves the
     portal, so there is nothing for this page to report back. */
}

/* the copy note's own timer; nothing else beside the counter is on a clock */
let CPD=null;
/* The counter counts and nothing else -- what the write produced is the panel's
   banner, which stands until it is closed. The figure still travels rather than
   cutting: gaining a digit changes the line's length, and collapseX, the helper
   the lists' select-all uses, moves it as one. */
function paintCount(n,total){
  $('#mCountNum').textContent=`${n}/${total}`;
  $('#mCountWord').textContent='selected';
  collapseX('#mCountFold',true,false);   // it changes length, never presence
}
/* Adding is the button's own state: it keeps its place and its colour, takes the
   spinner as a leading icon and says what it is doing. */
function pushBusy(on){
  const btn=$('#mPush'); if(!btn)return;
  btn.classList.toggle('is-busy',on);
  btn.querySelector('.rad-btn__icon').innerHTML=on?SPIN(16,'white'):'';
  btn.querySelector('.rad-btn__label').textContent=on?'Adding':'Add to model';
}
function flashCopied(){
  const el=$('#mCopied'); if(!el)return;
  // a leading space would collapse at the start of the clipped box
  el.innerHTML='&nbsp;<span class="sweepacc">and copied</span>';
  el.style.maxWidth=el.scrollWidth+'px';       // content width, measured while collapsed
  el.classList.add('on');
  clearTimeout(CPD);
  CPD=setTimeout(hideCopied,3000);
}
function hideCopied(){
  clearTimeout(CPD);
  const el=$('#mCopied'); if(!el)return;
  el.classList.remove('on');el.style.maxWidth='0px';
  // clear the words once they are out of sight, so nothing stale is left to read
  CPD=setTimeout(()=>{if(!el.classList.contains('on'))el.innerHTML='';},520);
}

/* ---- hover summary -------------------------------------------------------
   What a read actually produced, on the connection's own name. */
let TIP=null;
function tipShow(anchor,html){
  tipHide();
  const el=document.createElement('div');
  el.className='rad-tooltip tip';el.innerHTML=html;
  document.body.appendChild(el);TIP=el;
  const r=anchor.getBoundingClientRect();
  // above the glyph by default: below it, the cursor itself covers the first row
  let l=r.left,t=r.top-8-el.offsetHeight;
  if(l+el.offsetWidth>innerWidth-12)l=Math.max(12,innerWidth-12-el.offsetWidth);
  if(t<12)t=Math.min(innerHeight-12-el.offsetHeight,r.bottom+8);   // no room above
  el.style.left=l+'px';el.style.top=t+'px';
  const show=()=>{if(TIP===el)el.classList.add('in');};
  requestAnimationFrame(show);setTimeout(show,40);   // rAF alone is throttled
}
function tipHide(){if(TIP){TIP.remove();TIP=null;}}
/* what the read actually produced, in the run's own numbers */
function connTip(c,r){
  const ms=r.models.filter(m=>model(m.id).c===c.id);
  const withMets=ms.filter(m=>m.state==='done');
  // the read covered every model behind the connection, whether or not instructions were
  // generated for it, so the query count follows all of them
  const q=ms.reduce((a,m)=>a+blockFor(m.id).q,0);
  const row=(k,v)=>`<div class="trow"><span class="tk">${k}</span><span class="tv">${v}</span></div>`;
  return row('tables read',`${c.read}/${c.total}`)
       + row('queries scanned',nf(q))
       + row('scan window',windowLabel(r))
       + row('models with instructions',`${withMets.length}/${ms.length}`);
}

/* ---- overflow cards ----------------------------------------------------- */
/* One at a time, anchored to whatever opened it and positioned in viewport
   coordinates, so a card is never clipped by the panel's own scroll box. */
const OVER={el:null,anchor:null,key:null};
function closeOver(){
  if(!OVER.el)return;
  OVER.el.remove();OVER.el=null;OVER.anchor=null;OVER.key=null;
}
function placeOver(){
  if(!OVER.el)return;
  const r=OVER.anchor.getBoundingClientRect(),el=OVER.el;
  const w=el.offsetWidth,h=el.offsetHeight;
  // the panel's own bar is the real floor, not the window: a card must not land
  // on top of the bar it would otherwise cover
  const floor=innerHeight-12;
  let l=Math.max(12,r.left),t=r.bottom+8;
  if(l+w>innerWidth-12)l=Math.max(12,innerWidth-12-w);
  if(t+h>floor)t=Math.max(12,r.top-8-h);            // flip above when it won't fit
  el.style.left=l+'px';el.style.top=t+'px';
}
function openOver(anchor,key,cls,html,wire){
  if(OVER.key===key){closeOver();return;}
  closeOver();
  const el=document.createElement('div');
  el.className='pop '+cls;el.innerHTML=html;
  document.body.appendChild(el);
  OVER.el=el;OVER.anchor=anchor;OVER.key=key;
  const xb=el.querySelector('[data-ex-x]');if(xb)xb.onclick=closeOver;
  placeOver();
  if(wire)wire(el);
  // the timer is the guarantee: rAF is throttled in a backgrounded tab, and the
  // card must never be left sitting at zero opacity
  const show=()=>{if(OVER.el===el)el.classList.add('in');};
  requestAnimationFrame(show);setTimeout(show,40);
}
document.addEventListener('mousedown',e=>{
  if(!OVER.el)return;
  if(OVER.el.contains(e.target)||OVER.anchor.contains(e.target))return;
  closeOver();
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeOver();});
addEventListener('resize',placeOver);
document.addEventListener('scroll',placeOver,true);

function showSrc(x,anchor){
  if(!x.src)return;
  /* the source reads as an Explainer card: what the rule is, the evidence behind
     it, and the query it was read from sitting in the card's media slot */
  openOver(anchor,'src:'+anchor.dataset.src,'psrc',
    EXCARD({title:escHTML(x.src.t),
            body:`<span class="evline mono dim">${escHTML(x.src.ev)}</span>`,
            media:`<pre>${escHTML(x.src.sql).split('\n')
                     .map(l=>`<span>${l}</span>`).join('')}</pre>`}));
}
const WRONG=['Wrong definition','Not a real rule','Duplicate','Too narrow','Reads badly'];
function askWrong(m,i,anchor){
  const x=m.mets[i];
  openOver(anchor,'down:'+i,'pdown',
    EXCARD({title:'What went wrong?',
      /* Radiant's token chip: the gray token at rest, the blue one once picked. */
      body:`<div class="chips">${WRONG.map(w=>
         `<button type="button" data-w="${escAttr(w)}" class="chip rad-chip rad-chip--${
            (x.wrong||[]).includes(w)?'attribute':'filter'}"
            ><span class="rad-chip__label">${w}</span></button>`).join('')}</div>
        <div class="rad-field"><div class="rad-field__box"><input
           placeholder="Anything else? (optional)" value="${escAttr(x.wnote||'')}"></div></div>`,
      actions:`<button class="rad-btn rad-btn--basic rad-btn--primary" data-go>Send feedback</button>`}),
    el=>{
      const inp=el.querySelector('input');
      el.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{
        const w=ch.dataset.w,list=x.wrong||(x.wrong=[]);   // any number of reasons
        const at=list.indexOf(w);
        at<0?list.push(w):list.splice(at,1);
        ch.classList.toggle('rad-chip--attribute',at<0);
        ch.classList.toggle('rad-chip--filter',at>=0);
      });
      inp.oninput=()=>x.wnote=inp.value;
      el.querySelector('[data-go]').onclick=closeOver;   // sending closes the card
    });
}
const escAttr=s=>escHTML(s).replace(/"/g,'&quot;');
function metCard(x,i){
  /* While an instruction is being regenerated the card holds the height it had, so the
     list does not jump, and its own controls step aside -- there is nothing to
     rate or regenerate until the new text lands. */
  const pin=x.busy&&x.h?` style="min-height:${x.h}px"`:'';
  return `<div class="met${x.on?'':' off'}${x.busy?' busy':''}"${pin}>
    <div class="mtop">
      ${CHECK(x.on?'on':'',`data-tog="${i}"`)}
      ${x.busy
        ? `<span class="work">${DOTS('acc')}<span class="mono acc shimmer" ${SHIM()}>regenerating</span></span>`
        : `<div class="mtxt">${x.title?`<strong class="mttl">${escHTML(x.title)}</strong><span class="mdash"> — </span>`:''}<span
             class="mbody" contenteditable="true" spellcheck="false" data-txt="${i}">${escHTML(x.text)}</span></div>`}
    </div>
    ${x.busy?'':`<div class="mact">
      <span class="vote">
        <button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small ic${x.vote===1?' on':''}"
          data-vote="${i}:1" title="Good suggestion" aria-label="Good suggestion"
          ><span class="rad-iconbtn__icon">${RIC(x.vote===1?'thumb-up-undo':'thumb-up',15)}</span></button>
        <button type="button" class="rad-iconbtn rad-iconbtn--ghost rad-iconbtn--small ic${x.vote===-1?' on':''}"
          data-vote="${i}:-1" title="Not useful" aria-label="Not useful"
          ><span class="rad-iconbtn__icon">${RIC(x.vote===-1?'thumb-down-undo':'thumb-down',15)}</span></button>
      </span>
      ${x.src?`<span class="vr"></span><span class="rad-link rad-link--small rad-link--gray" data-src="${i}">sources</span>`:''}
    </div>`}
  </div>`;
}
const cardHeight=i=>{
  const el=$$('#pane .met')[i];
  return el?Math.round(el.getBoundingClientRect().height):0;
};

/* ============================== HISTORY ============================== */
/* A run is worth three things after the fact: what it scanned, what came out of it,
   and the period it covered. The live run appears here too, still running. */
/* Which period a run belongs to, and what that period is called. Weeks start on
   Monday; a run with an unreadable stamp falls into its own bucket rather than
   being dropped. */
function bucket(r){
  const d=parseTs(r.ts);
  if(!d)return {key:'x',label:r.ts,sort:0};
  if(st.grp==='year')return {key:'y'+d.getFullYear(),label:''+d.getFullYear(),
    sort:d.getFullYear()*10000};
  if(st.grp==='month')return {key:'m'+d.getFullYear()+'-'+d.getMonth(),
    label:`${MONTHS_FULL[d.getMonth()]} ${d.getFullYear()}`,
    sort:d.getFullYear()*10000+d.getMonth()*100};
  return {key:'d'+d.toDateString(),label:fmtD(d),
    sort:new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime()};
}
/* Changing the grouping or the period rearranges the cards: the ones that stay
   slide to their new places, the ones that no longer apply fade out from where they
   were, and any that come into range arrive. */
function renderLogs(){
  const list=$('#historyList');
  const prev=new Map();
  $$('#historyList .rcard[data-k]').forEach(el=>{
    // measured while the node is still in the document: a detached one reports
    // whatever it likes, which is how a ghost ended up with the other column's
    // padding and jumped sideways
    const cs=getComputedStyle(el);
    prev.set(el.dataset.k,{el,top:el.offsetTop,left:el.offsetLeft,
      w:el.offsetWidth,h:el.offsetHeight,
      pad:`${cs.paddingTop} ${cs.paddingRight} ${cs.paddingBottom} ${cs.paddingLeft}`});
  });
  flipRender(renderHistory);                       // survivors slide
  const now=new Set($$('#historyList .rcard[data-k]').map(el=>el.dataset.k));
  if(REDUCED.matches)return;
  prev.forEach((p,k)=>{
    if(now.has(k))return;
    const g=p.el.cloneNode(true);
    g.classList.add('ghost');
    /* The padding is carried over from the snapshot: out of its column, the clone
       would otherwise pick up the other column's padding and border and jump
       sideways just before it fades. */
    g.setAttribute('style',`position:absolute;left:${p.left}px;top:${p.top}px;`
      +`width:${p.w}px;height:${p.h}px;margin:0;border:0;pointer-events:none;`
      +`padding:${p.pad}`);
    list.appendChild(g);
    const a=g.animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(10px)'}],
      {duration:380,easing:'cubic-bezier(.4,0,.7,.3)',fill:'forwards'});
    const done=()=>g.remove();
    a.finished.then(done,done);setTimeout(done,460);
  });
  $$('#historyList .rcard[data-k]').forEach(el=>{
    if(prev.has(el.dataset.k))return;
    el.classList.add('cardin');
    const off=()=>el.classList.remove('cardin');
    el.addEventListener('animationend',off,{once:true});
    setTimeout(off,560);
  });
}
/* The unit follows the span on screen: days while a month or less is in view,
   months up to a couple of years, years beyond that. Nobody has to be asked. */
function deriveGrp(rows){
  const ds=rows.map(x=>parseTs(x.r.ts)).filter(Boolean).map(dayNum);
  if(ds.length<2)return 'day';
  const span=(Math.max(...ds)-Math.min(...ds))/DAY;
  return span<=31?'day':span<=730?'month':'year';
}
function renderHistory(){
  // a stored run whose live copy is already listed is the same run, not a second one
  syncFilterBar();
  const rows=logRows().filter(x=>matchFilters(x.r));
  st.grp=deriveGrp(rows);                    // the period filter reads its unit off this
  const total=logRows().length;
  /* A shortened list can mean few runs or a narrow question: the count says which,
     and is what makes `clear filters` read as the way back out. */
  $('#grpNote').textContent=anyFilter()
    ? `${rows.length} of ${total} run${total>1?'s':''}`
    : '';
  if(!rows.length){
    $('#historyList').innerHTML=`<div class="rempty mono dim"><span>${
      anyFilter()?'No runs match these filters':'No runs yet'}</span>${
      anyFilter()?'<span class="rad-link rad-link--small rad-link--gray" data-clearf="1">clear filters</span>':''}</div>`;
    return;
  }
  /* The connection is what somebody comes here about -- "when was Sales last read"
     -- so it is what the list is made of, and its runs hang under it as a thread.
     A run that scanned two connections belongs to both, and is listed under each. */
  const at=it=>{const d=parseTs(it.r.ts);return d?d.getTime():0;};
  const groups=new Map();
  rows.forEach(it=>runConnIds(it.r).forEach(cid=>{
    if(!connOf(cid))return;
    if(!groups.has(cid))groups.set(cid,[]);
    groups.get(cid).push(it);
  }));
  const list=[...groups.entries()].map(([cid,items])=>{
    const sorted=items.slice().sort((a,b)=>at(b)-at(a));      // newest run first
    return {cid,items:sorted,last:at(sorted[0])};
  }).sort((a,b)=>b.last-a.last);                              // last read, first shown
  // the connection read most recently is the one already open
  if(!st.lcOpen)st.lcOpen=new Set([list[0].cid]);
  const lrun=(cid,{r,live})=>{
    // listed under this connection, so it counts what came out of this connection
    const mets=runMetIds(r).filter(id=>model(id)&&model(id).c===cid).length;
    /* Two things are worth saying about a run: that it is working, and that
       something has landed in it since it was last opened. */
    const isNew=!live&&st.newRuns.has(r.id);
    /* What a past run is, in a list of them, is what came out of it -- so the count
       names the row and the stamp says when it happened. */
    return `<div class="rad-listitem lrun" data-k="lr:${cid}:${r.id}"
      data-r="${r.id}" data-open="${r.id}">
      <span class="lmet">${mets?`${mets} model${mets===1?'':'s'} with instructions`
        :'no instructions'}</span>
      ${live?`<span class="st mono acc">${DOTS('acc')}running</span>`
           :(isNew?'<span class="st"><span class="rad-tag rd-body">new</span></span>':'')}
      <span class="grow"></span>
      <span class="lwhen mono dim">${fmtWhen(r.ts)}</span>
      <span class="rgo">${RIC('chevron-right',15)}</span>
    </div>`;};
  $('#historyList').innerHTML=list.map(g=>{
    const c=connOf(g.cid), n=g.items.length;
    const shut=!st.lcOpen.has(g.cid);
    const running=g.items.some(x=>x.live);
    const fresh=g.items.some(x=>!x.live&&st.newRuns.has(x.r.id));
    const lastD=new Date(g.last);
    return `<div class="lconn group${shut?' collapsed':''}" data-k="lc:${g.cid}">
      <div class="tname can-toggle" data-k="lch:${g.cid}" data-toggle="${g.cid}">
        <span class="lbl">${escHTML(c.n)}</span>
        <span class="chev">${RIC('chevron-right',15)}</span>
        ${running?`<span class="st mono acc">${DOTS('acc')}running</span>`
                 :(fresh?'<span class="st"><span class="rad-tag rd-body">new</span></span>':'')}
        <span class="leader"></span>
        <span class="gcount mono dim">${n} run${n>1?'s':''}<span class="vr"></span>last read ${
          g.last?fmtD(lastD):'--'}</span>
      </div>
      <div class="slot"><div class="sinner lruns">${
        g.items.map(it=>lrun(g.cid,it)).join('')}</div></div>
    </div>`;}).join('');
  // toggled on the live node rather than re-rendered, so the thread can animate open
  $$('#historyList [data-toggle]').forEach(el=>{
    const id=el.dataset.toggle;
    el.onclick=()=>{
      const g=el.closest('.lconn');
      const shut=g.classList.contains('collapsed');
      g.classList.toggle('collapsed',!shut);
      shut?st.lcOpen.add(id):st.lcOpen.delete(id);
    };
  });
  $$('#historyList [data-open]').forEach(el=>el.onclick=()=>{
    const id=el.dataset.open;
    // a run still going belongs in Current, where it is being watched; everything
    // else opens here, as a log entry with a way back
    st.newRuns.delete(id);        // opening it is what makes it no longer new
    /* A run working out of sight is opened as itself, not rebuilt: it is still
       producing, and its loaders belong to the object doing the work. */
    const live=runById(id), p=st.runs.find(x=>x.id===id);
    const r=live||(p?hydrate(p):null);
    if(!r)return;
    // whether this run's own completion has been shown before opening it now
    const runSeen=st.doneSeen.has(id);
    if(isSettled(r))st.doneSeen.add(id);
    // owed its confirmation until it has been acknowledged, whenever that was
    r.barOff=st.barDone.has(id);
    st.viewing=r;
    st.sel=null;                                  // the list first, not an instruction
    $('#viewRun').classList.remove('open');
    loadThen('Loading run results',1100,()=>{
      fade(RUNBODY);
      /* A run opened afresh starts at the top of its own list. Without this the
         list keeps the scroll position from the last time it was read, and the
         model that opens itself -- the topmost one -- is reached by scrolling all
         the way back up, in front of the user. */
      const list=$('#runList'); if(list)list.scrollTop=0;
      openOnArrival(r,runSeen);
    });
  });
}
/* A stored run holds only the models that were chosen for it, but the connections it
   scanned still contain everything else -- so the run is rebuilt the way a live one
   is: every model behind those connections, with the ones that were not chosen left
   as offers to generate later. */
function hydrate(p){
  const picked=new Set(p.models);
  const r={id:p.id,ts:p.ts,win:p.win,timers:new Set(),
    conns:p.conns.map(id=>({id,total:conn(id).t,read:conn(id).t,state:'done'})),
    models:MODELS.filter(m=>p.conns.includes(m.c)).map(m=>({
      id:m.id,state:picked.has(m.id)?'queued':'skipped',
      text:null,orig:null,applied:false})),
    state:'done'};
  return completeRun(r);
}

/* ============================== PROTOTYPE CONTROLS ============================== */
if(/[?&]proto\b/.test(location.search))$('#proto').classList.add('show');
$('#proto .tog').onclick=()=>$('#proto').classList.toggle('open');
$$('#proto .body button[data-go]').forEach(b=>b.onclick=()=>proto(b.dataset.go));
/* Both themes are in the token sheet, so which one the portal wears is one attribute.
   It lives on the prototype's own panel rather than in the product: the portal ships
   in one theme, and this is only here so a demo can show the other. */
const setTheme=t=>{
  document.documentElement.dataset.theme=t;
  $$('#proto [data-theme-set]').forEach(b=>b.classList.toggle('on',b.dataset.themeSet===t));
};
$$('#proto [data-theme-set]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
setTheme(document.documentElement.dataset.theme||'light');

function preselect(){
  st.selC=new Set(['c1']);
  st.selM=new Set(['sales-perf','pipeline','quota','rep-activity']);
  st.stage='model';
}
/* a made-up run, dropped into the logs and opened, the way a real one arrives */
function showDone(r,sel){
  st.live.push(r);st.viewing=r;st.sel=sel;st.tab='history';
  $$('.seg button').forEach(x=>x.classList.toggle('is-active',x.dataset.tab==='history'));
  go('app');
}
function proto(k){
  liveRuns().forEach(stopRun);
  TIMERS.forEach(t=>{clearInterval(t);clearTimeout(t);});TIMERS.clear();
  st.live=[];
  st.viewing=null;st.sel=null;st.filter='';st.connQ='';st.runQ='';st.tab='scope';
  $('#runSearch').value='';$('#viewRun').classList.remove('open');
  $('#connSearch').value='';$('#modelSearch').value='';syncClear('conn');syncClear('model');
  $$('.seg button').forEach(x=>x.classList.toggle('is-active',x.dataset.tab==='scope'));
  if(k==='reset'){
    st.selC=new Set();st.selM=new Set();st.stage='conn';st.qh=null;
    go('app');return;
  }
  if(k==='scope'){st.selC=new Set();st.selM=new Set();st.stage='conn';go('app');return;}
  if(k==='preselect'){preselect();go('app');return;}
  if(k==='running'){
    st.selC=new Set(['c1']);
    st.selM=new Set(['sales-perf','pipeline','quota','rep-activity']);
    st.stage='model';go('app');startRun();return;}
  if(k==='done'){preselect();showDone(completeRun(newRun()),'sales-perf');return;}
  if(k==='nosignal'){
    st.selC=new Set(['c12']);st.selM=new Set(['sandbox','scenario']);st.stage='model';
    showDone(completeRun(newRun()),'sandbox');return;
  }
  if(k==='partial'){
    st.selC=new Set(['c4']);st.selM=new Set(['adoption','experiments','sessions']);st.stage='model';
    showDone(completeRun(newRun(),{partial:true,failed:'experiments'}),'experiments');return;
  }
}
